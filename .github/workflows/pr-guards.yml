name: PR guards (version tails · success locks · rework causes · Codex review)

# 2026-11-22 一週重工回顧:最常見的兩種重工在合併前就攔下(說明在兩支腳本的檔頭)。
#  · version-tails:PR 新增的程式版號插到 base 尾版底下(會悄悄改掉薄尾前版鏈)、或改 / 刪已鎖成功的檔 → 紅。
#  · codex-status:Codex 沒審完最新 commit / 有未解討論串 → PR 檢查列的「Codex 審查」不是綠。
# 兩個 job 都只讀 git 物件與 PR 資料;不執行 PR 裡的程式。

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR 號碼(resolve 討論串後手動重算 Codex 狀態)"
        required: true

permissions:
  contents: read
  pull-requests: read
  statuses: write

# 只有 pull_request(新推送)才取消同一 PR 舊的那一輪(舊 commit 上的檢查本來就作廢)。
# 留言 / 審查 / resolve 觸發的 Codex 狀態重算每一輪各自一組、不互相取消:幾秒內連來好幾個事件時,
# 舊設定會把前面幾輪標成 cancelled,PR 檢查列就出現「取消」、mergeable_state 變 unstable(PR 724 實錄)。
# 幾輪同時跑時可能「舊讀晚寫」:codex_gate.py 的 settle() 寫完再讀一次,不同就照新讀到的重寫,最後留下的一定是最新狀態(PR 725 Codex P2)。
concurrency:
  group: pr-guards-${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr }}-${{ github.event_name == 'pull_request' && 'tails' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  version-tails:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # 守門程式一律從 base(受信任的那一版)取,不跑 PR 自己帶的版本:PR 換掉 pr_guard.py 也繞不過(PR 717 Codex P1)。
      # PR 的內容只當 git 物件讀(diff / show),不執行。
      - name: Load the guard from the base revision
        run: |
          mkdir -p "$RUNNER_TEMP/guard"
          if git cat-file -e "origin/${{ github.base_ref }}:.github/scripts/pr_guard.py" 2>/dev/null; then
            git show "origin/${{ github.base_ref }}:.github/scripts/pr_guard.py" > "$RUNNER_TEMP/guard/pr_guard.py"
          else
            echo "base 上還沒有 pr_guard.py:這次用 PR 帶的版本(只有引入守門的那一支 PR 會走這裡)"
            cp .github/scripts/pr_guard.py "$RUNNER_TEMP/guard/pr_guard.py"
          fi
      - name: Guard selftest (base version)
        run: python3 "$RUNNER_TEMP/guard/pr_guard.py" --selftest
      - name: Version tails and success locks
        run: python3 "$RUNNER_TEMP/guard/pr_guard.py" --repo . --base "origin/${{ github.base_ref }}" --head HEAD

  # 2026-11-24 一週重工回顧(13 類根因 · 本週 89 條教訓):VIA_ReworkGuard 把每一類寫成偵測器,每一項附解法與指令。
  # 一樣從 base 取守門程式(連同它呼叫的 pr_guard.py),PR 的內容只當 git 物件與檔案讀,不執行。紅 = 擋;黃 = 只提醒(寫進摘要)。
  rework-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Load the rework guard from the base revision
        run: |
          mkdir -p "$RUNNER_TEMP/rework"
          # 重工守門取 base 上的尾版(版號最大那支 + 它的前版鏈,薄尾要前版在同一夾);base 還沒有就用 PR 帶的。
          D="VeritasIntelligenceAnalytics/docs/handoff/ai"
          SRC="origin/${{ github.base_ref }}"
          git ls-tree --name-only "$SRC" "$D/" | grep -q 'VIA_ReworkGuard_v' || SRC="HEAD"
          for f in $(git ls-tree --name-only "$SRC" "$D/" | grep 'VIA_ReworkGuard_v[0-9]*\.py$'); do
            git show "$SRC:$f" > "$RUNNER_TEMP/rework/$(basename "$f")"
          done
          ls "$RUNNER_TEMP/rework/" | sort | tail -1 > "$RUNNER_TEMP/rework/TAIL"
          for f in .github/scripts/pr_guard.py; do
            if git cat-file -e "origin/${{ github.base_ref }}:$f" 2>/dev/null; then
              git show "origin/${{ github.base_ref }}:$f" > "$RUNNER_TEMP/rework/$(basename "$f")"
            else
              echo "base 上還沒有 $f:這次用 PR 帶的版本(只有引入它的那一支 PR 會走這裡)"
              cp "$f" "$RUNNER_TEMP/rework/$(basename "$f")"
            fi
          done
          # v0100 的自測往上找 .github/scripts/pr_guard.py(在倉裡跑時就是倉根);CI 的暫存夾上面沒有 .github → 放一份在同一棵樹裡
          mkdir -p "$RUNNER_TEMP/rework/.github/scripts"
          cp "$RUNNER_TEMP/rework/pr_guard.py" "$RUNNER_TEMP/rework/.github/scripts/pr_guard.py"
      - name: Fetch open PR heads (number and version collisions across lines)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch -q origin '+refs/pull/*/head:refs/remotes/pr/*' || true
          echo "VIA_OPEN_PRS=$(gh pr list --repo '${{ github.repository }}' --state open --limit 200 --json number -q '.[].number' | grep -vx '${{ github.event.pull_request.number }}' | tr '\n' ' ')" >> "$GITHUB_ENV"
      - name: Rework guard selftest (base version)
        run: python3 "$RUNNER_TEMP/rework/$(cat "$RUNNER_TEMP/rework/TAIL")" --selftest
      - name: Rework causes on this PR
        run: |
          set +e
          python3 "$RUNNER_TEMP/rework/$(cat "$RUNNER_TEMP/rework/TAIL")" check --repo . --base "origin/${{ github.base_ref }}" --head HEAD
          rc=$?
          if [ "$rc" -eq 1 ]; then exit 1; fi
          exit 0

  codex-status:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
      - name: Codex review status on the PR head
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f .github/scripts/codex_gate.py ]; then python3 .github/scripts/codex_gate.py
          else echo "codex_gate.py 還沒合進 ${{ github.event.repository.default_branch }}:這次略過"; fi
