<script>
// auto-optimize tables: balance column widths, shrink font to fit, else scroll
function autofitTables(){
  document.querySelectorAll('table').forEach(t=>{
    const wrap=t.parentElement; if(!wrap) return;
    t.style.fontSize=''; let fs=parseFloat(getComputedStyle(t).fontSize)||12;
    let guard=0;
    while(t.scrollWidth>wrap.clientWidth+1 && fs>9.5 && guard<10){fs-=0.5;t.style.fontSize=fs+'px';guard++;}
  });
}
window.addEventListener('resize',autofitTables);
window.addEventListener('load',autofitTables);
setTimeout(autofitTables,300);
</script></body></html>
