function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){
 const qq=q.value.toLowerCase().trim();
 const gg=gt.value;
 const rows=ICONS.filter(x=>{
   if(gg && x.GroupType!==gg)return false;
   if(qq){
     const hay=[x.FileName,x.RelativePath,x.Role,x.GroupType,x.ShaShort].join(' ').toLowerCase();
     if(!hay.includes(qq))return false;
   }
   return true;
 });
 shown.innerText='Showing '+rows.length+' / '+ICONS.length;
 grid.innerHTML=rows.map(x=>{
   const badges=[x.SameShaGroup?'<span class="badge sha">SHA</span>':'',x.SameSourceGroup?'<span class="badge src">SRC</span>':'',x.SameSizeGroup?'<span class="badge size">SIZE</span>':''].join('');
   return '<div class="card"><div class="thumb"><img loading="lazy" src="'+x.FileUri+'" onerror="this.parentElement.innerHTML=<span class=path>Image load failed</span>"></div><div class="meta"><div class="name">'+esc(x.FileName)+'</div>'+badges+'<div class="path">'+esc(x.RelativePath)+'</div></div></div>';
 }).join('');
}

 const blob=new Blob([JSON.stringify(ICONS,null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='VAP_VIA-Core_Icon_Assignment.json';a.click();URL.revokeObjectURL(a.href);
}
