<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIA AutoPlot Ultimate — 智慧資產編號儲存系統</title>
    
    <!-- Libraries -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
/* ═══════════════════════════════════════════════════════════════════════════════
   VIA AUTOPLOT ULTIMATE - 智慧資產編號儲存系統
   Taiwan Market Convention: Red=Up, Green=Down
═══════════════════════════════════════════════════════════════════════════════ */

:root {
    /* Taiwan Market Colors */
    --tw-up: #FF0000;
    --tw-down: #00AA00;
    
    /* Seaborn Deep Palette */
    --sb-blue: #4C72B0;
    --sb-orange: #DD8452;
    --sb-green: #55A868;
    --sb-red: #C44E52;
    --sb-purple: #8172B3;
    
    /* MA Colors (K003) */
    --ma5: #FFEB3B;
    --ma10: #64B5F6;
    --ma20: #388E3C;
    --ma60: #1976D2;
    --ma120: #FF9800;
    --ma240: #BDBDBD;
    
    /* Dark Theme (K001) */
    --bg-primary: #1A1A2E;
    --bg-secondary: #16213E;
    --bg-tertiary: #0F3460;
    --bg-card: #1E2A4A;
    --bg-hover: #2A3A5A;
    --text-primary: #E8E8E8;
    --text-secondary: #A0A0A0;
    --text-muted: #6A6A8A;
    --border: #2A3A5A;
    --border-light: #3A4A6A;
    
    /* Spacing */
    --radius: 8px;
    --radius-lg: 12px;
    --shadow: 0 4px 12px rgba(0,0,0,0.3);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    line-height: 1.5;
}

/* ═══════════════════════════════════════════════════════════════════════════════
   LAYOUT
═══════════════════════════════════════════════════════════════════════════════ */

.app {
    display: grid;
    grid-template-columns: 280px 1fr 280px;
    grid-template-rows: 60px 1fr;
    min-height: 100vh;
    gap: 1px;
    background: var(--border);
}

.header {
    grid-column: 1 / -1;
    background: var(--bg-secondary);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 1.5rem;
    border-bottom: 1px solid var(--border);
}

.sidebar {
    background: var(--bg-secondary);
    overflow-y: auto;
    padding: 1rem;
}

.sidebar-left { grid-column: 1; }
.sidebar-right { grid-column: 3; }

.main {
    grid-column: 2;
    background: var(--bg-primary);
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

/* ═══════════════════════════════════════════════════════════════════════════════
   HEADER
═══════════════════════════════════════════════════════════════════════════════ */

.logo {
    display: flex;
    align-items: center;
    gap: 0.75rem;
}

.logo-icon {
    width: 36px;
    height: 36px;
    background: linear-gradient(135deg, var(--sb-blue), var(--sb-purple));
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 12px;
    color: white;
}

.logo-text {
    font-size: 1.125rem;
    font-weight: 700;
}

.logo-version {
    font-size: 0.75rem;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
}

.header-actions {
    display: flex;
    gap: 0.5rem;
}

/* ═══════════════════════════════════════════════════════════════════════════════
   BUTTONS
═══════════════════════════════════════════════════════════════════════════════ */

.btn {
    padding: 0.5rem 1rem;
    border: none;
    border-radius: var(--radius);
    font-size: 0.875rem;
    font-weight: 500;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    transition: all 0.15s;
    font-family: inherit;
}

.btn-primary {
    background: var(--sb-blue);
    color: white;
}
.btn-primary:hover { background: #5B82C0; }

.btn-success {
    background: var(--sb-green);
    color: white;
}
.btn-success:hover { background: #65B878; }

.btn-ghost {
    background: transparent;
    color: var(--text-secondary);
    border: 1px solid var(--border);
}
.btn-ghost:hover {
    background: var(--bg-hover);
    color: var(--text-primary);
}

.btn-sm {
    padding: 0.375rem 0.75rem;
    font-size: 0.75rem;
}

/* ═══════════════════════════════════════════════════════════════════════════════
   CARDS & SECTIONS
═══════════════════════════════════════════════════════════════════════════════ */

.card {
    background: var(--bg-card);
    border-radius: var(--radius-lg);
    border: 1px solid var(--border);
    margin-bottom: 1rem;
}

.card-header {
    padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.card-title {
    font-size: 0.875rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

.card-body {
    padding: 1rem;
}

.section-title {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 0.75rem;
}

/* ═══════════════════════════════════════════════════════════════════════════════
   FORM CONTROLS
═══════════════════════════════════════════════════════════════════════════════ */

.form-group {
    margin-bottom: 1rem;
}

.form-label {
    display: block;
    font-size: 0.75rem;
    font-weight: 500;
    color: var(--text-secondary);
    margin-bottom: 0.375rem;
}

.form-input, .form-select {
    width: 100%;
    padding: 0.5rem 0.75rem;
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text-primary);
    font-size: 0.875rem;
    font-family: inherit;
}

.form-input:focus, .form-select:focus {
    outline: none;
    border-color: var(--sb-blue);
}

/* ═══════════════════════════════════════════════════════════════════════════════
   REGISTRY MODULE LIST
═══════════════════════════════════════════════════════════════════════════════ */

.registry-category {
    margin-bottom: 1.5rem;
}

.category-header {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 0;
    cursor: pointer;
}

.category-badge {
    background: var(--sb-blue);
    color: white;
    padding: 0.125rem 0.5rem;
    border-radius: 4px;
    font-size: 0.625rem;
    font-weight: 700;
    font-family: 'JetBrains Mono', monospace;
}

.category-name {
    font-size: 0.8125rem;
    font-weight: 600;
}

.category-count {
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-left: auto;
}

.module-list {
    list-style: none;
}

.module-item {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem;
    border-radius: var(--radius);
    cursor: pointer;
    transition: background 0.15s;
}

.module-item:hover {
    background: var(--bg-hover);
}

.module-item.active {
    background: var(--sb-blue);
    color: white;
}

.module-code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    color: var(--sb-orange);
    min-width: 40px;
}

.module-item.active .module-code {
    color: white;
}

.module-name {
    font-size: 0.8125rem;
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* ═══════════════════════════════════════════════════════════════════════════════
   INDICATOR TOGGLES
═══════════════════════════════════════════════════════════════════════════════ */

.indicator-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0.5rem;
}

.indicator-toggle {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem;
    background: var(--bg-tertiary);
    border-radius: var(--radius);
    cursor: pointer;
    transition: all 0.15s;
}

.indicator-toggle:hover {
    background: var(--bg-hover);
}

.indicator-toggle.active {
    background: var(--sb-blue);
    color: white;
}

.indicator-color {
    width: 12px;
    height: 12px;
    border-radius: 50%;
}

.indicator-name {
    font-size: 0.75rem;
    font-weight: 500;
}

/* ═══════════════════════════════════════════════════════════════════════════════
   CHART AREA
═══════════════════════════════════════════════════════════════════════════════ */

.chart-container {
    flex: 1;
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
}

.chart-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.5rem 1rem;
    background: var(--bg-card);
    border-radius: var(--radius);
}

.time-buttons {
    display: flex;
    gap: 0.25rem;
}

.time-btn {
    padding: 0.375rem 0.75rem;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text-secondary);
    font-size: 0.75rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
}

.time-btn:hover {
    background: var(--bg-hover);
    color: var(--text-primary);
}

.time-btn.active {
    background: var(--sb-blue);
    border-color: var(--sb-blue);
    color: white;
}

.chart-main {
    flex: 1;
    background: var(--bg-card);
    border-radius: var(--radius-lg);
    overflow: hidden;
}

#mainChart {
    width: 100%;
    height: 100%;
}

/* ═══════════════════════════════════════════════════════════════════════════════
   STATS PANEL
═══════════════════════════════════════════════════════════════════════════════ */

.stats-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0.75rem;
}

.stat-item {
    padding: 0.75rem;
    background: var(--bg-tertiary);
    border-radius: var(--radius);
}

.stat-label {
    font-size: 0.625rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
}

.stat-value {
    font-size: 1.125rem;
    font-weight: 700;
    font-family: 'JetBrains Mono', monospace;
}

.stat-value.up { color: var(--tw-up); }
.stat-value.down { color: var(--tw-down); }

.stat-change {
    font-size: 0.75rem;
    font-family: 'JetBrains Mono', monospace;
}

/* ═══════════════════════════════════════════════════════════════════════════════
   SCENARIO TAGS
═══════════════════════════════════════════════════════════════════════════════ */

.scenario-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 0.375rem;
}

.scenario-tag {
    padding: 0.25rem 0.5rem;
    border-radius: 4px;
    font-size: 0.625rem;
    font-weight: 600;
}

.scenario-tag.bullish {
    background: rgba(85, 168, 104, 0.2);
    color: var(--sb-green);
}

.scenario-tag.bearish {
    background: rgba(196, 78, 82, 0.2);
    color: var(--sb-red);
}

.scenario-tag.neutral {
    background: rgba(129, 114, 179, 0.2);
    color: var(--sb-purple);
}

/* ═══════════════════════════════════════════════════════════════════════════════
   WATCHLIST
═══════════════════════════════════════════════════════════════════════════════ */

.watchlist-item {
    display: flex;
    align-items: center;
    padding: 0.75rem;
    border-radius: var(--radius);
    cursor: pointer;
    transition: background 0.15s;
}

.watchlist-item:hover {
    background: var(--bg-hover);
}

.watchlist-item.active {
    background: var(--bg-tertiary);
    border-left: 3px solid var(--sb-blue);
}

.watchlist-symbol {
    font-weight: 600;
    font-family: 'JetBrains Mono', monospace;
}

.watchlist-name {
    font-size: 0.75rem;
    color: var(--text-secondary);
}

.watchlist-price {
    margin-left: auto;
    text-align: right;
}

.watchlist-change {
    font-size: 0.75rem;
    font-family: 'JetBrains Mono', monospace;
}

/* ═══════════════════════════════════════════════════════════════════════════════
   RESPONSIVE
═══════════════════════════════════════════════════════════════════════════════ */

@media (max-width: 1200px) {
    .app {
        grid-template-columns: 260px 1fr;
    }
    .sidebar-right {
        display: none;
    }
}

@media (max-width: 768px) {
    .app {
        grid-template-columns: 1fr;
    }
    .sidebar-left {
        display: none;
    }
}

/* ═══════════════════════════════════════════════════════════════════════════════
   SCROLLBAR
═══════════════════════════════════════════════════════════════════════════════ */

::-webkit-scrollbar {
    width: 6px;
    height: 6px;
}

::-webkit-scrollbar-track {
    background: transparent;
}

::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 3px;
}

::-webkit-scrollbar-thumb:hover {
    background: var(--border-light);
}
    </style>
</head>
<body>

<div class="app">
    <!-- Header -->
    <header class="header">
        <div class="logo">
            <div class="logo-icon">VIA</div>
            <div>
                <div class="logo-text">AutoPlot Ultimate</div>
                <div class="logo-version">v2.0.0 OMEGA</div>
            </div>
        </div>
        <div class="header-actions">
            <button class="btn btn-ghost" onclick="loadData()">📂 載入資料</button>
            <button class="btn btn-ghost" onclick="saveTemplate()">💾 儲存模板</button>
            <button class="btn btn-primary" onclick="exportChart()">📤 匯出</button>
        </div>
    </header>
    
    <!-- Left Sidebar: Registry & Indicators -->
    <aside class="sidebar sidebar-left">
        <!-- Stock Info -->
        <div class="card">
            <div class="card-header">
                <div class="card-title">📈 標的資訊</div>
            </div>
            <div class="card-body">
                <div class="form-group">
                    <input type="text" class="form-input" id="symbolInput" placeholder="輸入代碼 (如: 2330)" value="2330">
                </div>
                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="stat-label">收盤價</div>
                        <div class="stat-value" id="statClose">1,025</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">漲跌幅</div>
                        <div class="stat-value up" id="statChange">+2.35%</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">成交量</div>
                        <div class="stat-value" id="statVolume">45,231</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">52週高</div>
                        <div class="stat-value" id="stat52High">1,150</div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Indicators (I) -->
        <div class="card">
            <div class="card-header">
                <div class="card-title">📊 技術指標 (I)</div>
            </div>
            <div class="card-body">
                <div class="section-title">均線</div>
                <div class="indicator-grid">
                    <div class="indicator-toggle active" data-ind="sma5">
                        <div class="indicator-color" style="background: var(--ma5)"></div>
                        <span class="indicator-name">MA5</span>
                    </div>
                    <div class="indicator-toggle active" data-ind="sma10">
                        <div class="indicator-color" style="background: var(--ma10)"></div>
                        <span class="indicator-name">MA10</span>
                    </div>
                    <div class="indicator-toggle active" data-ind="sma20">
                        <div class="indicator-color" style="background: var(--ma20)"></div>
                        <span class="indicator-name">MA20</span>
                    </div>
                    <div class="indicator-toggle" data-ind="sma60">
                        <div class="indicator-color" style="background: var(--ma60)"></div>
                        <span class="indicator-name">MA60</span>
                    </div>
                    <div class="indicator-toggle" data-ind="sma120">
                        <div class="indicator-color" style="background: var(--ma120)"></div>
                        <span class="indicator-name">MA120</span>
                    </div>
                    <div class="indicator-toggle" data-ind="sma240">
                        <div class="indicator-color" style="background: var(--ma240)"></div>
                        <span class="indicator-name">MA240</span>
                    </div>
                </div>
                
                <div class="section-title" style="margin-top: 1rem;">震盪指標</div>
                <div class="indicator-grid">
                    <div class="indicator-toggle active" data-ind="rsi">
                        <div class="indicator-color" style="background: var(--sb-purple)"></div>
                        <span class="indicator-name">RSI</span>
                    </div>
                    <div class="indicator-toggle active" data-ind="macd">
                        <div class="indicator-color" style="background: var(--sb-blue)"></div>
                        <span class="indicator-name">MACD</span>
                    </div>
                    <div class="indicator-toggle" data-ind="kd">
                        <div class="indicator-color" style="background: var(--sb-orange)"></div>
                        <span class="indicator-name">KD</span>
                    </div>
                    <div class="indicator-toggle" data-ind="bb">
                        <div class="indicator-color" style="background: var(--sb-green)"></div>
                        <span class="indicator-name">BBand</span>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Scenarios (C) -->
        <div class="card">
            <div class="card-header">
                <div class="card-title">🎯 情境偵測 (C)</div>
            </div>
            <div class="card-body">
                <div class="scenario-tags" id="scenarioTags">
                    <span class="scenario-tag bullish">C003 動能轉強</span>
                    <span class="scenario-tag neutral">C013 布林收縮</span>
                    <span class="scenario-tag bullish">C030 法人累積</span>
                </div>
            </div>
        </div>
    </aside>
    
    <!-- Main Chart Area -->
    <main class="main">
        <div class="chart-container">
            <!-- Toolbar -->
            <div class="chart-toolbar">
                <div class="time-buttons">
                    <button class="time-btn" data-range="1M">1M</button>
                    <button class="time-btn" data-range="3M">3M</button>
                    <button class="time-btn active" data-range="6M">6M</button>
                    <button class="time-btn" data-range="YTD">YTD</button>
                    <button class="time-btn" data-range="1Y">1Y</button>
                    <button class="time-btn" data-range="3Y">3Y</button>
                    <button class="time-btn" data-range="MAX">MAX</button>
                </div>
                <div class="header-actions">
                    <button class="btn btn-ghost btn-sm" onclick="toggleVolume()">📊 成交量</button>
                    <button class="btn btn-ghost btn-sm" onclick="toggleCrosshair()">➕ 十字線</button>
                    <button class="btn btn-ghost btn-sm" onclick="resetZoom()">🔄 重置</button>
                </div>
            </div>
            
            <!-- Main Chart -->
            <div class="chart-main">
                <div id="mainChart"></div>
            </div>
        </div>
    </main>
    
    <!-- Right Sidebar: Watchlist & Settings -->
    <aside class="sidebar sidebar-right">
        <!-- Watchlist -->
        <div class="card">
            <div class="card-header">
                <div class="card-title">⭐ 自選股</div>
                <button class="btn btn-ghost btn-sm" onclick="addToWatchlist()">+</button>
            </div>
            <div class="card-body" style="padding: 0.5rem;">
                <div class="watchlist-item active">
                    <div>
                        <div class="watchlist-symbol">2330</div>
                        <div class="watchlist-name">台積電</div>
                    </div>
                    <div class="watchlist-price">
                        <div class="stat-value">1,025</div>
                        <div class="watchlist-change up">+2.35%</div>
                    </div>
                </div>
                <div class="watchlist-item">
                    <div>
                        <div class="watchlist-symbol">2317</div>
                        <div class="watchlist-name">鴻海</div>
                    </div>
                    <div class="watchlist-price">
                        <div class="stat-value">185</div>
                        <div class="watchlist-change down">-1.07%</div>
                    </div>
                </div>
                <div class="watchlist-item">
                    <div>
                        <div class="watchlist-symbol">9802</div>
                        <div class="watchlist-name">鈺齊-KY</div>
                    </div>
                    <div class="watchlist-price">
                        <div class="stat-value">352</div>
                        <div class="watchlist-change up">+0.86%</div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Layout (L) -->
        <div class="card">
            <div class="card-header">
                <div class="card-title">📐 版面配置 (L)</div>
            </div>
            <div class="card-body">
                <div class="form-group">
                    <label class="form-label">版面類型</label>
                    <select class="form-select" id="layoutSelect">
                        <option value="L001">L001 多資產同步觀察版</option>
                        <option value="L002" selected>L002 雙軸圖分析版</option>
                        <option value="L003">L003 主力/三大法人版</option>
                        <option value="L006">L006 Volume Profile版</option>
                    </select>
                </div>
            </div>
        </div>
        
        <!-- Color Scheme (K) -->
        <div class="card">
            <div class="card-header">

function generateDemoData(days = 180) {
    const dates = [];
    const open = [], high = [], low = [], close = [], volume = [];
    
    let price = 950 + Math.random() * 100;
    const startDate = new Date();
    startDate.setDate(startDate.getDate() - days);
    
    for (let i = 0; i < days; i++) {
        const date = new Date(startDate);
        date.setDate(date.getDate() + i);
        dates.push(date.toISOString().split('T')[0]);
        
        const change = (Math.random() - 0.48) * 20;
        const o = price;
        const c = price + change;
        const h = Math.max(o, c) + Math.random() * 10;
        const l = Math.min(o, c) - Math.random() * 10;
        const v = Math.floor(30000 + Math.random() * 50000);
        
        open.push(o);
        close.push(c);
        high.push(h);
        low.push(l);
        volume.push(v);
        
        price = c;
    }
    
    APP.data = { dates, open, high, low, close, volume };
}

// ═══════════════════════════════════════════════════════════════════════════════
// TECHNICAL INDICATORS
// ═══════════════════════════════════════════════════════════════════════════════

function calcSMA(data, period) {
    const result = [];
    for (let i = 0; i < data.length; i++) {
        if (i < period - 1) {
            result.push(null);
        } else {
            let sum = 0;
            for (let j = 0; j < period; j++) {
                sum += data[i - j];
            }
            result.push(sum / period);
        }
    }
    return result;
}

function calcRSI(data, period = 14) {
    const result = new Array(data.length).fill(null);
    let gains = 0, losses = 0;
    
    for (let i = 1; i < data.length; i++) {
        const change = data[i] - data[i - 1];
        if (i <= period) {
            if (change > 0) gains += change;
            else losses -= change;
            if (i === period) {
                gains /= period;
                losses /= period;
                result[i] = 100 - (100 / (1 + gains / losses));
            }
        } else {
            if (change > 0) {
                gains = (gains * (period - 1) + change) / period;
                losses = (losses * (period - 1)) / period;
            } else {
                gains = (gains * (period - 1)) / period;
                losses = (losses * (period - 1) - change) / period;
            }
            result[i] = losses === 0 ? 100 : 100 - (100 / (1 + gains / losses));
        }
    }
    return result;
}

function calcMACD(data, fast = 12, slow = 26, signal = 9) {
    const emaFast = calcEMA(data, fast);
    const emaSlow = calcEMA(data, slow);
    const macdLine = emaFast.map((f, i) => f && emaSlow[i] ? f - emaSlow[i] : null);
    const signalLine = calcEMA(macdLine, signal);
    const histogram = macdLine.map((m, i) => m && signalLine[i] ? m - signalLine[i] : null);
    return { macd: macdLine, signal: signalLine, histogram };
}

function calcEMA(data, period) {
    const result = [];
    const k = 2 / (period + 1);
    let ema = null;
    
    for (let i = 0; i < data.length; i++) {
        if (data[i] === null) {
            result.push(null);
            continue;
        }
        if (ema === null) {
            ema = data[i];
        } else {
            ema = data[i] * k + ema * (1 - k);
        }
        result.push(i >= period - 1 ? ema : null);
    }
    return result;
}

// KD (Stochastic Oscillator)
function calcKD(high, low, close, kPeriod = 9, dPeriod = 3) {
    const k = new Array(close.length).fill(null);
    const d = new Array(close.length).fill(null);
    
    for (let i = kPeriod - 1; i < close.length; i++) {
        let highestHigh = -Infinity;
        let lowestLow = Infinity;
        for (let j = i - kPeriod + 1; j <= i; j++) {
            if (high[j] > highestHigh) highestHigh = high[j];
            if (low[j] < lowestLow) lowestLow = low[j];
        }
        const rsv = highestHigh === lowestLow ? 50 : ((close[i] - lowestLow) / (highestHigh - lowestLow)) * 100;
        
        if (i === kPeriod - 1) {
            k[i] = rsv;
        } else {
            k[i] = k[i - 1] * 2/3 + rsv * 1/3;
        }
    }
    
    // D line (MA of K)
    for (let i = kPeriod + dPeriod - 2; i < close.length; i++) {
        if (i === kPeriod + dPeriod - 2) {
            d[i] = k[i];
        } else {
            d[i] = d[i - 1] * 2/3 + k[i] * 1/3;
        }
    }
    
    return { k, d };
}

// Bollinger Bands
function calcBBands(data, period = 20, stdDev = 2) {
    const middle = calcSMA(data, period);
    const upper = new Array(data.length).fill(null);
    const lower = new Array(data.length).fill(null);
    
    for (let i = period - 1; i < data.length; i++) {
        let sum = 0;
        for (let j = 0; j < period; j++) {
            sum += Math.pow(data[i - j] - middle[i], 2);
        }
        const std = Math.sqrt(sum / period);
        upper[i] = middle[i] + stdDev * std;
        lower[i] = middle[i] - stdDev * std;
    }
    
    return { upper, middle, lower };
}

// ATR (Average True Range)
function calcATR(high, low, close, period = 14) {
    const tr = new Array(close.length).fill(null);
    const atr = new Array(close.length).fill(null);
    
    for (let i = 1; i < close.length; i++) {
        const hl = high[i] - low[i];
        const hc = Math.abs(high[i] - close[i - 1]);
        const lc = Math.abs(low[i] - close[i - 1]);
        tr[i] = Math.max(hl, hc, lc);
    }
    
    // First ATR is SMA of TR
    let sum = 0;
    for (let i = 1; i <= period; i++) {
        sum += tr[i];
    }
    atr[period] = sum / period;
    
    // Subsequent ATR uses EMA-style smoothing
    for (let i = period + 1; i < close.length; i++) {
        atr[i] = (atr[i - 1] * (period - 1) + tr[i]) / period;
    }
    
    return atr;
}

// CHART RENDERING
// ═══════════════════════════════════════════════════════════════════════════════

function renderChart() {
    if (!APP.data) return;
    
    const { dates, open, high, low, close, volume } = APP.data;
    const colors = REGISTRY.K.K001;
    
    // Main traces array
    const traces = [];
    
    // Candlestick
    traces.push({
        type: 'candlestick',
        x: dates,
        open: open,
        high: high,
        low: low,
        close: close,
        increasing: { line: { color: colors.up } },
        decreasing: { line: { color: colors.down } },
        name: 'K線',
        xaxis: 'x',
        yaxis: 'y',
    });
    
    // Moving Averages
    if (APP.indicators.sma5) {
        traces.push({
            type: 'scatter', mode: 'lines',
            x: dates, y: calcSMA(close, 5),
            line: { color: colors.ma[5], width: 1.5 },
            name: 'MA5', yaxis: 'y',
        });
    }
    if (APP.indicators.sma10) {
        traces.push({
            type: 'scatter', mode: 'lines',
            x: dates, y: calcSMA(close, 10),
            line: { color: colors.ma[10], width: 1.5 },
            name: 'MA10', yaxis: 'y',
        });
    }
    if (APP.indicators.sma20) {
        traces.push({
            type: 'scatter', mode: 'lines',
            x: dates, y: calcSMA(close, 20),
            line: { color: colors.ma[20], width: 1.5 },
            name: 'MA20', yaxis: 'y',
        });
    }
    if (APP.indicators.sma60) {
        traces.push({
            type: 'scatter', mode: 'lines',
            x: dates, y: calcSMA(close, 60),
            line: { color: colors.ma[60], width: 1.5 },
            name: 'MA60', yaxis: 'y',
        });
    }
    
    // Volume
    if (APP.settings.showVolume) {
        const volumeColors = close.map((c, i) => i === 0 ? colors.up : (c >= close[i-1] ? colors.up : colors.down));
        traces.push({
            type: 'bar',
            x: dates, y: volume,
            marker: { color: volumeColors, opacity: 0.6 },
            name: '成交量',
            yaxis: 'y2',
        });
    }
    
    // RSI
    if (APP.indicators.rsi) {
        traces.push({
            type: 'scatter', mode: 'lines',
            x: dates, y: calcRSI(close, 14),
            line: { color: '#8172B3', width: 1.5 },
            name: 'RSI', yaxis: 'y3',
        });
        // Overbought/Oversold lines
        traces.push({
            type: 'scatter', mode: 'lines',
            x: [dates[0], dates[dates.length-1]], y: [70, 70],
            line: { color: 'rgba(196,78,82,0.4)', width: 1, dash: 'dot' },
            showlegend: false, yaxis: 'y3', hoverinfo: 'skip',
        });
        traces.push({
            type: 'scatter', mode: 'lines',
            x: [dates[0], dates[dates.length-1]], y: [30, 30],
            line: { color: 'rgba(85,168,104,0.4)', width: 1, dash: 'dot' },
            showlegend: false, yaxis: 'y3', hoverinfo: 'skip',
        });
    }
    
    // MACD
    if (APP.indicators.macd) {
        const macdData = calcMACD(close);
        traces.push({
            type: 'bar',
            x: dates, y: macdData.histogram,
            marker: { color: macdData.histogram.map(h => h >= 0 ? colors.up : colors.down) },
            name: 'MACD Hist', yaxis: 'y4',
        });
        traces.push({
            type: 'scatter', mode: 'lines',
            x: dates, y: macdData.macd,
            line: { color: '#4C72B0', width: 1.5 },
            name: 'MACD', yaxis: 'y4',
        });
        traces.push({
            type: 'scatter', mode: 'lines',
            x: dates, y: macdData.signal,
            line: { color: '#DD8452', width: 1.5 },
            name: 'Signal', yaxis: 'y4',
        });
    }
    
    // KD (Stochastic)
    if (APP.indicators.kd) {
        const kdData = calcKD(high, low, close, 9, 3);
        traces.push({
            type: 'scatter', mode: 'lines',
            x: dates, y: kdData.k,
            line: { color: '#1565C0', width: 1.5 },
            name: 'K', yaxis: 'y5',
        });
        traces.push({
            type: 'scatter', mode: 'lines',
            x: dates, y: kdData.d,
            line: { color: '#FF5722', width: 1.5 },
            name: 'D', yaxis: 'y5',
        });
        // Overbought/Oversold lines for KD
        traces.push({
            type: 'scatter', mode: 'lines',
            x: [dates[0], dates[dates.length-1]], y: [80, 80],
            line: { color: 'rgba(196,78,82,0.4)', width: 1, dash: 'dot' },
            showlegend: false, yaxis: 'y5', hoverinfo: 'skip',
        });
        traces.push({
            type: 'scatter', mode: 'lines',
            x: [dates[0], dates[dates.length-1]], y: [20, 20],
            line: { color: 'rgba(85,168,104,0.4)', width: 1, dash: 'dot' },
            showlegend: false, yaxis: 'y5', hoverinfo: 'skip',
        });
    }
    
    // Bollinger Bands
    if (APP.indicators.bb) {
        const bbData = calcBBands(close, 20, 2);
        traces.push({
            type: 'scatter', mode: 'lines',
            x: dates, y: bbData.upper,
            line: { color: 'rgba(85,168,104,0.6)', width: 1 },
            name: 'BB Upper', yaxis: 'y',
        });
        traces.push({
            type: 'scatter', mode: 'lines',
            x: dates, y: bbData.middle,
            line: { color: 'rgba(85,168,104,0.8)', width: 1, dash: 'dash' },
            name: 'BB Mid', yaxis: 'y',
        });
        traces.push({
            type: 'scatter', mode: 'lines',
            x: dates, y: bbData.lower,
            line: { color: 'rgba(85,168,104,0.6)', width: 1 },
            name: 'BB Lower', yaxis: 'y',
            fill: 'tonexty',
            fillcolor: 'rgba(85,168,104,0.1)',
        });
    }
    
    // Layout - Dynamic height calculation based on active indicators
    const hasRSI = APP.indicators.rsi;
    const hasMACD = APP.indicators.macd;
    const hasKD = APP.indicators.kd;
    
    // Count sub-indicators
    let subCount = 0;
    if (hasRSI) subCount++;
    if (hasMACD) subCount++;
    if (hasKD) subCount++;
    
    let mainHeight = subCount === 0 ? 0.75 : (subCount === 1 ? 0.6 : (subCount === 2 ? 0.5 : 0.4));
    let volumeHeight = 0.12;
    let subHeight = subCount > 0 ? (0.85 - mainHeight - volumeHeight) / subCount : 0;
    
    // Calculate domains
    let currentY = 0;
    const kdDomain = hasKD ? [currentY, currentY + subHeight - 0.02] : [0, 0];
    if (hasKD) currentY += subHeight;
    
    const macdDomain = hasMACD ? [currentY, currentY + subHeight - 0.02] : [0, 0];
    if (hasMACD) currentY += subHeight;
    
    const rsiDomain = hasRSI ? [currentY, currentY + subHeight - 0.02] : [0, 0];
    if (hasRSI) currentY += subHeight;
    
    const volumeDomain = [currentY, currentY + volumeHeight - 0.02];
    currentY += volumeHeight;
    
    const mainDomain = [currentY, 1];
    
    const layout = {
        paper_bgcolor: '#1A1A2E',
        plot_bgcolor: '#1A1A2E',
        font: { family: 'Noto Sans TC, sans-serif', color: '#E8E8E8' },
        showlegend: true,
        legend: { orientation: 'h', y: 1.02, x: 0.5, xanchor: 'center', font: { size: 10 } },
        margin: { t: 30, r: 60, b: 30, l: 60 },
        
        xaxis: { 
            domain: [0, 1], 
            rangeslider: { visible: false },
            gridcolor: '#2A3A5A',
            showspikes: APP.settings.showCrosshair,
            spikemode: 'across',
            spikethickness: 1,
            spikecolor: '#6A6A8A',
        },
        
        yaxis: { 
            domain: mainDomain, 
            gridcolor: '#2A3A5A',
            side: 'right',
            showspikes: APP.settings.showCrosshair,
        },
        yaxis2: { 
            domain: volumeDomain,
            gridcolor: '#2A3A5A',
            side: 'right',
        },
        yaxis3: { 
            domain: rsiDomain,
            gridcolor: '#2A3A5A',
            range: [0, 100],
            side: 'right',
            visible: hasRSI,
        },
        yaxis4: { 
            domain: macdDomain,
            gridcolor: '#2A3A5A',
            side: 'right',
            visible: hasMACD,
        },
        yaxis5: { 
            domain: kdDomain,
            gridcolor: '#2A3A5A',
            range: [0, 100],
            side: 'right',
            visible: hasKD,
        },
        
        hovermode: 'x unified',
    };
    
    Plotly.newPlot('mainChart', traces, layout, {
        responsive: true,
        displayModeBar: true,
        modeBarButtonsToRemove: ['lasso2d', 'select2d'],
    });
}

// ═══════════════════════════════════════════════════════════════════════════════
// UI FUNCTIONS
// ═══════════════════════════════════════════════════════════════════════════════

function toggleVolume() {
    APP.settings.showVolume = !APP.settings.showVolume;
    renderChart();
}

function toggleCrosshair() {
    APP.settings.showCrosshair = !APP.settings.showCrosshair;
    renderChart();
}

function resetZoom() {
    Plotly.relayout('mainChart', {
        'xaxis.autorange': true,
        'yaxis.autorange': true,
    });
}

function loadData() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.csv,.xlsx,.parquet';
    input.onchange = (e) => {
        const file = e.target.files[0];
        if (file) {
            if (file.name.endsWith('.csv')) {
                Papa.parse(file, {
                    header: true,
                    dynamicTyping: true,
                    complete: (results) => {
                        processData(results.data);
                    }
                });
            } else if (file.name.endsWith('.xlsx')) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const workbook = XLSX.read(e.target.result, { type: 'binary' });
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    const data = XLSX.utils.sheet_to_json(sheet);
                    processData(data);
                };
                reader.readAsBinaryString(file);
            }
        }
    };
    input.click();
}

function processData(rawData) {
    // Convert to our format
    const dates = [], open = [], high = [], low = [], close = [], volume = [];
    
    rawData.forEach(row => {
        const date = row.Date || row.date || row.日期;
        if (!date) return;
        
        dates.push(date);
        open.push(row.Open || row.open || row.開盤 || 0);
        high.push(row.High || row.high || row.最高 || 0);
        low.push(row.Low || row.low || row.最低 || 0);
        close.push(row.Close || row.close || row['Adj Close'] || row.收盤 || 0);
        volume.push(row.Volume || row.volume || row.成交量 || 0);
    });
    
    APP.data = { dates, open, high, low, close, volume };
    renderChart();
}

function saveTemplate() {
    const template = {
        name: prompt('模板名稱:', '我的模板'),
        indicators: { ...APP.indicators },
        settings: { ...APP.settings },
        timestamp: new Date().toISOString(),
    };
    
    const blob = new Blob([JSON.stringify(template, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `VIA_Template_${template.name}.json`;
    a.click();
}

function applyTemplate() {
    const select = document.getElementById('templateSelect');
    const templateId = select.value;
    
    if (!templateId) return;
    
    // Apply template settings
    const templates = {
        T001: { rsi: true, macd: false, bb: true, sma20: true },
        T002: { rsi: true, macd: true, bb: false, sma5: true, sma10: true },
        T003: { rsi: true, macd: true, sma20: true, sma60: true },
        T005: { rsi: false, macd: true, sma60: true, sma120: true },
        T006: { rsi: true, macd: true, bb: true, sma20: true, sma60: true },
    };
    
    const settings = templates[templateId];
    if (settings) {
        Object.assign(APP.indicators, settings);
        
        // Update UI
        document.querySelectorAll('.indicator-toggle').forEach(el => {
            const ind = el.dataset.ind;
            if (APP.indicators[ind]) {
                el.classList.add('active');
            } else {
                el.classList.remove('active');
            }
        });
        
        renderChart();
    }
}

function exportChart() {
    Plotly.downloadImage('mainChart', {
        format: 'png',
        width: 1920,
        height: 1080,
        filename: `VIA_Chart_${APP.symbol}_${new Date().toISOString().split('T')[0]}`
    });
}

function addToWatchlist() {
    const symbol = prompt('輸入股票代碼:', '');
    if (symbol) {
        alert(`已新增 ${symbol} 到自選股`);
    }
}
</script>
