<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VSO ULTRA NEXUS Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@300;400;700&display=swap" rel="stylesheet">
    <style>

:root {
    --primary: #00f0ff;
    --secondary: #ff00ff;
    --accent: #ffff00;
    --success: #00ff88;
    --warning: #ffaa00;
    --danger: #ff3366;
    --info: #6666ff;
    --bg-dark: #0a0a0f;
    --bg-card: rgba(15, 15, 25, 0.95);
    --bg-panel: rgba(20, 20, 35, 0.9);
    --text-primary: #ffffff;
    --text-secondary: #aaaacc;
    --border-glow: rgba(0, 240, 255, 0.3);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Noto Sans TC', 'JetBrains Mono', monospace;
    background: var(--bg-dark);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
}

.cyber-grid {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: 
        linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
    background-size: 50px 50px;
    pointer-events: none;
    z-index: 0;
}

.scan-line {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--primary), transparent);
    animation: scan 8s linear infinite;
    z-index: 1000;
}

@keyframes scan {
    0% { top: 0; opacity: 1; }
    50% { opacity: 0.5; }
    100% { top: 100%; opacity: 1; }
}

.container {
    position: relative;
    max-width: 1800px;
    margin: 0 auto;
    padding: 20px;
    z-index: 1;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 30px;
    background: var(--bg-card);
    border: 1px solid var(--border-glow);
    border-radius: 10px;
    margin-bottom: 20px;
}

.logo {
    display: flex;
    align-items: center;
    gap: 15px;
}

.logo-icon {
    font-size: 3rem;
    color: var(--primary);
    text-shadow: 0 0 20px var(--primary);
    animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.1); opacity: 0.8; }
}

.logo-text {
    font-family: 'Orbitron', sans-serif;
    font-size: 2rem;
    font-weight: 900;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 30px rgba(0, 240, 255, 0.5);
}

.version-badge {
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: var(--bg-dark);
    padding: 5px 15px;
    border-radius: 20px;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.8rem;
    font-weight: 700;
}

.header-info {
    display: flex;
    align-items: center;
    gap: 20px;
}

.timestamp {
    font-family: 'JetBrains Mono', monospace;
    color: var(--text-secondary);
}

.status-indicator {
    font-weight: 600;
}

.status-indicator.online {
    color: var(--success);
    text-shadow: 0 0 10px var(--success);
}

/* KPI Dashboard */
.kpi-dashboard {
    background: var(--bg-card);
    border: 1px solid var(--border-glow);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
}

.section-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.2rem;
    color: var(--primary);
    margin-bottom: 15px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 15px;
}

.kpi-card {
    background: var(--bg-panel);
    border: 1px solid var(--border-glow);
    border-radius: 8px;
    padding: 15px;
    text-align: center;
}

.kpi-card.excellent { border-color: var(--success); }
.kpi-card.good { border-color: var(--primary); }
.kpi-card.warning { border-color: var(--warning); }
.kpi-card.critical { border-color: var(--danger); }

.kpi-value {
    font-family: 'Orbitron', sans-serif;
    font-size: 2rem;
    font-weight: 700;
}

.kpi-card.excellent .kpi-value { color: var(--success); }
.kpi-card.good .kpi-value { color: var(--primary); }
.kpi-card.warning .kpi-value { color: var(--warning); }
.kpi-card.critical .kpi-value { color: var(--danger); }

.kpi-label {
    font-size: 0.85rem;
    color: var(--text-secondary);
    margin-top: 5px;
}

.kpi-target {
    font-size: 0.75rem;
    color: var(--text-secondary);
    margin-top: 3px;
}

/* Stats Bar */
.stats-bar {
    display: flex;
    justify-content: space-around;
    background: var(--bg-card);
    border: 1px solid var(--border-glow);
    border-radius: 10px;
    padding: 15px;
    margin-bottom: 20px;
}

.stat-item {
    text-align: center;
}

.stat-label {
    display: block;
    font-size: 0.85rem;
    color: var(--text-secondary);
    margin-bottom: 5px;
}

.stat-value {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--primary);
    text-shadow: 0 0 10px var(--primary);
}

/* Tabs */
.tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
    flex-wrap: wrap;
}

.tab-btn {
    padding: 10px 20px;
    background: var(--bg-card);
    border: 1px solid var(--border-glow);
    border-radius: 8px;
    color: var(--text-secondary);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.3s ease;
}

.tab-btn:hover {
    border-color: var(--primary);
    color: var(--primary);
}

.tab-btn.active {
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: var(--bg-dark);
    border-color: transparent;
    font-weight: 600;
}

/* Search Bar */
.search-bar {
    display: flex;
    gap: 15px;
    margin-bottom: 20px;
    align-items: center;
    flex-wrap: wrap;
}

#search-input {
    flex: 1;
    min-width: 300px;
    padding: 12px 20px;
    background: var(--bg-card);
    border: 1px solid var(--border-glow);
    border-radius: 8px;
    color: var(--text-primary);
    font-size: 1rem;
}

#search-input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 10px var(--border-glow);
}

.filter-buttons {
    display: flex;
    gap: 10px;
}

.filter-btn {
    padding: 8px 16px;
    background: var(--bg-card);
    border: 1px solid var(--border-glow);
    border-radius: 6px;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.3s ease;
}

.filter-btn:hover, .filter-btn.active {
    border-color: var(--primary);
    color: var(--primary);
}

/* Tab Content */
.tab-content {
    display: none;
}

.tab-content.active {
    display: block;
}

/* Overview Grid */
.overview-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.overview-card {
    background: var(--bg-card);
    border: 1px solid var(--border-glow);
    border-radius: 10px;
    padding: 20px;
}

.overview-card.wide {
    grid-column: span 3;
}

.overview-card h3 {
    font-family: 'Orbitron', sans-serif;
    font-size: 1rem;
    color: var(--primary);
    margin-bottom: 15px;
}

/* Module Grid */
.module-grid, .lego-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
    gap: 20px;
}

.module-card, .lego-card {
    background: var(--bg-card);
    border: 1px solid var(--border-glow);
    border-radius: 10px;
    padding: 20px;
    cursor: pointer;
    transition: all 0.3s ease;
}

.module-card:hover, .lego-card:hover {
    border-color: var(--primary);
    transform: translateY(-3px);
    box-shadow: 0 5px 20px rgba(0, 240, 255, 0.2);
}

.module-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 10px;
}

.module-id {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.85rem;
    color: var(--primary);
}

.module-status {
    padding: 3px 10px;
    border-radius: 4px;
    font-size: 0.75rem;
}

.module-status.integrated_core { background: var(--success); color: var(--bg-dark); }
.module-status.integrated_peripheral { background: var(--info); color: var(--bg-dark); }
.module-status.standalone { background: var(--warning); color: var(--bg-dark); }
.module-status.pending { background: var(--text-secondary); color: var(--bg-dark); }

.module-name {
    font-size: 1.1rem;
    font-weight: 600;
    margin-bottom: 5px;
    word-break: break-all;
}

.module-language {
    font-size: 0.85rem;
    color: var(--text-secondary);
    margin-bottom: 10px;
}

.module-stats {
    display: flex;
    gap: 15px;
    margin-bottom: 10px;
}

.module-stat {
    font-size: 0.8rem;
    color: var(--text-secondary);
}

.module-stat span {
    color: var(--primary);
    font-weight: 600;
}

.quality-bar {
    height: 6px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 3px;
    overflow: hidden;
}

.quality-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.5s ease;
}

.quality-fill.high { background: var(--success); }
.quality-fill.medium { background: var(--warning); }
.quality-fill.low { background: var(--danger); }

/* Audit List */
.audit-list {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.audit-card {
    background: var(--bg-card);
    border: 1px solid var(--border-glow);
    border-radius: 10px;
    padding: 20px;
}

.audit-header {
    display: flex;
    justify-content: space-between;
    margin-bottom: 15px;
}

.audit-score {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.5rem;
    font-weight: 700;
}

.audit-score.excellent { color: var(--success); }
.audit-score.good { color: var(--primary); }
.audit-score.warning { color: var(--warning); }
.audit-score.critical { color: var(--danger); }

.audit-checks {
    display: flex;
    gap: 20px;
}

.check-count {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 0.9rem;
}

.check-count.passed { color: var(--success); }
.check-count.failed { color: var(--danger); }
.check-count.warning { color: var(--warning); }

/* Dependency Graph */
.dependency-container {
    background: var(--bg-card);
    border: 1px solid var(--border-glow);
    border-radius: 10px;
    padding: 20px;
    min-height: 500px;
}

.graph-controls {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
}

.graph-controls button {
    padding: 8px 16px;
    background: var(--bg-panel);
    border: 1px solid var(--border-glow);
    border-radius: 6px;
    color: var(--text-secondary);
    cursor: pointer;
}

.graph-controls button:hover {
    border-color: var(--primary);
    color: var(--primary);
}

#dependency-graph {
    width: 100%;
    min-height: 400px;
    background: var(--bg-panel);
    border-radius: 8px;
}

/* Tools Container */
.tools-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
    gap: 20px;
}

.tool-category {
    background: var(--bg-card);
    border: 1px solid var(--border-glow);
    border-radius: 10px;
    padding: 20px;
}

.tool-category h3 {
    font-family: 'Orbitron', sans-serif;
    font-size: 1rem;
    color: var(--primary);
    margin-bottom: 15px;
}

.tool-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.tool-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px;
    background: var(--bg-panel);
    border-radius: 6px;
}

.tool-name {
    font-weight: 600;
    color: var(--text-primary);
}

.tool-purpose {
    font-size: 0.85rem;
    color: var(--text-secondary);
}

.tool-type {
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 0.75rem;
    background: var(--primary);
    color: var(--bg-dark);
}

/* Modal */
.modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.8);
    z-index: 2000;
    justify-content: center;
    align-items: center;
}

.modal.active {
    display: flex;
}

.modal-content {
    background: var(--bg-card);
    border: 1px solid var(--border-glow);
    border-radius: 15px;
    padding: 30px;
    max-width: 800px;
    max-height: 80vh;
    overflow-y: auto;
    position: relative;
}

.modal-close {
    position: absolute;
    top: 15px;
    right: 15px;
    background: none;
    border: none;
    color: var(--text-secondary);
    font-size: 1.5rem;
    cursor: pointer;
}

.modal-close:hover {
    color: var(--danger);
}

/* Bar Chart */
.bar-chart {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.bar-item {
    display: flex;
    align-items: center;
    gap: 10px;
}

.bar-label {
    width: 100px;
    font-size: 0.85rem;
    color: var(--text-secondary);
}

.bar-track {
    flex: 1;
    height: 20px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 4px;
    overflow: hidden;
}

.bar-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 0.5s ease;
}

.bar-value {
    width: 50px;
    text-align: right;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
}

/* Responsive */
@media (max-width: 1200px) {
    .overview-grid {
        grid-template-columns: 1fr 1fr;
    }
    .overview-card.wide {
        grid-column: span 2;
    }
}

@media (max-width: 768px) {
    .overview-grid {
        grid-template-columns: 1fr;
    }
    .overview-card.wide {
        grid-column: span 1;
    }
    .module-grid, .lego-grid {
        grid-template-columns: 1fr;
    }
    .stats-bar {
        flex-wrap: wrap;
        gap: 15px;
    }
}

    </style>
</head>

// Render KPI Dashboard
function renderKPIs() {
    const grid = document.getElementById('kpi-grid');
    const metrics = DATA.kpi_summary.metrics || {};
    
    const kpiNames = {
        'syntax_error_rate': '語法正確率',
        'structure_completeness': '結構完整度',
        'documentation_coverage': '文檔覆蓋率',
        'complexity_score': '複雜度評分',
        'integration_ratio': '整合比率',
        'reusability_index': '重用性指數',
        'security_score': '安全評分',
        'test_coverage': '測試覆蓋'
    };
    
    let html = '';
    for (const [key, metric] of Object.entries(metrics)) {
        html += `
            <div class="kpi-card ${metric.status}">
                <div class="kpi-value">${metric.value.toFixed(1)}%</div>
                <div class="kpi-label">${kpiNames[key] || key}</div>
                <div class="kpi-target">目標: ${metric.target}%</div>
            </div>
        `;
    }
    
    grid.innerHTML = html || '<div class="kpi-card">無KPI資料</div>';
}

// Render Statistics
function renderStats() {
    const stats = DATA.statistics;
    document.getElementById('stat-modules').textContent = formatNumber(stats.total_modules || 0);
    document.getElementById('stat-lines').textContent = formatNumber(stats.total_lines || 0);
    document.getElementById('stat-legos').textContent = formatNumber(stats.total_lego_blocks || 0);
    document.getElementById('stat-quality').textContent = (stats.avg_quality_score || 0).toFixed(1) + '%';

// Render Overview
function renderOverview() {
    renderLangDistribution();
    renderIntegrationStatus();
    renderDomainDistribution();
    renderModuleMatrix();
}

function renderLangDistribution() {
    const container = document.getElementById('lang-distribution');
    const byLang = DATA.statistics.by_language || {};
    
    let html = '<div class="bar-chart">';
    const total = Object.values(byLang).reduce((a, b) => a + b, 0) || 1;
    const colors = {'python': '#00ff88', 'powershell': '#00f0ff', 'json': '#ffaa00', 'text': '#ff00ff', 'csv': '#6666ff'};
    
    for (const [lang, count] of Object.entries(byLang)) {
        const pct = (count / total * 100).toFixed(1);
        html += `
            <div class="bar-item">
                <span class="bar-label">${lang}</span>
                <div class="bar-track">
                    <div class="bar-fill" style="width: ${pct}%; background: ${colors[lang] || '#aaa'}"></div>
                </div>
                <span class="bar-value">${count}</span>
            </div>
        `;
    }
    html += '</div>';
    container.innerHTML = html;
}

function renderIntegrationStatus() {
    const container = document.getElementById('integration-status');
    const modules = DATA.module_cards;
    
    const counts = {
        'integrated_core': 0,
        'integrated_peripheral': 0,
        'standalone': 0,
        'pending': 0
    };
    
    modules.forEach(m => {
        counts[m.integration_status] = (counts[m.integration_status] || 0) + 1;
    });
    
    const labels = {
        'integrated_core': '核心整合',
        'integrated_peripheral': '周邊整合',
        'standalone': '獨立未整合',
        'pending': '待處理'
    };
    
    const colors = {
        'integrated_core': '#00ff88',
        'integrated_peripheral': '#6666ff',
        'standalone': '#ffaa00',
        'pending': '#aaaacc'
    };
    
    const total = modules.length || 1;
    let html = '<div class="bar-chart">';
    
    for (const [status, count] of Object.entries(counts)) {
        const pct = (count / total * 100).toFixed(1);
        html += `
            <div class="bar-item">
                <span class="bar-label">${labels[status]}</span>
                <div class="bar-track">
                    <div class="bar-fill" style="width: ${pct}%; background: ${colors[status]}"></div>
                </div>
                <span class="bar-value">${count}</span>
            </div>
        `;
    }
    html += '</div>';
    container.innerHTML = html;
}

function renderDomainDistribution() {
    const container = document.getElementById('domain-distribution');
    const modules = DATA.module_cards;
    
    const domains = {};
    modules.forEach(m => {
        domains[m.domain] = (domains[m.domain] || 0) + 1;
    });
    
    const total = modules.length || 1;
    let html = '<div class="bar-chart">';
    
    for (const [domain, count] of Object.entries(domains).sort((a, b) => b[1] - a[1])) {
        const pct = (count / total * 100).toFixed(1);
        html += `
            <div class="bar-item">
                <span class="bar-label">${domain}</span>
                <div class="bar-track">
                    <div class="bar-fill" style="width: ${pct}%; background: var(--primary)"></div>
                </div>
                <span class="bar-value">${count}</span>

        `;
    }
    html += '</div>';
    container.innerHTML = html;
}

function renderModuleMatrix() {

    html += '<tr><th style="text-align: left; padding: 8px; border-bottom: 1px solid var(--border-glow);">模組ID</th>';
    html += '<th style="text-align: left; padding: 8px; border-bottom: 1px solid var(--border-glow);">名稱</th>';
    html += '<th style="text-align: center; padding: 8px; border-bottom: 1px solid var(--border-glow);">函數</th>';
    html += '<th style="text-align: center; padding: 8px; border-bottom: 1px solid var(--border-glow);">類別</th>';
    html += '<th style="text-align: center; padding: 8px; border-bottom: 1px solid var(--border-glow);">品質</th>';
    html += '<th style="text-align: center; padding: 8px; border-bottom: 1px solid var(--border-glow);">狀態</th></tr>';
    
    modules.forEach(m => {
        const qualityClass = m.quality_score >= 70 ? 'high' : m.quality_score >= 50 ? 'medium' : 'low';
        html += `<tr>
            <td style="padding: 8px; color: var(--primary); font-family: 'Orbitron', sans-serif;">${m.module_id}</td>
            <td style="padding: 8px;">${m.file_name}</td>
            <td style="padding: 8px; text-align: center;">${m.functions.length}</td>
            <td style="padding: 8px; text-align: center;">${m.classes.length}</td>
            <td style="padding: 8px; text-align: center;"><span class="quality-fill ${qualityClass}" style="display: inline-block; padding: 2px 8px; border-radius: 4px;">${m.quality_score.toFixed(0)}%</span></td>

    html += '</table>';

// Render Modules
function renderModules(filter = 'all') {
    const grid = document.getElementById('module-grid');
    let modules = DATA.module_cards;
    
    if (filter !== 'all') {
        modules = modules.filter(m => m.language === filter);
    }
    
    let html = '';
    modules.forEach(m => {
        const qualityClass = m.quality_score >= 70 ? 'high' : m.quality_score >= 50 ? 'medium' : 'low';
        html += `
            <div class="module-card" onclick="showModuleDetail('${m.module_id}')">
                <div class="module-header">
                    <span class="module-id">${m.module_id}</span>
                    <span class="module-status ${m.integration_status}">${m.integration_status}</span>
                </div>
                <div class="module-name">${m.file_name}</div>
                <div class="module-language">${m.language} | ${m.domain}</div>
                <div class="module-stats">
                    <span class="module-stat">函數: <span>${m.functions.length}</span></span>
                    <span class="module-stat">類別: <span>${m.classes.length}</span></span>
                    <span class="module-stat">依賴: <span>${m.dependencies.length}</span></span>

                <div class="quality-bar">
                    <div class="quality-fill ${qualityClass}" style="width: ${m.quality_score}%"></div>

// Render Lego Blocks
function renderLegos() {

                <div class="module-language">${b.category} | ${b.language}</div>

                    <span class="module-stat">複雜度: <span>${b.complexity}</span></span>

// Render Dependency Graph (simplified)
function renderDependencyGraph() {
    const container = document.getElementById('dependency-graph');
    const graph = DATA.dependency_graph;
    
    if (!graph.nodes || graph.nodes.length === 0) {
        container.innerHTML = '<div style="text-align: center; padding: 50px; color: var(--text-secondary);">無依賴圖資料</div>';
        return;
    }
    
    // Simple text-based visualization
    let html = '<div style="padding: 20px; font-family: JetBrains Mono, monospace; font-size: 0.85rem;">';
    html += `<div style="margin-bottom: 15px; color: var(--primary);">節點: ${graph.nodes.length} | 邊: ${graph.edges.length} | 入口點: ${graph.entry_points.length}</div>`;
    
    html += '<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px;">';
    graph.nodes.forEach(node => {
        const isEntry = graph.entry_points.includes(node.id);
        html += `<div style="padding: 10px; background: var(--bg-panel); border-radius: 6px; border: 1px solid ${isEntry ? 'var(--success)' : 'var(--border-glow)'};">
            <div style="color: ${isEntry ? 'var(--success)' : 'var(--primary)'}; font-weight: 600;">${node.id}</div>
            <div style="color: var(--text-secondary); font-size: 0.75rem;">${node.name}</div>
        </div>`;
    });
    html += '</div></div>';
    
    container.innerHTML = html;
}

    const modal = document.getElementById('detail-modal');
    const body = document.getElementById('modal-body');
    
    body.innerHTML = `
        <h2 style="font-family: Orbitron; color: var(--primary); margin-bottom: 20px;">${module.module_id}</h2>
        <div style="margin-bottom: 15px;">
            <strong>檔案:</strong> ${module.file_name}<br>
            <strong>路徑:</strong> ${module.file_path}<br>
            <strong>語言:</strong> ${module.language}<br>
            <strong>領域:</strong> ${module.domain}<br>
            <strong>狀態:</strong> <span class="module-status ${module.integration_status}">${module.integration_status}</span>
        </div>
        <div style="margin-bottom: 15px;">
            <strong>品質分數:</strong> ${module.quality_score.toFixed(1)}%<br>
            <strong>複雜度:</strong> ${module.complexity_score.toFixed(1)}<br>

        <div style="margin-bottom: 15px;">
            <strong>函數 (${module.functions.length}):</strong>

// Setup Event Listeners
function setupEventListeners() {
    // Tab switching
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
        });
    });
    
    // Filter buttons
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderModules(btn.dataset.filter);
        });
    });
    
    // Search
    document.getElementById('search-input').addEventListener('input', (e) => {
        filterBySearch(e.target.value);
    });
    
    // Modal close
    document.querySelector('.modal-close').addEventListener('click', () => {
        document.getElementById('detail-modal').classList.remove('active');
    });
    
    document.getElementById('detail-modal').addEventListener('click', (e) => {
        if (e.target.id === 'detail-modal') {
            e.target.classList.remove('active');
        }
    });
    
    // ESC key
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            document.getElementById('detail-modal').classList.remove('active');
        }
    });
}

// Filter by search
function filterBySearch(query) {
    const cards = document.querySelectorAll('.module-card, .lego-card');
    const q = query.toLowerCase();
    
    cards.forEach(card => {
        const text = card.textContent.toLowerCase();
        card.style.display = text.includes(q) ? '' : 'none';
    });
}

// Helper functions
function formatNumber(num) {
    return num.toLocaleString();
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}
