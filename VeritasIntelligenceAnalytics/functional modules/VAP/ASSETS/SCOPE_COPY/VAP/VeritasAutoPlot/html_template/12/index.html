<title>DRUCK // Macro Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<body>
  <div class="terminal">
    <!-- Header bar -->
    <header class="terminal-header">
      <div class="header-left">
        <svg class="logo" width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="DRUCK Logo">
          <rect x="2" y="2" width="24" height="24" rx="3" stroke="currentColor" stroke-width="2"/>
          <path d="M8 8h4a6 6 0 0 1 0 12H8V8z" stroke="#20d997" stroke-width="2" fill="none"/>
          <line x1="20" y1="8" x2="20" y2="20" stroke="#20d997" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <h1 class="terminal-title">DRUCK<span class="title-dim"> // MACRO TERMINAL</span></h1>
      </div>
      <div class="header-right">
        <span class="status-dot"></span>
        <span class="status-label">FRED LIVE</span>
        <span class="clock" id="clock"></span>
      </div>
    </header>

    <!-- Tab bar -->
    <nav class="tab-bar" role="tablist">
      <button class="tab active" role="tab" data-tab="liquidity" aria-selected="true">
        <span class="tab-key">1</span> LIQUIDITY
      </button>
      <button class="tab" role="tab" data-tab="growth">
        <span class="tab-key">2</span> GROWTH
      </button>
      <button class="tab" role="tab" data-tab="inflation">
        <span class="tab-key">3</span> INFLATION
      </button>
      <button class="tab" role="tab" data-tab="housing">
        <span class="tab-key">4</span> HOUSING
      </button>
      <button class="tab" role="tab" data-tab="labor">
        <span class="tab-key">5</span> LABOR
      </button>
      <button class="tab" role="tab" data-tab="markets">
        <span class="tab-key">6</span> MARKETS
      </button>
      <button class="tab" role="tab" data-tab="fiscal">
        <span class="tab-key">7</span> FISCAL
      </button>
    </nav>

    <!-- Main content -->
    <main class="terminal-main" id="main-content">
      <!-- Content injected by JS -->
      <div class="loading-screen" id="loading-screen">
        <div class="loading-text">
          <span class="prompt">&gt;</span> Connecting to FRED API...<br>
          <span class="prompt">&gt;</span> Fetching macro data...<br>
          <span class="prompt">&gt;</span> <span class="blink">_</span>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="terminal-footer">
      <span class="footer-hint">Press <kbd>1</kbd>-<kbd>7</kbd> to switch tabs &middot; <kbd>&larr;</kbd><kbd>&rarr;</kbd> to navigate</span>
      <a href="https://www.perplexity.ai/computer" target="_blank" rel="noopener noreferrer" class="footer-attribution">Created with Perplexity Computer</a>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
