<style>
:root{--bg:#f5f4f0;--bg1:#edecea;--bg2:#e5e3df;--sf:#fff;--sf2:#fafaf8;--bd:#dbd9d3;--bd2:#ccc9c1;

--am:#c4943a;--am-l:#f5e2b8;--co:#c96b5a;--co-l:#f5d0c8;--vi:#7a6daa;--vi-l:#dcd8f0;
--i0:#1e1d1a;--i1:#3d3c38;--i2:#6b6860;--i3:#9c9890;--i4:#c4c0b8;--up:#c0392b;--dn:#2e7d52;

*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sa);background:var(--bg);color:var(--i0);font-size:11.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:3px}
.w{max-width:1560px;margin:0 auto;padding:10px 16px}
.hdr{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r3);padding:11px 16px;margin-bottom:8px;position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;box-shadow:var(--sh2)}
.hdr::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--bl),var(--tl),var(--vi),var(--am),var(--co),var(--gn));background-size:200% 100%;animation:hs 8s linear infinite}
@keyframes hs{0%{background-position:0%}100%{background-position:200%}}
.logo-wrap{width:42px;height:42px;flex-shrink:0;background:linear-gradient(135deg,#1e3a5f,var(--vi));border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--mo);font-size:12px;box-shadow:0 2px 8px rgba(76,120,168,.35)}
.hdr-titles{flex:1}.hdr-title{font-weight:700;font-size:16px}.hdr-title span{color:var(--bl)}
.hdr-sub{font-size:9px;color:var(--i3);font-family:var(--mo);margin-top:2px}
.hdr-r{font-family:var(--mo);font-size:8.5px;text-align:right;color:var(--i2);line-height:1.7}
.winb{background:var(--gn-l);color:var(--gn);padding:2px 9px;border-radius:10px}
.up{color:var(--up)}.dn{color:var(--dn)}.fl{color:var(--i3)}.ar{font-weight:700}
/* hero */
.hero{background:linear-gradient(135deg,var(--sf2),var(--sf));border:1px solid var(--bd);border-radius:var(--r3);padding:14px 16px;margin-bottom:12px;box-shadow:var(--sh)}
.hero-eq{font-family:var(--mo);font-size:10px;color:var(--i3);margin-bottom:10px;text-align:center}.hero-eq b{color:var(--i1)}
.hero-row{display:flex;align-items:stretch;gap:7px;flex-wrap:wrap;justify-content:center}
.op{display:flex;align-items:center;font-family:var(--mo);font-size:20px;color:var(--i3)}
.term{border:1px solid var(--bd);border-radius:var(--r2);background:var(--sf);padding:9px 13px;min-width:108px;text-align:center;position:relative;overflow:hidden}
.term::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--tc)}
.term.lhs{background:linear-gradient(135deg,#1e3a5f,#2d4a6f);color:#fff;border:none;min-width:180px}.term.lhs::before{display:none}
.term .sym{font-family:var(--mo);font-size:18px;font-weight:500;color:var(--tc)}.term.lhs .sym{color:#fff;font-size:11px}
.term .zh{font-size:8.5px;color:var(--i3);margin:2px 0 4px}.term.lhs .zh{color:#b9c7d6}
.term .v{font-family:var(--mo);font-size:15px;font-weight:500}.term.lhs .v{color:#fff;font-size:20px}
.term .sh{font-family:var(--mo);font-size:9px;margin-top:2px;color:var(--i2)}

.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:8px;margin-bottom:12px}
.cc{border:1px solid var(--bd);border-radius:var(--r2);overflow:hidden;background:var(--sf);box-shadow:var(--sh)}
.cc-h{display:flex;align-items:center;gap:8px;padding:8px 11px;border-bottom:1px solid var(--bd);background:var(--sf2);border-left:3px solid var(--tc)}
.cc-sym{font-family:var(--mo);font-size:15px;font-weight:500;color:var(--tc);min-width:18px;text-align:center}
.cc-tt{flex:1}.cc-tt .n{font-weight:700;font-size:11px}.cc-tt .s{font-family:var(--mo);font-size:8px;color:var(--i3)}
.cc-v{font-family:var(--mo);font-size:13px;font-weight:600;text-align:right}
.row{padding:6px 11px;border-bottom:1px solid var(--bg1)}.row:last-child{border-bottom:none}.row:hover{background:rgba(76,120,168,.03)}
.row-top{display:flex;align-items:center;gap:6px}
.row-top .ar{font-size:10px;width:12px;text-align:center}
.row-top .nm{flex:1;font-weight:600;font-size:10px}
.row-top .vu{font-family:var(--mo);font-size:11px;font-weight:600}
.row-top .yy{font-family:var(--mo);font-size:9.5px;font-weight:600;min-width:54px;text-align:right}
.row-bt{display:flex;align-items:center;gap:8px;margin-top:2px;font-family:var(--mo);font-size:8px;color:var(--i3);flex-wrap:wrap}
.row-bt .src{color:var(--bl);background:var(--bl-l);padding:0 5px;border-radius:7px;margin-left:auto}

.sec-t{font-family:var(--sa);font-weight:700;font-size:12px;margin:10px 0 6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sec-t .sm{font-family:var(--mo);font-size:8px;color:var(--am);background:var(--am-l);padding:1px 7px;border-radius:8px;font-weight:400}
.tg{display:inline-flex;gap:2px;margin-left:6px}
.tg button{font-family:var(--mo);font-size:9px;padding:2px 9px;border:1px solid var(--bd);background:var(--sf);color:var(--i2);cursor:pointer;border-radius:var(--r)}
.tg button.on{background:var(--bl);color:#fff;border-color:var(--bl)}
.charts3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.charts4{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:6px}
@media(max-width:1100px){.charts3,.charts4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.charts3,.charts4{grid-template-columns:1fr}}

.ch-leg i{display:inline-block;width:8px;height:3px;border-radius:2px;margin-right:2px;vertical-align:1px}
.ch svg{width:100%;height:auto;display:block}
.ft{font-family:var(--mo);font-size:8.5px;color:var(--i3);padding:12px 2px 8px;border-top:1px solid var(--bd);margin-top:10px;line-height:1.7}

(function(){const X=get('X'),M=get('M'),NX=+(X.val-M.val).toFixed(2),nxsh=X.share+M.share,nt=NX>=0?'up':'dn';
 let h=`<div class="hero"><div class="hero-eq"><b>Real GDP × (1 + π)</b> = C + I + G + ( X − M )　|　名目 ≈ 實質 USD ${D.real}tn × (1+${D.infl}%)</div><div class="hero-row">
  <div class="term lhs"><div class="sym">Real GDP × (1+π)</div><div class="zh">名目 GDP</div><div class="v">USD ${nf(D.nom)}tn</div><div class="sh" style="color:#b9c7d6">π=${D.infl}% ${A('up')}</div></div><div class="op">=</div>`;
 ['C','I','G'].forEach(k=>{const c=get(k);h+=`<div class="term" style="--tc:var(--${c.color})"><div class="sym">${k}</div><div class="zh">${c.zh}</div><div class="v">USD ${nf(c.val)}tn</div><div class="sh">${c.share}% ${A(c.t)}</div></div><div class="op">+</div>`;});
 h+=`<div class="term" style="--tc:var(--am)"><div class="sym" style="font-size:13px">(X−M)</div><div class="zh">淨出口</div><div class="v">${(NX<0?'−':'')}USD ${nf(Math.abs(NX))}tn</div><div class="sh">${nxsh}% ${A(nt)}</div></div></div></div>`;
 document.getElementById('hero').innerHTML=h;})();
// cards (rich sub-rows)
document.getElementById('cards').innerHTML=D.comps.map(c=>{
 const rows=c.subs.map(s=>{const yc=s.yoy>=0?'up':'dn';
  return `<div class="row"><div class="row-top">${A(s.dir)}<span class="nm">${s.n}</span><span class="vu">${nf(s.val)} ${s.unit}</span><span class="yy ${yc}">${pct(s.yoy)}</span></div>
   <div class="row-bt"><span>單月 ${nf(s.mom)}</span><span>累計 ${nf(s.cum)}</span><span>單位 ${s.unit}</span><span class="src">${s.src}</span></div></div>`;}).join('');
 return `<div class="cc"><div class="cc-h" style="--tc:var(--${c.color})"><div class="cc-sym">${c.k}</div><div class="cc-tt"><div class="n">${c.zh}</div><div class="s">${c.share}% of GDP</div></div><div class="cc-v">USD ${nf(c.val)}tn ${A(c.t)}</div></div>${rows}</div>`;}).join('');

// ── SVG + nice scale ──
function NS(t,a){const e=document.createElementNS('http://www.w3.org/2000/svg',t);for(const k in a)e.setAttribute(k,a[k]);return e;}
function cv(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function TX(s,x,y,t,an,sz,col){const e=NS('text',{x,y,'text-anchor':an,'font-size':sz,fill:cv(col),'font-family':'DM Mono, monospace'});e.textContent=t;s.append(e);}
function PL(s,p,c,w,d){const a={points:p.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' '),fill:'none',stroke:cv(c),'stroke-width':w,'stroke-linejoin':'round'};if(d)a['stroke-dasharray']=d;s.append(NS('polyline',a));}
function niceStep(range,n){const raw=range/n,mag=Math.pow(10,Math.floor(Math.log10(raw)||0)),nm=raw/mag;
 const st=nm<=1?1:nm<=2?2:nm<=2.5?2.5:nm<=5?5:10;return st*mag;}
function niceScale(min,max,n){if(min===max){min-=1;max+=1;}let step=niceStep(max-min,n);
 let lo=Math.floor(min/step)*step,hi=lo+step*n;
 while(hi<max){step=niceStep((max-lo)*1.0001,n);hi=lo+step*n;}
 return {lo,hi,step,n};}
const PAL=['--bl','--co','--gn','--am','--vi','--tl','--i2'];
// dual-axis multi-line chart
function dual(svgId,labels,leftLines,right,opt){opt=opt||{};const s=document.getElementById(svgId);s.innerHTML='';
 const W=opt.W||460,H=opt.H||210,L=34,R=36,Tp=10,B=20,pw=W-L-R,ph=H-Tp-B,n=5;
 const lall=leftLines.flatMap(l=>l.data).filter(v=>v!=null);
 let lmin=Math.min(...lall),lmax=Math.max(...lall);if(opt.benchmark!=null){lmin=Math.min(lmin,opt.benchmark);lmax=Math.max(lmax,opt.benchmark);}
 const LS=niceScale(lmin,lmax,n),X=i=>L+pw*i/(labels.length-1),YL=v=>Tp+ph*(LS.hi-v)/(LS.hi-LS.lo);
 let RS=null,YR=null;if(right){const rmin=Math.min(...right.data),rmax=Math.max(...right.data);RS=niceScale(rmin,rmax,n);YR=v=>Tp+ph*(RS.hi-v)/(RS.hi-RS.lo);}
 for(let t=0;t<=n;t++){const y=Tp+ph*t/n;s.append(NS('line',{x1:L,x2:W-R,y1:y,y2:y,stroke:cv('--bg1')}));
   TX(s,L-3,y+3,nf(LS.hi-(LS.hi-LS.lo)*t/n),'end',6.5,'--i3');
   if(RS)TX(s,W-R+3,y+3,nf(RS.hi-(RS.hi-RS.lo)*t/n),'start',6.5,opt.rcol||'--vi');}
 labels.forEach((l,i)=>{if(i%3===0)TX(s,X(i),H-6,l,'middle',6.5,'--i3');});
 if(opt.benchmark!=null){const y=YL(opt.benchmark);s.append(NS('line',{x1:L,x2:W-R,y1:y,y2:y,stroke:'var(--bench)',stroke:cv('--up'),'stroke-width':1,opacity:.8,'stroke-dasharray':'4 2'}));TX(s,L+2,y-2,'基準 '+opt.benchmark,'start',6.5,'--up');}
 leftLines.forEach((l,k)=>PL(s,l.data.map((v,i)=>v==null?null:[X(i),YL(v)]).filter(Boolean),l.col||PAL[k%PAL.length],1.5));
 if(right){PL(s,right.data.map((v,i)=>[X(i),YR(v)]),opt.rcol||'--vi',2,opt.rdash||'');right.data.forEach((v,i)=>s.append(NS('circle',{cx:X(i),cy:YR(v),r:1.8,fill:cv(opt.rcol||'--vi')})));}
}
function legHTML(id,lines,rname,rcol){document.getElementById(id).innerHTML=lines.map((l,k)=>`<span><i style="background:var(${l.col||PAL[k%PAL.length]})"></i>${l.name}</span>`).join('')+(rname?`<span style="color:var(${rcol})">—${rname}(右)</span>`:'');}

// PMI chart (toggle mfg/nmfg) + S&P500 right
function drawPMI(v){const obj=D.pmi[v],names=Object.keys(obj),lines=names.map((nm,k)=>({name:nm,data:obj[nm],col:PAL[k%PAL.length]}));
 dual('c-pmi',D.nfp.lab,lines,{name:'S&P500',data:D.pmi.sp500},{benchmark:50,rcol:'--i0'});
 legHTML('leg-pmi',lines,'S&P500','--i0');}
// CPI chart (toggle cpi/ppi) + GDP growth right
function drawCPI(v){const obj=D.cpi[v],names=Object.keys(obj),lines=names.map((nm,k)=>({name:nm,data:obj[nm],col:PAL[k%PAL.length]}));
 dual('c-cpi',D.nfp.lab,lines,{name:'GDP growth',data:D.cpi.gdpg},{rcol:'--co'});
 legHTML('leg-cpi',lines,'GDP growth%','--co');}
// GDP per capita (toggle annual/quarter)
function drawGPC(v){const o=D.gpc[v];dual('c-gpc',o.lab,[{name:'GDP/人',data:o.pc,col:'--bl'}],{name:'個人收入',data:o.inc},{rcol:'--vi'});}
// 一行四圖
function drawRet(){dual('c-ret',D.retail.lab,[{name:'零售',data:D.retail.lvl,col:'--bl'}],{name:'年增',data:D.retail.yoy},{rcol:'--dn',W:340,H:180});}
function drawConf(){dual('c-conf',D.conf.lab,[{name:'UMich',data:D.conf.umich,col:'--bl'},{name:'CB',data:D.conf.cb,col:'--vi'}],null,{W:340,H:180});}
function drawNFP(){const s=document.getElementById('c-nfp');s.innerHTML='';const W=340,H=180,L=30,R=28,Tp=8,B=18,pw=W-L-R,ph=H-Tp-B,d=D.nfp,nn=d.lab.length;
 const LS=niceScale(Math.min(...d.job,0),Math.max(...d.job),5),YL=v=>Tp+ph*(LS.hi-v)/(LS.hi-LS.lo),y0=YL(0),cx=i=>L+pw*(i+0.5)/nn,bw=pw/nn*0.6;
 for(let t=0;t<=5;t++){const y=Tp+ph*t/5;s.append(NS('line',{x1:L,x2:W-R,y1:y,y2:y,stroke:cv('--bg1')}));TX(s,L-3,y+3,nf(LS.hi-(LS.hi-LS.lo)*t/5),'end',6.5,'--i3');}
 const RS=niceScale(Math.min(...d.ur)-0.2,Math.max(...d.ur)+0.2,5),YR=v=>Tp+ph*(RS.hi-v)/(RS.hi-RS.lo);
 for(let t=0;t<=5;t++)TX(s,W-R+3,Tp+ph*t/5+3,nf(RS.hi-(RS.hi-RS.lo)*t/5)+'%','start',6.5,'--am');
 d.job.forEach((v,i)=>{const col=i===0?'--bl':(v>=d.job[i-1]?'--up':'--dn');s.append(NS('rect',{x:cx(i)-bw/2,y:Math.min(YL(v),y0),width:bw,height:Math.abs(YL(v)-y0),fill:cv(col),opacity:.85}));if(i%3===0)TX(s,cx(i),H-6,d.lab[i],'middle',6.5,'--i3');});
 PL(s,d.ur.map((v,i)=>[cx(i),YR(v)]),'--am',1.8);d.ur.forEach((v,i)=>s.append(NS('circle',{cx:cx(i),cy:YR(v),r:1.8,fill:cv('--am')})));}
function drawDur(){const d=D.dur,lines=[{name:'<5w',data:d.b1,col:'--gn'},{name:'5-14',data:d.b2,col:'--tl'},{name:'15-26',data:d.b3,col:'--am'},{name:'27w+',data:d.b4,col:'--co'}];dual('c-dur',d.lab,lines,null,{W:340,H:180});}

// toggles
function tg(id,fn){const g=document.getElementById(id);g.querySelectorAll('button').forEach(b=>b.onclick=()=>{g.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');fn(b.dataset.v);});}
tg('tg-pmi',drawPMI);tg('tg-cpi',drawCPI);tg('tg-gpc',drawGPC);
drawPMI('mfg');drawCPI('cpi');drawGPC('annual');drawRet();drawConf();drawNFP();drawDur();
</script></body></html>
