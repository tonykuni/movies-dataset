<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VIA Note Pro · 獨立版</title>
<style>
  :root{
    --bg:#ffffff; --bg2:#f7f6f3; --paper2:#f7f6f3; --sidebar:#fbfaf8; --paper:#ffffff;
    --ink:#1e1d1a; --ink2:#37352f; --mut:#787268; --mut2:#9b9690;
    --line:#eceae4; --soft:#f1efea; --hover:#f1efe9;
    --blue:#4c78a8; --teal:#439a9a; --am:#c4943a; --gn:#5a9e6f; --rd:#c96b5a;
    --accent:#439a9a;
    --reson:linear-gradient(90deg,#c96b5a 0 14.2%,#c4943a 0 28.5%,#5a9e6f 0 42.8%,#439a9a 0 57.1%,#4c78a8 0 71.4%,#7a6daa 0 85.7%,#1e1d1a 0 100%);
    --sans:'Segoe UI','PingFang TC','Microsoft JhengHei','Noto Sans TC',system-ui,-apple-system,sans-serif;
    --disp:'Segoe UI',Georgia,'Noto Sans TC',system-ui,sans-serif;
    --mono:'Cascadia Code','Consolas','SFMono-Regular',ui-monospace,'DejaVu Sans Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);height:100%;}
  body{color:var(--ink2);font-family:var(--sans);font-size:12.5px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  [contenteditable]{outline:none;}
  [contenteditable][data-empty]:empty:before{content:attr(data-empty);color:var(--mut2);pointer-events:none;}
  ::selection{background:rgba(67,154,154,.20);}
  select{appearance:none;-webkit-appearance:none;background:#fff;padding-right:6px;cursor:pointer;color:var(--ink2);}
  select:focus{outline:1px solid var(--accent);}
  button{font-family:var(--sans);cursor:pointer;border:none;background:none;color:inherit;}
  input,textarea{font-family:var(--sans);}
  .blk:hover .grip,.blk:hover .add-btn{opacity:1;}
  .grip,.add-btn{transition:opacity .12s;}
  .blk.drop-above{box-shadow:inset 0 2px 0 var(--accent);}
  .blk.drop-below{box-shadow:inset 0 -2px 0 var(--accent);}
  .pg:hover .pg-del{opacity:1;}
  .tbl{border-collapse:collapse;width:100%;font-size:11.5px;}
  .tbl td{border:1px solid var(--line);padding:5px 8px;min-width:60px;vertical-align:top;}
  .tbl td:focus{outline:1.5px solid var(--accent);outline-offset:-1px;}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#dedcd5;border-radius:6px}
  @media print{
    @page{size:A4;margin:11mm}
    html,body{background:#fff !important}
    .noprint{display:none !important}
    aside,.topbar{display:none !important}
    main{overflow:visible !important}
    *{box-shadow:none !important}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";
(function(){
  /* ============================================================
     VIA Note Pro — Standalone (no framework, no network, no assets)
     Rewrite of the DC-framework VIA_Note_Pro.dc.html.
     Runs by double-click from file://. All data in localStorage.
     ============================================================ */

  var LS = 'via_note_pro_v8';
  var SNAP_LS = 'via_note_pro_v8_snapshots';
  var E = document;

  /* ---------- tiny helpers ---------- */
  function uid(){ return 'b' + Math.random().toString(36).slice(2,9); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function nowClock(){ var d=new Date(); return '存於 '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
  function stamp(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
  function download(name, text, mime){
    var blob = new Blob([text], {type: mime||'application/octet-stream'});
    var url = URL.createObjectURL(blob);
    var a = E.createElement('a'); a.href=url; a.download=name; E.body.appendChild(a); a.click();
    setTimeout(function(){ E.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
  }
  function copyText(t){
    if (navigator.clipboard && navigator.clipboard.writeText){
      return navigator.clipboard.writeText(t).catch(function(){ fallbackCopy(t); });
    }
    fallbackCopy(t); return Promise.resolve();
  }
  function fallbackCopy(t){
    var ta=E.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
    E.body.appendChild(ta); ta.select(); try{E.execCommand('copy');}catch(e){} E.body.removeChild(ta);
  }

  /* ---------- gradient cover banners (replaces external images) ---------- */
  var BANNERS = [
    ['BNR-FOREST-001','晨光森林 Sunbeam Forest','linear-gradient(135deg,#20402c 0%,#3f7a53 45%,#a9c48a 100%)'],
    ['BNR-FOREST-002','霧林 Misty Pines','linear-gradient(160deg,#2c3a3a 0%,#4d6f6a 55%,#9fb7ab 100%)'],
    ['BNR-GREENHOUSE-001','溫室植物 Greenhouse','linear-gradient(120deg,#1f3b34 0%,#3f8f7d 50%,#cbe3b6 100%)'],
    ['BNR-GLASS-001','溫室窗 Glasshouse','linear-gradient(135deg,#26424a 0%,#4a8a94 55%,#bfe0dc 100%)'],
    ['BNR-WINDOW-001','花窗 Window & Blooms','linear-gradient(140deg,#5a3a52 0%,#a86a7a 50%,#e8c9a8 100%)'],
    ['BNR-CAFE-001','海邊書店 Seaside Cafe','linear-gradient(135deg,#1e3a4c 0%,#3f7fa0 55%,#d8c39a 100%)'],
    ['BNR-DUSK-001','暮色 Dusk Ridge','linear-gradient(135deg,#3a2b4a 0%,#7a5a8a 45%,#c98a6a 100%)'],
    ['BNR-SLATE-001','石墨 Slate','linear-gradient(135deg,#22262b 0%,#454b52 55%,#8a9299 100%)']
  ];
  function bannerById(id){ for(var i=0;i<BANNERS.length;i++){ if(BANNERS[i][0]===id) return BANNERS[i]; } return BANNERS[0]; }

  /* ---------- state ---------- */
  var state = {
    docs: [], active: 0, query: '', slash: null, sbOpen: true, split: null,
    palette: false, present: false, saveStatus: 'idle', saveMsg: '',
    vtr: null, showVtr: false
  };
  var saveTimer=null, savedFlash=false, savedFlashT=null, copiedId=null, copiedT=null;
  var dragBid=null;

  /* ---------- persistence (errors surfaced, never swallowed) ---------- */
  function load(){
    try{
      var raw = localStorage.getItem(LS);
      if(raw){ var d=JSON.parse(raw); if(d && d.docs && d.docs.length) return migrate(d); }
    }catch(e){ /* corrupt store — fall through to seed, but warn */
      state.saveStatus='error'; state.saveMsg='讀取本機資料失敗，已載入預設內容。舊資料仍在瀏覽器中，請匯出備份後再繼續。';
    }
    return { docs: seed(), active:0 };
  }
  function migrate(d){
    // ensure every doc/block has ids & fields
    d.docs.forEach(function(doc){
      if(!doc.id) doc.id = uid();
      if(!doc.blocks) doc.blocks=[];
      doc.blocks.forEach(function(b){ if(!b.id) b.id=uid(); if(b.indent==null) b.indent=0; });
    });
    return d;
  }
  function persist(){
    try{
      var payload = { docs: state.docs, active: state.active, _v:8, _at: stamp() };
      localStorage.setItem(LS, JSON.stringify(payload));
      if(state.saveStatus==='error'){ state.saveStatus='idle'; state.saveMsg=''; renderBanner(); }
      return true;
    }catch(e){
      state.saveStatus='error';
      var full = (e && (e.name==='QuotaExceededError' || e.code===22 || e.code===1014));
      state.saveMsg = full
        ? '本機儲存空間已滿，變更無法寫入！請立即「匯出 JSON」備份，並刪除不需要的頁面或快照。'
        : '自動儲存失敗（'+(e&&e.name||'未知錯誤')+'）。請匯出 JSON 備份，避免資料遺失。';
      renderBanner();
      return false;
    }
  }
  function save(){ // debounced autosave
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){ persist(); updateFooter(); }, 350);
  }
  function saveNow(){
    var ok = persist();
    if(ok){ savedFlash=true; renderTopbar(); clearTimeout(savedFlashT); savedFlashT=setTimeout(function(){ savedFlash=false; renderTopbar(); },1500); }
  }

  /* ---------- seed content (kept from original app) ---------- */
  function seed(){
    var META = '【元規定 · Prompt 生成器 Meta-Prompt v1.1】\n你是嚴謹的 Prompt 架構師。將我口語化的需求，轉成一份結構化、可重現、AI 易懂的 Prompt。嚴格依下列規格：\n\n■ 必含九段：①角色 ②目標(可驗證) ③脈絡(時間/版本錨) ④步驟(相依) ⑤推理要求 ⑥輸出格式(JSON/表格+最小範例) ⑦約束(不可杜撰/標不確定) ⑧品質準則(正確>完整>簡潔,數字加單位千分位) ⑨自我驗證清單。\n■ 多語言：保留專有名詞;程式碼用 ``` 圍欄標語言、逐字保真不轉換;需轉譯才明示來源→目標。\n■ 變數以 {{VAR}} 標示,末尾附變數說明表。\n■ 輸出:先 PROMPT 正文(可整段複製),再使用說明+變數說明。\n\n👉 貼上你的需求生成完整 Prompt。';
    return [
      { id:uid(), icon:'💬', title:'Prompt Management', grid:true, blocks:[
        { id:uid(), type:'prompt', text:META, lang:'Markdown', langs:['Markdown'], prog:'meta_prompt_generator', ver:'v1.1.0', savedAt:'存於 08:55', indent:0 },
        { id:uid(), type:'prompt', text:'從 broker PDF 擷取：分析師、券商、評等、目標價、報告日。\nTW_TICKER 不可竄改；目標價 NEVER overwrite。', lang:'Markdown', prog:'report_parser', ver:'v0.9.1', savedAt:'存於 09:05', indent:0 },
        { id:uid(), type:'prompt', text:'SSOT 同義字解析：輸入欄位別名（中/英/API），輸出正規欄位 + 公式 + 驗算。', lang:'Markdown', prog:'ssot_synonym', ver:'v2.0.0', savedAt:'存於 09:10', indent:0 }
      ]},
      { id:uid(), icon:'🗂️', title:'SSOT Management', blocks:[
        { id:uid(), type:'h2', text:'SSOT 管理計畫', indent:0 },
        { id:uid(), type:'bullet', text:'Ticker 規則：TW_TICKER / yfinance / Bloomberg 三碼前四位一致', indent:0 },
        { id:uid(), type:'bullet', text:'日期標準化：跑資料前一律轉 YYYY-MM-DD', indent:0 },
        { id:uid(), type:'bullet', text:'同義字引擎：中/英/API 別名 → 正規欄位', indent:0 },
        { id:uid(), type:'code', text:'TW_TICKER = ^[1-9][0-9]{3}$', lang:'Python', langs:['Python'], prog:'ssot_rules', ver:'v2.0.0', indent:0 }
      ]},
      { id:uid(), icon:'🛠️', title:'VIA 開發進度 · 項目管理', blocks:[
        { id:uid(), type:'h2', text:'開發進度總覽', indent:0 },
        { id:uid(), type:'callout', text:'VIA 平台模組化開發 · 三軌並行：分析引擎 / 視覺化 / SSOT 治理。整體進度約 68%。', indent:0 },
        { id:uid(), type:'h3', text:'① 分析引擎 Analysis Engine', indent:0 },
        { id:uid(), type:'todo', text:'族群自動分類（hotness × leadership）', done:true, indent:0 },
        { id:uid(), type:'todo', text:'2026 風險引擎 v10（觸發 × 脆弱）', done:true, indent:0 },
        { id:uid(), type:'todo', text:'接 yfinance / FRED 即時資料', done:false, indent:0 },
        { id:uid(), type:'h3', text:'② 視覺化 Visualization', indent:0 },
        { id:uid(), type:'todo', text:'儀表板標準化（Visual Lock / VRN 扁平）', done:true, indent:0 },
        { id:uid(), type:'todo', text:'K線 + BB + SMA + 法人堆疊', done:false, indent:0 }
      ]},
      { id:uid(), icon:'💡', title:'IDEA Management', grid:true, blocks:[
        { id:uid(), type:'prompt', text:'構想：把族群輪動 + 原物料領先指標串成單一「資金流向羅盤」儀表板。', lang:'Markdown', prog:'idea_compass', ver:'v0.1', savedAt:'未存', indent:0 },
        { id:uid(), type:'prompt', text:'構想：Prompt 版本 A/B 測試框架，自動比對輸出品質並記分。', lang:'Markdown', prog:'idea_abtest', ver:'v0.1', savedAt:'未存', indent:0 }
      ]}
    ];
  }

  /* ---------- block model helpers ---------- */
  function activeDoc(){ return state.docs[state.active] || state.docs[0]; }
  function findBlock(id){ var d=activeDoc(); for(var i=0;i<d.blocks.length;i++){ if(d.blocks[i].id===id) return d.blocks[i]; } return null; }
  function blockIndex(id){ var d=activeDoc(); for(var i=0;i<d.blocks.length;i++){ if(d.blocks[i].id===id) return i; } return -1; }

  var SLASH_DEFS = [
    ['text','📝','文字','純文字段落'],['h1','H₁','標題 1','大標題'],['h2','H₂','標題 2','中標題'],
    ['h3','H₃','標題 3','小標題'],['bullet','•','項目清單','無序清單'],['numbered','1.','編號清單','有序清單'],
    ['todo','☑','待辦','核取清單'],['quote','❝','引用','引述區塊'],['callout','💡','標註','強調框'],
    ['code','‹›','程式碼','等寬程式區塊'],['prompt','✦','Prompt','可複製給 AI 的 Prompt 卡'],
    ['table','▦','表格','可編輯表格'],['divider','―','分隔線','水平分隔線']
  ];
  var LANG_OPTS = ['Markdown','Python','JavaScript','TypeScript','PowerShell','SQL','R','Bash','C++','Go','Rust','HTML','JSON','YAML'];

  /* ============================================================
     RENDER  (full re-render on structural changes only;
              typing never triggers full render → caret is safe)
     ============================================================ */
  function render(){
    var app = E.getElementById('app');
    app.innerHTML =
      '<div style="display:flex;height:100vh;overflow:hidden;background:var(--bg);">' +
        sidebarHTML() +
        mainHTML() +
      '</div>' +
      overlaysHTML();
    syncEditables();
    positionSlash();
  }

  function sidebarHTML(){
    if(!state.sbOpen) return '';
    var q=(state.query||'').toLowerCase();
    var rows = state.docs.map(function(d,i){
      var hit = !q || (d.title||'').toLowerCase().indexOf(q)>=0 || (d.blocks||[]).some(function(b){return (b.text||'').toLowerCase().indexOf(q)>=0;});
      if(!hit) return '';
      return '<div class="pg" data-open="'+i+'" style="display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;cursor:pointer;user-select:none;margin-bottom:1px;'+(i===state.active?'background:var(--hover);':'')+'">'+
        '<span style="font-size:15px;line-height:1;">'+esc(d.icon||'📄')+'</span>'+
        '<span style="flex:1;font:600 11px var(--sans);color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+esc(d.title||'無標題')+'</span>'+
        '<span class="pg-del" data-delpage="'+i+'" style="opacity:0;font-size:13px;color:var(--mut2);padding:0 2px;">🗑</span>'+
      '</div>';
    }).join('');
    var blockCount = state.docs.reduce(function(a,d){return a+(d.blocks?d.blocks.length:0);},0);
    return '<aside style="width:210px;flex:none;background:var(--sidebar);border-right:1px solid var(--line);display:flex;flex-direction:column;height:100%;" class="noprint">'+
      '<div style="height:4px;background:var(--reson);"></div>'+
      '<div style="padding:14px 14px 10px;display:flex;align-items:center;gap:9px;">'+
        '<div style="width:38px;height:38px;border-radius:8px;flex:none;background:var(--reson);display:flex;align-items:center;justify-content:center;font:800 15px var(--disp);color:#fff;box-shadow:0 1px 4px rgba(31,42,42,.25);">V</div>'+
        '<div style="line-height:1.2;"><div style="font:800 12px var(--disp);color:var(--ink);">VIS Smart Asset Mgmt</div><div style="font:600 8px var(--mono);color:var(--mut);letter-spacing:.3px;">VERITAS INTELLIGENCE</div><div style="font:500 7.5px var(--mono);color:var(--mut2);letter-spacing:.3px;">STANDALONE · OFFLINE</div></div>'+
      '</div>'+
      '<div style="padding:2px 12px 8px;">'+
        '<input id="searchbox" value="'+esc(state.query)+'" placeholder="🔍 搜尋筆記…  (Ctrl+K 指令)" style="width:100%;font:500 12px var(--sans);color:var(--ink2);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:6px 10px;" />'+
      '</div>'+
      '<div style="flex:1;overflow-y:auto;padding:2px 8px 8px;">'+
        '<div style="font:700 10px var(--mono);letter-spacing:1px;color:var(--mut2);text-transform:uppercase;padding:8px 8px 5px;">頁面 Pages</div>'+
        rows+
        '<div data-addpage="1" style="display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;user-select:none;color:var(--mut);margin-top:3px;"><span style="font-size:14px;">＋</span><span style="font:600 12px var(--sans);">新增頁面</span></div>'+
      '</div>'+
      '<div style="border-top:1px solid var(--line);padding:8px 12px;display:flex;flex-direction:column;gap:6px;">'+
        '<div style="display:flex;gap:5px;flex-wrap:wrap;">'+
          navBtn('exportJson','⭳ JSON')+navBtn('importJson','⭱ 匯入')+navBtn('exportMd','⭳ MD')+navBtn('snapshot','⛃ 快照')+navBtn('vtr','◫ VTR')+
        '</div>'+
        '<div id="footer" style="font:500 9px var(--mono);color:var(--mut2);display:flex;justify-content:space-between;align-items:center;">'+footerText()+'<span data-togglesb="1" style="cursor:pointer;user-select:none;font-weight:700;color:var(--mut);">« 收合</span></div>'+
      '</div>'+
    '</aside>';
  }
  function navBtn(act,label){ return '<button data-nav="'+act+'" style="font:600 9px var(--mono);color:var(--ink2);background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:4px 7px;">'+esc(label)+'</button>'; }
  function footerText(){ var bc=state.docs.reduce(function(a,d){return a+(d.blocks?d.blocks.length:0);},0); return '<span>'+state.docs.length+' 頁 · '+bc+' 區塊</span>'; }
  function updateFooter(){ var f=E.getElementById('footer'); if(f){ f.innerHTML=footerText()+'<span data-togglesb="1" style="cursor:pointer;user-select:none;font-weight:700;color:var(--mut);">« 收合</span>'; } }

  function mainHTML(){
    var doc = activeDoc();
    var isSplit = state.split==='lr' || state.split==='tb';
    var dir = state.split==='tb' ? 'column' : 'row';
    var paneMax = state.split ? '100%' : '1180px';
    return '<main style="flex:1;height:100%;background:var(--bg);position:relative;display:flex;flex-direction:'+dir+';overflow:hidden;">'+
      (state.sbOpen?'':'<span data-togglesb="1" title="展開側欄" class="noprint" style="position:fixed;left:10px;top:12px;z-index:40;font:700 12px var(--mono);color:var(--mut);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:4px 9px;cursor:pointer;user-select:none;box-shadow:0 1px 3px rgba(31,42,42,.1);">☰</span>')+
      topbarHTML()+
      '<div style="flex:1;min-width:0;min-height:0;overflow-y:auto;position:relative;">'+
        '<div style="max-width:'+paneMax+';margin:0 auto;padding:0 0 200px;">'+
          coverHTML(doc)+
          '<div style="max-width:1180px;margin:0 auto;padding:'+(doc.cover?'14px':'34px')+' 20px 0;">'+
            headHTML(doc)+
            '<div id="blocks" data-grid="'+(doc.grid?1:0)+'" style="'+(doc.grid?'display:grid;grid-template-columns:1fr 1fr;gap:6px;align-items:start;':'')+'">'+
              blocksHTML(doc)+
            '</div>'+
            quickAddHTML()+
          '</div>'+
        '</div>'+
      '</div>'+
      (isSplit?companionPane(doc):'')+
    '</main>';
  }

  function topbarHTML(){
    function seg(act,label,title,on){ return '<span data-nav="'+act+'" title="'+esc(title)+'" style="font:700 10px var(--mono);cursor:pointer;user-select:none;border-radius:5px;padding:3px 8px;'+(on?'background:var(--ink);color:#fff;':'color:var(--mut);')+'">'+esc(label)+'</span>'; }
    var saveCss = savedFlash?'background:var(--gn);color:#fff;':'color:var(--mut);';
    var saveLabel = savedFlash?'✓ 已儲存':'💾 儲存';
    return '<div class="topbar noprint" style="position:fixed;right:14px;top:12px;z-index:40;display:flex;gap:3px;background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:3px;box-shadow:0 1px 3px rgba(31,42,42,.1);">'+
      '<span data-nav="saveNow" title="立即儲存 (Ctrl/⌘+S)" style="font:700 10px var(--mono);cursor:pointer;user-select:none;border-radius:5px;padding:3px 9px;'+saveCss+'">'+saveLabel+'</span>'+
      '<span style="width:1px;background:var(--line);margin:1px 2px;"></span>'+
      seg('present','▷','簡報模式',false)+
      seg('print','⎙','列印 / PDF',false)+
      '<span style="width:1px;background:var(--line);margin:1px 2px;"></span>'+
      seg('split1','▭','單欄',!state.split)+
      seg('splitLR','▥','左右分割',state.split==='lr')+
      seg('splitTB','▤','上下分割',state.split==='tb')+
    '</div>';
  }
  function renderTopbar(){ var m=E.querySelector('main'); if(!m) return; var old=m.querySelector('.topbar'); if(old){ var wrap=E.createElement('div'); wrap.innerHTML=topbarHTML(); old.replaceWith(wrap.firstChild); } }

  function coverHTML(doc){
    if(!doc.cover) return '';
    var b = bannerById(doc.cover);

      '<span data-copy="'+b.id+'" title="複製" style="margin-left:auto;font:700 9px var(--mono);color:#fff;background:var(--ink);border-radius:4px;padding:3px 9px;cursor:pointer;user-select:none;flex:none;">'+copyLabel+'</span>'+

  function companionBody(doc){
    var out='<div style="font:800 20px var(--disp);color:#1e1d1a;margin-bottom:8px;">'+esc(doc.title||'無標題')+'</div>';
    var st={h1:'font:800 19px var(--disp);margin:10px 0 4px;color:#1e1d1a;',h2:'font:800 15.5px var(--disp);margin:8px 0 3px;color:#1e1d1a;',h3:'font:700 13px var(--disp);margin:6px 0 3px;color:#1e1d1a;',text:'font:400 12.5px/1.6 var(--sans);color:#33403f;margin:2px 0;',bullet:'font:400 12.5px/1.6 var(--sans);color:#33403f;margin:2px 0;',todo:'font:400 12.5px/1.6 var(--sans);color:#33403f;margin:2px 0;',quote:"font:500 12.5px/1.6 var(--sans);color:#6b6860;font-style:italic;border-left:3px solid #1e1d1a;padding-left:11px;margin:4px 0;",callout:'font:400 12px/1.55 var(--sans);color:#33403f;background:#f1efea;border:1px solid #eceae4;border-radius:7px;padding:8px 12px;margin:4px 0;',code:"font:500 12px/1.55 var(--mono);color:#2f6f6f;background:#f6f8f8;border:1px solid #eceae4;border-radius:7px;padding:9px 13px;white-space:pre-wrap;margin:4px 0;",prompt:"font:400 12px/1.55 var(--sans);color:#33403f;background:#fbf7ef;border:1px solid #eceae4;border-left:3px solid #c4943a;border-radius:7px;padding:9px 13px;white-space:pre-wrap;margin:4px 0;"};

  function buildSlides(doc){

  function addBlock(afterId,type){

    if(nb.type==='prompt'||nb.type==='code'){ nb.lang=nb.type==='prompt'?'Markdown':'Python'; nb.langs=[nb.lang]; nb.ver='v0'; nb.savedAt='未存'; }

  function exportMd(){
    var doc=activeDoc(); var out='# '+(doc.title||'無標題')+'\n\n'; var num=0;
    doc.blocks.forEach(function(b){
      var pre=('   ').repeat(b.indent||0);
      if(b.type==='h1') out+='\n# '+(b.text||'')+'\n';
      else if(b.type==='h2') out+='\n## '+(b.text||'')+'\n';
      else if(b.type==='h3') out+='\n### '+(b.text||'')+'\n';
      else if(b.type==='bullet') out+=pre+'- '+(b.text||'')+'\n';
      else if(b.type==='numbered'){ num++; out+=pre+num+'. '+(b.text||'')+'\n'; }
      else if(b.type==='todo') out+=pre+'- ['+(b.done?'x':' ')+'] '+(b.text||'')+'\n';
      else if(b.type==='quote') out+='> '+(b.text||'')+'\n';
      else if(b.type==='callout') out+='> 💡 '+(b.text||'')+'\n';
      else if(b.type==='divider') out+='\n---\n';
      else if(b.type==='code') out+='\n```'+(b.lang||'')+'\n'+(b.text||'')+'\n```\n';
      else if(b.type==='prompt') out+='\n> **PROMPT'+(b.prog?' · '+b.prog:'')+(b.ver?' '+b.ver:'')+'**\n```\n'+(b.text||'')+'\n```\n';
      else if(b.type==='table' && b.table) out+='\n'+mdTable(b.table)+'\n';
      else out+=(b.text||'')+'\n';
      if(b.type!=='numbered') num=0;
    });
    download((doc.title||'note').replace(/[^\w一-龥-]+/g,'_')+'.md', out, 'text/markdown');

  function mdTable(t){ var rows=t.rows; if(!rows.length) return ''; var head='| '+rows[0].join(' | ')+' |'; var sep='| '+rows[0].map(function(){return '---';}).join(' | ')+' |'; var body=rows.slice(1).map(function(r){return '| '+r.join(' | ')+' |';}).join('\n'); return head+'\n'+sep+'\n'+body; }

  }
  function normalizeVtr(d){
    // accept a few shapes; be defensive
    var segs=d.segments||d.segs||[];
    if(!segs.length && Array.isArray(d.blocks)) segs=d.blocks;
    return { doc_id:d.doc_id||d.id||d.docId||'', segments:segs.map(function(s,i){ return { index:s.index!=null?s.index:i, text:s.text||s.restored||s.content||'', lang:s.lang||s.language||'', confidence:(s.confidence!=null?s.confidence:(s.conf!=null?s.conf:null)), status:s.status||s.gate||'' }; }), patches:(d.patches||d.patch_log||[]).map(function(p){ return { patch_id:p.patch_id||p.id||'', rule_id:p.rule_id||p.rule||'', stage:p.stage||'', before:p.before||p.from||'', after:p.after||p.to||'' }; }) };
  }

  /* ============================================================
     EVENT WIRING (delegation)
     ============================================================ */
  function nav(act){
    switch(act){
      case 'saveNow': saveNow(); break;
      case 'print': window.print(); break;
      case 'split1': state.split=null; render(); break;
      case 'splitLR': state.split='lr'; render(); break;
      case 'splitTB': state.split='tb'; render(); break;
      case 'present': state.present=true; state.slideIdx=0; render(); break;
      case 'cycleIcon': cycleIcon(); break;
      case 'addCover': case 'changeCover': state.bannerPick=true; render(); break;
      case 'removeCover': activeDoc().cover=null; save(); render(); break;
      case 'exportJson': exportJson(); break;
      case 'importJson': importJson(); break;
      case 'exportMd': exportMd(); break;
      case 'snapshot': state.showSnap=true; render(); break;
      case 'vtr': state.showVtr=true; render(); break;
      case 'vtrClear': state.vtr=null; render(); break;
      case 'present': state.present=true; render(); break;
      case 'dismissBanner': state.saveStatus='idle'; state.saveMsg=''; renderBanner(); break;
    }
  }

  function onClick(e){
    var t=e.target;
    var el=t.closest?t.closest('[data-nav],[data-open],[data-delpage],[data-addpage],[data-togglesb],[data-add],[data-quick],[data-slash],[data-collapse],[data-copy],[data-rmlang],[data-marker],[data-banner],[data-cmd],[data-modalclose],[data-snapnew],[data-snaprestore],[data-snapdel],[data-vtrpick],[data-tbl],[data-slide]'):null;
    if(!el) return;
    if(el.hasAttribute('data-nav')){ e.preventDefault(); nav(el.getAttribute('data-nav')); return; }
    if(el.hasAttribute('data-open')){ openPage(+el.getAttribute('data-open')); return; }
    if(el.hasAttribute('data-delpage')){ e.stopPropagation(); delPage(+el.getAttribute('data-delpage')); return; }
    if(el.hasAttribute('data-addpage')){ addPage(); return; }
    if(el.hasAttribute('data-togglesb')){ state.sbOpen=!state.sbOpen; render(); return; }
    if(el.hasAttribute('data-add')){ addBlock(el.getAttribute('data-add')); return; }
    if(el.hasAttribute('data-quick')){ addBlock(null, el.getAttribute('data-quick')); return; }
    if(el.hasAttribute('data-slash')){ if(state.slash) applyType(state.slash.id, el.getAttribute('data-slash')); return; }
    if(el.hasAttribute('data-collapse')){ var b=findBlock(el.getAttribute('data-collapse')); if(b){ var isP=b.type==='prompt'; b.collapsed=!(b.collapsed===undefined?isP:b.collapsed); save(); render(); } return; }
    if(el.hasAttribute('data-copy')){ var cb=findBlock(el.getAttribute('data-copy')); if(cb){ copyText(cb.text||''); copiedId=cb.id; render(); clearTimeout(copiedT); copiedT=setTimeout(function(){ copiedId=null; render(); },1200); } return; }
    if(el.hasAttribute('data-rmlang')){ var parts=el.getAttribute('data-rmlang').split('|'); var rb=findBlock(parts[0]); if(rb){ rb.langs=(rb.langs||[rb.lang]).filter(function(x){return x!==parts[1];}); rb.lang=rb.langs[0]||''; save(); render(); } return; }
    if(el.hasAttribute('data-marker')){ var mb=findBlock(el.getAttribute('data-marker')); if(mb && mb.type==='todo'){ mb.done=!mb.done; save(); render(); } return; }
    if(el.hasAttribute('data-banner')){ var d=activeDoc(); d.cover=el.getAttribute('data-banner'); if(d.coverZoom==null) d.coverZoom=100; if(d.coverPos==null) d.coverPos=50; state.bannerPick=false; save(); render(); return; }
    if(el.hasAttribute('data-modalclose')){ closeModal(el.getAttribute('data-modalclose')); return; }
    if(el.hasAttribute('data-cmd')){ runCmd(el.getAttribute('data-cmd')); return; }
    if(el.hasAttribute('data-snapnew')){ makeSnapshot(); render(); return; }
    if(el.hasAttribute('data-snaprestore')){ restoreSnapshot(+el.getAttribute('data-snaprestore')); return; }
    if(el.hasAttribute('data-snapdel')){ var arr=loadSnaps(); arr.splice(+el.getAttribute('data-snapdel'),1); saveSnaps(arr); render(); return; }
    if(el.hasAttribute('data-vtrpick')){ importVtr(); return; }
    if(el.hasAttribute('data-tbl')){ tableOp(el.getAttribute('data-tbl')); return; }
    if(el.hasAttribute('data-slide')){ slideNav(el.getAttribute('data-slide')); return; }
  }
  function closeModal(which){
    if(which==='close-banner') state.bannerPick=false;
    else if(which==='close-snap') state.showSnap=false;
    else if(which==='close-vtr') state.showVtr=false;
    render();
  }
  function runCmd(id){
    var parts=id.split('|');
    state.palette=false; state.paletteQ='';
    if(parts[0]==='go'){ openPage(+parts[1]); return; }
    if(parts[0]==='ins'){ render(); addBlock(null, parts[1]); return; }
    if(parts[0]==='act'){ render(); setTimeout(function(){ nav(parts[1]); },0); return; }
    render();
  }
  function tableOp(spec){
    var parts=spec.split('|'); var op=parts[0]; var b=findBlock(parts[1]); if(!b||!b.table) return;
    var rows=b.table.rows;
    if(op==='row') rows.push(rows[0].map(function(){return '';}));
    else if(op==='col') rows.forEach(function(r,i){ r.push(i===0?'欄':''); });
    else if(op==='delrow'){ if(rows.length>1) rows.pop(); }
    else if(op==='delcol'){ if(rows[0].length>1) rows.forEach(function(r){ r.pop(); }); }
    save(); render();
  }
  function slideNav(dir){
    var slides=buildSlides(activeDoc());
    if(dir==='exit'){ state.present=false; render(); return; }
    if(dir==='next') state.slideIdx=Math.min((state.slideIdx||0)+1, slides.length-1);
    if(dir==='prev') state.slideIdx=Math.max((state.slideIdx||0)-1, 0);
    render();
  }

  function onInput(e){
    var t=e.target;
    if(t.getAttribute && t.getAttribute('data-title')!=null){ activeDoc().title=t.textContent; save(); return; }
    if(t.getAttribute && t.getAttribute('data-edit')!=null){ setText(t.getAttribute('data-bid'), t.textContent); return; }
    if(t.getAttribute && t.getAttribute('data-cell')!=null){ var p=t.getAttribute('data-cell').split('|'); var b=findBlock(p[0]); if(b&&b.table){ b.table.rows[+p[1]][+p[2]]=t.textContent; save(); } return; }
    if(t.id==='searchbox'){ state.query=t.value; renderSidebarOnly(); return; }
    if(t.id==='palInput'){ state.paletteQ=t.value; renderPaletteOnly(); return; }
    if(t.getAttribute && t.getAttribute('data-prog')!=null){ var pb=findBlock(t.getAttribute('data-prog')); if(pb){ pb.prog=t.value; pb.savedAt=nowClock(); save(); } return; }
    if(t.getAttribute && t.getAttribute('data-ver')!=null){ var vb=findBlock(t.getAttribute('data-ver')); if(vb){ vb.ver=t.value; vb.savedAt=nowClock(); save(); } return; }
    if(t.getAttribute && t.getAttribute('data-cover')!=null){ var d=activeDoc(); var which=t.getAttribute('data-cover'); if(which==='zoom') d.coverZoom=+t.value; else d.coverPos=+t.value; var bg=E.getElementById('coverbg'); if(bg){ bg.style.backgroundSize=(d.coverZoom||100)+'% auto'; bg.style.backgroundPosition='50% '+(d.coverPos==null?50:d.coverPos)+'%'; } save(); return; }
  }
  function onChange(e){
    var t=e.target;
    if(t.getAttribute && t.getAttribute('data-addlang')!=null){ var v=t.value; if(!v) return; var b=findBlock(t.getAttribute('data-addlang')); if(b){ var arr=b.langs||(b.lang?[b.lang]:[]); if(arr.indexOf(v)<0) arr.push(v); b.langs=arr; b.lang=arr[0]; b.savedAt=nowClock(); b.backups=(b.backups||0)+1; save(); render(); } }
  }
  function onKeyDown(e){
    // block-level editing keys
    var t=e.target;
    if(t.getAttribute && t.getAttribute('data-edit')!=null){
      var id=t.getAttribute('data-bid');
      if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); if(state.slash) return; addBlock(id); return; }
      if(e.key==='Backspace' && (t.textContent||'')===''){ e.preventDefault(); removeBlock(id); return; }
      if(e.key==='Tab'){ e.preventDefault(); indentBlock(id, e.shiftKey?-1:1); return; }
      if(e.key==='Escape' && state.slash){ state.slash=null; render(); return; }
    }
    if(t.getAttribute && t.getAttribute('data-title')!=null && e.key==='Enter'){ e.preventDefault(); var d=activeDoc(); if(d.blocks[0]){ var el=E.querySelector('[data-edit][data-bid="'+d.blocks[0].id+'"]'); if(el) el.focus(); } return; }
  }
  function onGlobalKey(e){
    if((e.ctrlKey||e.metaKey) && (e.key==='s'||e.key==='S')){ e.preventDefault(); saveNow(); return; }
    if((e.ctrlKey||e.metaKey) && (e.key==='k'||e.key==='K')){ e.preventDefault(); state.palette=!state.palette; state.paletteQ=''; render(); if(state.palette){ var pi=E.getElementById('palInput'); if(pi) pi.focus(); } return; }
    if(e.key==='Escape'){ if(state.palette){ state.palette=false; render(); } else if(state.present){ state.present=false; render(); } else if(state.slash){ state.slash=null; render(); } return; }
    if(state.present){ if(e.key==='ArrowRight'||e.key===' '){ e.preventDefault(); slideNav('next'); } else if(e.key==='ArrowLeft'){ e.preventDefault(); slideNav('prev'); } return; }
    if(state.palette && e.key==='Enter'){ var first=E.querySelector('[data-cmd]'); if(first){ runCmd(first.getAttribute('data-cmd')); } }
  }

  /* ---------- partial renders (avoid full re-render for search/palette typing) ---------- */
  function renderSidebarOnly(){
    var aside=E.querySelector('aside'); if(!aside) return;
    var focus=E.activeElement; var wasSearch=focus && focus.id==='searchbox'; var caret=wasSearch?focus.selectionStart:null;
    var tmp=E.createElement('div'); tmp.innerHTML=sidebarHTML(); if(tmp.firstChild) aside.replaceWith(tmp.firstChild);
    if(wasSearch){ var s=E.getElementById('searchbox'); if(s){ s.focus(); try{ s.setSelectionRange(caret,caret); }catch(e){} } }
  }
  function renderPaletteOnly(){
    var wrap=E.getElementById('paletteWrap'); if(!wrap) return;
    var focus=E.activeElement; var caret=focus&&focus.id==='palInput'?focus.selectionStart:null;
    var tmp=E.createElement('div'); tmp.innerHTML=paletteHTML(); if(tmp.firstChild) wrap.replaceWith(tmp.firstChild);
    var pi=E.getElementById('palInput'); if(pi){ pi.focus(); if(caret!=null){ try{ pi.setSelectionRange(caret,caret); }catch(e){} } }
  }

  /* ---------- drag & drop ---------- */
  function onDragStart(e){ var g=e.target.closest && e.target.closest('[data-grip]'); if(!g){ e.preventDefault(); return; } dragBid=g.getAttribute('data-grip'); e.dataTransfer.effectAllowed='move'; try{ e.dataTransfer.setData('text/plain',dragBid); }catch(_){} }
  function onDragOver(e){ if(!dragBid) return; var row=e.target.closest && e.target.closest('.blk'); if(!row) return; e.preventDefault(); clearDrop(); var r=row.getBoundingClientRect(); var below=(e.clientY> r.top+r.height/2); row.classList.add(below?'drop-below':'drop-above'); }
  function onDrop(e){ if(!dragBid) return; var row=e.target.closest && e.target.closest('.blk'); clearDrop(); if(row){ var toId=row.getAttribute('data-bid'); var r=row.getBoundingClientRect(); var below=(e.clientY> r.top+r.height/2); if(toId!==dragBid) moveBlock(dragBid,toId,below); } dragBid=null; }
  function onDragEnd(){ clearDrop(); dragBid=null; }
  function clearDrop(){ var a=E.querySelectorAll('.drop-above,.drop-below'); a.forEach(function(x){ x.classList.remove('drop-above','drop-below'); }); }

  /* ---------- boot ---------- */
  function boot(){
    var loaded=load(); state.docs=loaded.docs; state.active=loaded.active||0;
    var app=E.getElementById('app');
    app.addEventListener('click', onClick);
    app.addEventListener('input', onInput, true);
    app.addEventListener('change', onChange);
    app.addEventListener('keydown', onKeyDown, true);
    app.addEventListener('dragstart', onDragStart);
    app.addEventListener('dragover', onDragOver);
    app.addEventListener('drop', onDrop);
    app.addEventListener('dragend', onDragEnd);
    window.addEventListener('keydown', onGlobalKey);
    render(); renderBanner();
    // persist on unload as a safety net
    window.addEventListener('beforeunload', function(){ try{ persist(); }catch(e){} });
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
