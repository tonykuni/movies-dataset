<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VIA · Project Confirmation</title><link rel="stylesheet" href="project_confirm.css"></head>
<body>
<header><div><b>VERITAS WORKOPS</b><span>Workflow Optimization × Smart Email Tracking</span></div><button id="reload">重新載入</button></header>
<main>
<section class="summary"><div><strong id="nAll">0</strong><span>待確認</span></div><div><strong id="nStrong">0</strong><span>高信心候選</span></div><div><strong id="nNew">0</strong><span>新專案/不確定</span></div></section>
<section class="intro"><h2>專案歸戶確認</h2><p>系統只提出候選，不自行更改歸屬。點選一個專案，或建立新專案；編號由系統固定產生，名稱由使用者決定。</p></section>
<section id="cards" class="cards"></section>
</main>
<dialog id="newDialog"><form method="dialog"><h3>建立新專案</h3><label>專案名稱<input id="newName" required placeholder="例如：India PSU Transfer"></label><menu><button value="cancel">取消</button><button id="createBtn" value="default">確認建立</button></menu></form></dialog>
<script src="project_confirm.js"></script></body></html>
