<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VIA Template Center</title><link rel="stylesheet" href="template_center.css"></head>
<body>
<header><div><b>VERITAS WORKOPS</b><span>Template Center · 繁中 / 简中 / English</span></div></header>
<main>
<section class="bar">
  <label>Language
    <select id="language"><option value="zh-TW">繁體中文</option><option value="zh-CN">简体中文</option><option value="en">English</option></select>
  </label>
  <label>Template
    <select id="template"></select>
  </label>
  <button id="build">產生追蹤包 / Build Pack</button>
</section>
<section class="grid">
  <article class="panel"><h2 id="tplName">Template</h2><div id="preview"></div></article>
  <article class="panel"><h2>執行原則</h2>
    <ul><li>所有範本可並存，不覆蓋。</li><li>每個 Project 可有預設語言與預設範本。</li><li>每次執行可臨時切換。</li><li>寄出、升級、結案仍需人工確認。</li></ul>
    <pre id="cmd"></pre>
  </article>
</section>
</main><script src="template_center.js"></script></body></html>
