<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIA WorkOps Follow-up</title><link rel="stylesheet" href="styles.css"></head><body>
<header><div><small>VERITAS INTELLIGENCE ANALYTICS</small><h1>Workflow Optimization × Smart Email Tracking</h1><p>Mouse-first · exception-driven · evidence-linked</p></div><button id="refresh">重新整理</button></header>
<main><section id="summary" class="summary"></section><section class="panel"><div class="panel-head"><h2>Watchlist</h2><span>Level 4–5 與待結案項目</span></div><div id="watchlist" class="watchlist"></div></section><section class="panel"><div class="panel-head"><h2>Project Cards</h2><span>四欄總覽 · 點卡片看詳情</span></div><div id="cards" class="cards"></div></section></main>
