<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VIA Project Cockpit</title><link rel="stylesheet" href="project_cockpit.css"></head><body>
<header><div><b>VERITAS WORKOPS</b><span>Project Management Cockpit · Smart Email Tracking</span></div>
<div><button data-lang="zh-TW">繁中</button><button data-lang="zh-CN">简中</button><button data-lang="en">EN</button></div></header>
<main>
<section class="metrics">
<div><b id="mActive">0</b><span id="lActive">進行中專案</span></div>
<div><b id="mWarn">0</b><span id="lWarn">警示</span></div>
<div><b id="mCritical">0</b><span id="lCritical">重大</span></div>
<div><b id="mFollow">0</b><span id="lFollow">追蹤已備妥</span></div>
<div><b id="mMeeting">0</b><span id="lMeeting">會議未準備</span></div>
</section>
<section class="toolbar"><input id="search" placeholder="Search project / ID"><select id="filter"><option value="ALL">All</option><option value="4">Level 4</option><option value="5">Level 5</option><option value="FOLLOWUP">Follow-up Ready</option></select></section>
<section id="cards" class="cards"></section>
<section id="detail" class="detail hidden"></section>
</main><script src="project_cockpit.js"></script></body></html>
