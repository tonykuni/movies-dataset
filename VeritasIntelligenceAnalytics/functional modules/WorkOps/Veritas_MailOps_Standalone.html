<!DOCTYPE html>

<head>

<title>Veritas Mail-Ops · Unified Engine (Standalone)</title>
<style>
  :root{
    --bg:#020617; --panel:#040C1A; --panel2:#050B14; --card:#0f172a;
    --line:#1e293b; --line2:#334155;
    --ink:#f1f5f9; --mut:#94a3b8; --mut2:#64748b;
    --em:#10b981; --em2:#34d399; --emdim:rgba(16,185,129,.12);
    --blue:#60a5fa; --red:#f87171; --amber:#fbbf24;
    --sans:'Segoe UI','PingFang TC','Microsoft JhengHei','Noto Sans TC',system-ui,-apple-system,sans-serif;
    --mono:'Cascadia Code','Consolas','SFMono-Regular',ui-monospace,'DejaVu Sans Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;-webkit-font-smoothing:antialiased;overflow:hidden}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input{font-family:inherit}
  .mono{font-family:var(--mono)}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#1c2740;border-radius:6px}
  ::-webkit-scrollbar-track{background:transparent}
  svg{display:block}
  .fadein{animation:fadein .25s ease}
  @keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .pulse{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  .grid-bg{background-image:linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);background-size:32px 32px}
  /* print: only the deck's slides, one page each */
  #deckprint{display:none}
  @media print{
    @page{size:A4 landscape;margin:0}
    body>#app{display:none !important}
    #deckprint{display:block !important}
    .pslide{width:100%;min-height:100vh;page-break-after:always;box-sizing:border-box}
  }
</style>
</head>

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

  /* ============================= THE ENGINE ============================= */
  function VeritasDataEngine(restored){
    this.vault = new Map();
    this.ledger = [];
    this.tasks = { todo:[], doing:[], done:[] };
    this._seq = 1000;
    if(restored){ this._restore(restored); } else { this._seed(); }
  }
  VeritasDataEngine.prototype._hash = function(str){
    var h=0; for(var i=0;i<str.length;i++){ h=((h<<5)-h)+str.charCodeAt(i); h|=0; }
    return Math.abs(h).toString(16).slice(0,6).toUpperCase();
  };
  VeritasDataEngine.prototype._nlp = function(text){
    var U = text.toUpperCase();
    var intent='GEN', tag='INFO_REVIEW', tasks=[], project='未分類專案';
    if(/缺料|變更|急件|修改|干涉|異常/.test(text)){ intent='ECO'; tag='ACTION_REQUIRED'; }
    else if(/核准|APPROVED|已核准/.test(text)){ intent='APR'; tag='STATUS_UPDATE'; }
    var pm = text.match(/(MP-\d{3}|PO-\d{6}-\d{3}|Q\d\s*稽核)/i);
    if(pm) project = pm[0]+' 專案';
    if(tag==='ACTION_REQUIRED'){
      text.split(/[，。！\n]/).forEach(function(s){
        if(/改用|加上|發行|發布|修改|處理/.test(s)){
          var m = s.replace(/請|必須|務必/g,'').trim();
          if(m.length>2){
            tasks.push({
              id:'xt-'+this._hash(s),
              desc:m,
              assignee: /TONY/.test(U) ? 'Tony' : 'RD Team',
              deadline: (text.match(/\d{4}\/\d{2}\/\d{2}/)||['ASAP'])[0]
            });
          }
        }
      }.bind(this));
    }
    return { intent:intent, tag:tag, project:project, tasks:tasks };
  };
  VeritasDataEngine.prototype.ingest = function(raw){
    var nlp = this._nlp((raw.body||'')+' '+(raw.subject||''));
    var sysId = nlp.intent+'-M-2608-'+this._hash(raw.body||raw.subject||'');
    if(this.vault.has(sysId)){ this._log('WARN','DUPLICATE_REJECTED','拒絕重複收容: '+sysId); return null; }
    var asset = {
      id:sysId, sender:raw.sender, subject:raw.subject,
      snippet:(raw.body||'').slice(0,60)+'…', fullBody:raw.body||'',
      time: raw.time || this._clock(), isUnread:true,
      aiTag:nlp.tag, project:nlp.project, extractedTasks:nlp.tasks
    };
    this.vault.set(sysId, asset);
    this._log('SUCCESS','ASSET_MINTED','成功鑄造資產: '+sysId+' ('+nlp.intent+')');
    return asset;
  };
  VeritasDataEngine.prototype._log = function(type,event,desc){
    this.ledger.unshift({ id:'SEQ-'+(this._seq++), time:this._clockS(), type:type, event:event, desc:desc });
  };
  VeritasDataEngine.prototype.addTask = function(desc,project,deadline,sourceId){
    var t = { id:'tk-'+this._hash(desc+this.ledger.length), title:desc, project:project, due:deadline, source:sourceId };
    this.tasks.todo.push(t);
    this._log('INFO','TASK_CREATED','從 '+sourceId+' 萃取並建立任務: '+t.id);
    return t;
  };
  VeritasDataEngine.prototype.moveTask = function(id, to){
    var cols=['todo','doing','done'], found=null;
    cols.forEach(function(c){ var i=this.tasks[c].findIndex(function(t){return t.id===id;}); if(i>=0){ found=this.tasks[c].splice(i,1)[0]; } }.bind(this));
    if(found){ this.tasks[to].push(found); this._log('INFO','TASK_MOVED','任務 '+id+' → '+to.toUpperCase()); }
  };
  VeritasDataEngine.prototype.getInbox = function(){ return Array.from(this.vault.values()).reverse(); };
  VeritasDataEngine.prototype._clock = function(){ var d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
  VeritasDataEngine.prototype._clockS = function(){ var d=new Date(); return this._clock()+':'+String(d.getSeconds()).padStart(2,'0'); };
  VeritasDataEngine.prototype.serialize = function(){
    return JSON.stringify({ vault:Array.from(this.vault.values()), ledger:this.ledger, tasks:this.tasks, seq:this._seq });
  };
  VeritasDataEngine.prototype._restore = function(o){
    (o.vault||[]).forEach(function(a){ this.vault.set(a.id, a); }.bind(this));
    this.ledger = o.ledger||[]; this.tasks = o.tasks||{todo:[],doing:[],done:[]}; this._seq = o.seq||1000;
  };
  VeritasDataEngine.prototype._seed = function(){

      body:'Tony，陳總監指示，MP-001 主機板的 MCU 目前嚴重缺料。請即刻改用備用的 IC-MCU-101，並務必於 2026/08/05 前發行 ECO 變更單。急件！'});
    this.tasks.doing.push({ id:'tk-old1', title:'將 PO 單發送給供應商', project:'PO-202608-088', due:'08/03', source:'APR-M-2608-D41A' });
    this.tasks.done.push({ id:'tk-old2', title:'確認 DVT 測試環境', project:'MP-001 專案', due:'08/01', source:'系統建立' });

  /* ---------------- 範本庫 template library (config; persisted) ---------------- */
  var TPL_LS = 'via_mailops_templates_v1';
  var CHOICE_FORM = '<table role="presentation" cellpadding="0" cellspacing="0" style="border-collapse:collapse;margin:14px 0;width:100%;max-width:560px;"><tr><td style="background:#1e293b;color:#fff;font:700 13px \'Segoe UI\',sans-serif;padding:8px 14px;border-radius:6px 6px 0 0;">請圈選或保留適用項後直接回覆(選項為主,幾乎免打字)</td></tr><tr><td style="border:1px solid #e2e8f0;border-top:none;padding:12px 16px;font:400 13px \'Segoe UI\',sans-serif;color:#1e293b;line-height:2.1;">1. 目前狀態： ○ 進行中　○ 已完成　○ 卡關<br/>2. 完成百分比： ○ 25%　○ 50%　○ 75%　○ 100%<br/>3. 預計完成 ETA： ○ 今日　○ 明日　○ 本週　○ 其他：__________<br/>4. 是否有阻礙 / 風險： ○ 無　○ 有：__________<br/>5. 是否需要我協助： ○ 否　○ 是：__________</td></tr></table>';
  function seedTemplates(){
    var wrap=function(subj,lead,extra){ return '<div style="font:400 13px/1.6 \'Segoe UI\',\'Microsoft JhengHei\',sans-serif;color:#1e293b;"><p>Hi {{ProjectName}} 窗口,</p><p>'+lead+'</p>'+(extra||'')+CHOICE_FORM+'<p style="color:#64748b;font-size:12px;">若已於電話/會議說明,也請於上方簡短補一句以便留存。謝謝!</p><p>Best regards,<br/>{{MyName}}</p><p style="color:#94a3b8;font-size:11px;font-family:Consolas,monospace;">追蹤案號 {{ProjectCode}} · {{Date}}</p></div>'; };
    return [
      { id:'t_status', key:'status_request', name:'進度確認', cat:'追蹤', subject:'[追蹤] {{ProjectCode}} {{ProjectName}} - 進度確認', body:wrap('','想跟你確認 <b>{{ProjectName}}</b>({{ProjectCode}})目前的進度。','') },
      { id:'t_eta', key:'eta_confirm', name:'交期確認', cat:'追蹤', subject:'[追蹤] {{ProjectCode}} {{ProjectName}} - 交期確認', body:wrap('','想再次確認 <b>{{ProjectName}}</b>({{ProjectCode}})的<b>預計完成/交期</b>是否仍如原訂。','<p style="color:#c0392b;">如需調整,請於第 3 點圈選或填新日期並簡述原因。</p>') },

    ];
  }

  function detectVars(t){ var s=(t.subject||'')+' '+(t.body||''); var m, set={}, re=/\{\{\s*([A-Za-z0-9_]+)\s*\}\}/g; while((m=re.exec(s))) set[m[1]]=1; return Object.keys(set); }

  /* ---------------- 🔍 專案登錄庫 project registry (localStorage 狀態紀錄) ---------------- */
  var REG_LS = 'via_mailops_projreg_v1';
  function regLoad(){ try{ var r=localStorage.getItem(REG_LS); if(r){ var d=JSON.parse(r); if(d&&d.length!==undefined) return d; } }catch(e){} return []; }
  function regSave(){ try{ localStorage.setItem(REG_LS, JSON.stringify(registry)); }catch(e){} }
  var registry = regLoad();

  /* ---------------- 🏷 關鍵字詞庫 lexicon (reviewed keyword dictionary, persisted) ---------------- */
  var LEX_LS = 'via_mailops_lexicon_v1';
  function lexLoad(){ try{ var r=localStorage.getItem(LEX_LS); if(r){ var d=JSON.parse(r); if(d&&d.length!==undefined) return d; } }catch(e){} return []; }
  function lexSave(){ try{ localStorage.setItem(LEX_LS, JSON.stringify(lexicon)); }catch(e){} }
  var lexicon = lexLoad();
  var LEX_CATS = ['專案','人名/對口','公司/單位','產品/系統','地區','財務/金額','其他'];
  function lexTerms(){ var t=[]; lexicon.forEach(function(x){ if(x.status==='accept'){ t.push(x.canonical); (x.aliases||[]).forEach(function(a){ if(a) t.push(a); }); } }); return t; }
  function lexFind(term){ var lo=(''+term).toLowerCase(); for(var i=0;i<lexicon.length;i++){ var x=lexicon[i]; if(x.status!=='accept') continue; if((''+x.canonical).toLowerCase()===lo) return x; if((x.aliases||[]).some(function(a){return (''+a).toLowerCase()===lo;})) return x; } return null; }
  var SAMPLE_VARS={ ProjectCode:'PRJ-001', ProjectName:'日本合資案', MyName:'你的名字', Date:'2026/08/07' };
  function fillVars(str){ return (str||'').replace(/\{\{\s*([A-Za-z0-9_]+)\s*\}\}/g, function(_,k){ return SAMPLE_VARS[k]!=null?SAMPLE_VARS[k]:'〈'+k+'〉'; }); }
  function persist(){ try{ localStorage.setItem(LS, engine.serialize()); }catch(e){} }
  function boot(){
    var restored=null;
    try{ var raw=localStorage.getItem(LS); if(raw) restored=JSON.parse(raw); }catch(e){}
    engine = new VeritasDataEngine(restored);
    var inbox = engine.getInbox();
    state.selected = inbox.length ? inbox[0].id : null;
    render();
  }

        '<span style="font-weight:800;letter-spacing:2px;text-transform:uppercase;font-size:13px">Veritas <span class="mono" style="font-size:9px;color:var(--em);background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.35);border-radius:5px;padding:2px 7px;margin-left:6px;letter-spacing:1px">Unified Engine</span></span>'+

        '<button data-act="reset" class="mono" title="清除本機資料重來" style="display:flex;align-items:center;gap:5px;font-size:10px;background:#1a1020;color:#e0899b;padding:7px 12px;border-radius:9px;border:1px solid #3a2230">'+IC.trash({s:13})+'</button>'+

      navBtn('inbox', IC.inbox({s:19}), '智能收件匣', unread)+

      navBtn('cards', IC.grid({s:19}), '專案卡總覽 · 燈號/下一步/倒數', (loaded.control.length+registry.length))+
      navBtn('reconcile', IC.scale({s:19}), '對帳校準 · 控管表×郵件→建議', (loaded.control.length?loaded.control.length:0))+
      navBtn('discover', IC.search({s:19}), '專案發掘 · 關鍵字→成案編號', registry.length)+

  function main(){
    var inner = state.nav==='today' ? todayView()
              : state.nav==='inbox' ? inboxView()
              : state.nav==='board' ? boardView()
              : state.nav==='ledger' ? ledgerView()

  function tagBadge(tag){
    var map = {
      ACTION_REQUIRED:['需採取行動','var(--red)','rgba(248,113,113,.12)','rgba(248,113,113,.3)'],
      STATUS_UPDATE:['狀態更新','var(--blue)','rgba(96,165,250,.12)','rgba(96,165,250,.3)'],
      INFO_REVIEW:['僅供參考','var(--em2)','rgba(16,185,129,.12)','rgba(16,185,129,.3)']
    };
    var m = map[tag]||map.INFO_REVIEW;
    return '<span class="mono" style="font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:2px 7px;border-radius:5px;color:'+m[1]+';background:'+m[2]+';border:1px solid '+m[3]+'">'+m[0]+'</span>';
  }

  function inboxView(){
    var mails = engine.getInbox();
    var q = state.query.toLowerCase();
    var shown = mails.filter(function(m){ return !q || (m.subject+m.sender+m.fullBody+m.id+m.project).toLowerCase().indexOf(q)>=0; });
    var sel = mails.filter(function(m){return m.id===state.selected;})[0] || shown[0] || null;

    var list = shown.map(function(m){
      var active = sel && m.id===sel.id;
      return '<div data-open="'+m.id+'" style="padding:13px 15px;border-bottom:1px solid rgba(30,41,59,.5);cursor:pointer;border-left:2px solid '+(active?'var(--em)':'transparent')+';'+(active?'background:rgba(30,41,59,.55)':'')+'">'+
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px"><span style="font-size:12px;font-weight:600;color:'+(m.isUnread?'#fff':'var(--mut)')+'">'+esc(m.sender)+'</span><span class="mono" style="font-size:10px;color:var(--mut2)">'+esc(m.time)+'</span></div>'+
        '<div style="font-size:13px;margin-bottom:3px;color:'+(m.isUnread?'#d1fae5':'var(--mut)')+';font-weight:'+(m.isUnread?'600':'400')+';white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(m.subject)+'</div>'+
        '<div style="font-size:11px;color:var(--mut2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:7px">'+esc(m.snippet)+'</div>'+
        '<div style="display:flex;align-items:center;gap:7px">'+tagBadge(m.aiTag)+
          '<span class="mono" style="font-size:9px;color:var(--mut2);background:#08111f;border:1px solid var(--line);border-radius:4px;padding:1px 6px;display:inline-flex;align-items:center;gap:3px">'+IC.db({s:10})+esc(m.id.split('-')[2])+'</span>'+
          '<span class="mono" style="font-size:9px;color:var(--mut2)">'+esc(m.project)+'</span>'+
        '</div>'+
      '</div>';
    }).join('') || '<div style="padding:30px;text-align:center;color:var(--mut2);font-size:12px">無相符信件</div>';

    var reader = sel ? readerPane(sel) : '<div style="flex:1;display:flex;align-items:center;justify-content:center;color:var(--mut2)" class="mono">選擇一封信件進行解析</div>';

    return '<div class="fadein" style="display:flex;flex:1;overflow:hidden;position:relative;z-index:10">'+
      '<div style="width:360px;flex:none;border-right:1px solid var(--line);background:var(--panel2);display:flex;flex-direction:column">'+
        '<div style="padding:14px;border-bottom:1px solid var(--line)">'+
          '<div style="display:flex;align-items:center;gap:8px;margin-bottom:11px;font-size:13px;font-weight:600;color:#fff">AI Triage Inbox <span class="mono" style="font-size:9px;color:var(--em2);background:rgba(16,185,129,.14);border:1px solid rgba(16,185,129,.3);border-radius:20px;padding:2px 8px">L0 Filter</span></div>'+
          '<div style="position:relative"><span style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--mut2)">'+IC.search({s:14})+'</span>'+
          '<input id="q" value="'+esc(state.query)+'" placeholder="搜尋意圖、任務或 ID…" style="width:100%;background:var(--bg);border:1px solid rgba(51,65,85,.5);border-radius:9px;padding:8px 10px 8px 32px;font-size:12px;color:var(--ink);outline:none"></div>'+
        '</div>'+
        '<div style="flex:1;overflow-y:auto">'+list+'</div>'+
      '</div>'+
      '<div style="flex:1;overflow-y:auto">'+reader+'</div>'+
    '</div>';
  }

  function readerPane(m){
    var tasks = m.extractedTasks.length ? m.extractedTasks.map(function(t){
      var urgent = t.deadline==='ASAP' || /08\/0[56]|2026\/08\/0[56]/.test(t.deadline);
      return '<div style="background:rgba(2,6,23,.8);border:1px solid var(--line);border-radius:12px;padding:11px 13px;display:flex;align-items:center;justify-content:space-between;gap:12px">'+
        '<div style="display:flex;align-items:center;gap:11px;min-width:0"><div style="width:15px;height:15px;border-radius:4px;border:1px solid var(--line2);flex:none"></div><span style="font-size:13px;color:#e2e8f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(t.desc)+'</span></div>'+
        '<div style="display:flex;align-items:center;gap:12px;flex:none">'+
          '<span class="mono" style="display:flex;align-items:center;gap:4px;font-size:11px;color:var(--mut)">'+IC.user({s:13})+esc(t.assignee)+'</span>'+
          '<span class="mono" style="display:flex;align-items:center;gap:4px;font-size:10px;color:'+(urgent?'var(--red)':'var(--mut)')+';background:'+(urgent?'rgba(248,113,113,.12)':'rgba(30,41,59,.6)')+';border:1px solid '+(urgent?'rgba(248,113,113,.3)':'transparent')+';padding:3px 7px;border-radius:5px">'+IC.clock({s:12})+esc(t.deadline)+'</span>'+
          '<button data-addtask="'+esc(m.id)+'|'+esc(t.desc)+'|'+esc(t.deadline)+'" style="font-size:12px;background:rgba(16,185,129,.9);color:#fff;padding:6px 12px;border-radius:9px;font-weight:600;box-shadow:0 0 10px rgba(16,185,129,.2)">加入看板</button>'+
        '</div>'+
      '</div>';
    }).join('<div style="height:8px"></div>')
      : '<div class="mono" style="font-size:12px;color:var(--mut2);font-style:italic;padding:16px;text-align:center;border:1px dashed rgba(51,65,85,.5);border-radius:10px">無偵測到具體行動事項 (No Action Items detected)</div>';

    return '<div class="fadein" style="max-width:820px;margin:0 auto;padding:30px;display:flex;flex-direction:column;gap:22px">'+
      '<div><h1 style="font-size:22px;font-weight:600;color:#fff;margin-bottom:8px">'+esc(m.subject)+'</h1>'+
        '<div style="display:flex;align-items:center;gap:11px;font-size:12px;color:var(--mut)"><span style="color:#cbd5e1;font-weight:500">'+esc(m.sender)+'</span><span>•</span><span>'+esc(m.time)+'</span><span>•</span><span class="mono" style="font-size:11px;color:var(--mut2)">SYS_ID: '+esc(m.id)+'</span></div>'+
      '</div>'+
      '<div style="background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:20px"><div style="font-size:13px;color:#cbd5e1;white-space:pre-wrap;line-height:1.7">'+esc(m.fullBody)+'</div></div>'+
      '<div style="border:1px solid rgba(16,185,129,.28);background:linear-gradient(135deg,rgba(6,78,59,.18),rgba(15,23,42,.2));border-radius:16px;padding:20px;position:relative;overflow:hidden">'+
        '<div style="position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--em)"></div>'+
        '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:15px">'+
          '<div class="mono" style="display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;color:var(--em2);text-transform:uppercase;letter-spacing:1.5px">'+IC.zap({s:15})+' NLP Mail-to-Task Resolution</div>'+
          '<span class="mono" style="font-size:10px;background:#08111f;border:1px solid var(--line);color:var(--mut);padding:3px 8px;border-radius:5px">Context: '+esc(m.project)+'</span>'+
        '</div>'+tasks+
      '</div>'+
    '</div>';

  function boardView(){
    var cols = [['todo','TO DO (待處理)','var(--line2)'],['doing','IN PROGRESS (進行中)','#2563eb'],['done','DONE (已完成)','var(--em)']];
    var body = cols.map(function(c){ return column(c[0],c[1],c[2]); }).join('');

        '<h2 style="font-size:17px;font-weight:600;color:#fff;display:flex;align-items:center;gap:9px">'+IC.kanban({s:19})+' SSOT 專案看板</h2>'+

      '</div>'+
      '<div style="flex:1;overflow-x:auto;padding:26px 30px;display:flex;gap:22px">'+body+'</div>'+
    '</div>';

  function column(key,title,color){
    var tasks = engine.tasks[key];
    var cards = tasks.map(function(t){
      var urgent = t.due==='ASAP' || /08\/0[56]/.test(t.due);
      var prev = key==='todo'?'':key==='doing'?'todo':'doing';
      var next = key==='done'?'':key==='todo'?'doing':'done';
      return '<div style="background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px;position:relative;overflow:hidden">'+
        '<div style="position:absolute;top:0;left:0;bottom:0;width:3px;background:'+color+'"></div>'+
        '<div class="mono" style="font-size:9px;color:var(--mut2);margin-bottom:7px">'+esc(t.project)+'</div>'+
        '<div style="font-size:13px;color:#e2e8f0;font-weight:500;line-height:1.4;margin-bottom:12px">'+esc(t.title)+'</div>'+
        '<div style="display:flex;align-items:center;justify-content:space-between;gap:6px">'+
          '<span class="mono" style="font-size:9px;color:var(--mut);background:#08111f;border:1px solid var(--line);border-radius:4px;padding:2px 6px;display:inline-flex;align-items:center;gap:3px;max-width:120px;overflow:hidden">'+IC.db({s:10})+esc(String(t.source).split('-').pop())+'</span>'+
          '<span class="mono" style="font-size:10px;padding:2px 7px;border-radius:5px;color:'+(urgent?'var(--red)':'var(--mut)')+';background:'+(urgent?'rgba(248,113,113,.12)':'rgba(30,41,59,.6)')+';border:1px solid '+(urgent?'rgba(248,113,113,.3)':'transparent')+'">'+esc(t.due)+'</span>'+
        '</div>'+
        '<div style="display:flex;gap:6px;margin-top:10px">'+
          (prev?'<button data-move="'+t.id+'|'+prev+'" class="mono" style="flex:1;font-size:10px;color:var(--mut);background:#0d1626;border:1px solid var(--line);border-radius:6px;padding:4px">← '+prev.toUpperCase()+'</button>':'')+
          (next?'<button data-move="'+t.id+'|'+next+'" class="mono" style="flex:1;font-size:10px;color:var(--em2);background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.25);border-radius:6px;padding:4px">'+next.toUpperCase()+' →</button>':'')+
        '</div>'+
      '</div>';
    }).join('<div style="height:12px"></div>') || '<div class="mono" style="border:2px dashed var(--line);border-radius:12px;height:96px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--mut2)">Empty Dropzone</div>';
    return '<div style="width:300px;flex:none;display:flex;flex-direction:column">'+
      '<div class="mono" style="font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;border-top:2px solid '+color+';padding-top:11px">'+
        '<span>'+esc(title)+'</span><span style="background:#0f1e34;color:#cbd5e1;padding:1px 8px;border-radius:10px;font-size:10px">'+tasks.length+'</span></div>'+
      '<div>'+cards+'</div>'+
    '</div>';
  }

      '<div style="background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:24px;position:relative">'+

        '<div style="position:relative">'+rows+'</div>'+
      '</div>'+
    '</div></div>';
  }

    var head = '<div style="height:60px;flex:none;border-bottom:1px solid var(--line);padding:0 30px;display:flex;align-items:center;gap:14px;background:rgba(4,12,26,.5)">'+
      '<h2 style="font-size:17px;font-weight:600;color:#fff;display:flex;align-items:center;gap:9px">'+IC.folder({s:19})+' 本機匯出資料</h2>'+

  /* ---- transparent priority score + track list (their factor model, local) ---- */
  function scoreItem(x, isCase){
    var f=[], s=0, W=settings.w;
    var subj=((x.Subject||x.NormalizedSubject||'')+'');
    var cat=((x.ConfirmedCategory||x.SuggestedCategory||'')+'');
    var status=((x.WorkflowStatus||'')+'');
    function add(w,l){ s+=w; f.push(l); }
    if(/01_|需要我|need|action/i.test(cat) || /待我|需優先|需確認|待確認/.test(status)) add(W.action,'需我行動');
    if(isCase && (x.NeedsAttention===true||x.NeedsAttention==='True')) add(W.attention,'需注意');
    if(/急|urgent|asap|eod|今日|deadline|立即|immediately|盡快/i.test(subj)) add(W.urgent,'急件字');
    if(isCase ? ((x.UnreadCount||0)>0) : (x.Unread===true||x.Unread==='True')) add(W.unread,'未讀');
    if(/\[?(PRJ|PO|MP)[-_ ]?\d/i.test(subj)) add(W.code,'專案號');
    if(s>1) s=1;
    return { score:s, factors:f };
  }
  function extractCode(subj, fallback){
    var m=(subj||'').match(/\[?([A-Za-z]{2,4}[-_ ]?\d[\w-]*)\]?/);
    return m ? m[1].toUpperCase().replace(/\s/g,'-') : (fallback||'');
  }
  function computeTrackList(){
    // v004 pending-response is a ready-made, prioritized track list (with real addresses)
    if(loaded.pending.length){
      return loaded.pending.map(function(p,i){
        var subj=p.TITLE||p.CASE_ID||'(無主旨)';
        var pri=((p.PRIORITY||'')+'').toUpperCase();
        var score = pri==='P1'?0.9:pri==='P2'?0.7:pri==='P3'?0.4:0.5;
        // chase the counterparty: if we're waiting on our OUTBOUND mail, chase the recipient (TO);
        // if an INBOUND needs our reply, the counterparty is the sender.
        var to = ((p.LAST_DIRECTION||'')+'').toUpperCase()==='OUTBOUND' ? (firstAddr(p.TO)||p.FROM_ADDRESS||'') : (p.FROM_ADDRESS||firstAddr(p.TO)||p.FROM||'');
        var st=((p.PENDING_STATUS||'')+(p.NEXT_ACTION?(' · '+p.NEXT_ACTION):''));
        var tpl=/WAITING_EXTERNAL/.test(p.PENDING_STATUS||'')?'followup':/RSK|RISK|風險/.test((p.CATEGORY||'')+(p.PENDING_STATUS||''))?'blocker_check':'status_request';
        return { id:p.CASE_ID||('p'+i), subject:subj, code:extractCode(subj,p.CASE_ID), name:subj, to:to, template:tpl, status:st, score:score, factors:[pri||'v004'] };
      }).sort(function(a,b){ return b.score-a.score; });
    }
    var useCases = loaded.cases.length>0;
    var src = useCases ? loaded.cases : loaded.mails;
    var list = src.map(function(x,i){
      var sc = scoreItem(x, useCases);
      var subj = x.Subject||x.NormalizedSubject||'(無主旨)';
      var id = x.GroupID||x.MailID||('row'+i);
      var status = x.WorkflowStatus||x.ConfirmedCategory||x.SuggestedCategory||'';
      // best-effort recipient: case participants (Wizard) or mail sender; may be blank
      var to='';
      if(useCases && x.Participants && x.Participants.length) to=x.Participants[0];
      else if(!useCases && x.SenderEmail) to=x.SenderEmail;
      var tpl = /等待對方|等待/.test(status) ? 'eta_confirm' : /風險|阻礙|blocker/.test(status) ? 'blocker_check' : 'status_request';
      return { id:id, subject:subj, code:extractCode(subj,id), name:subj, to:to, template:tpl, status:status, score:sc.score, factors:sc.factors };
    });
    list.sort(function(a,b){ return b.score-a.score; });
    return list;
  }

  /* ---------------- ⚖ 對帳校準 Reconcile (control sheet governs · email informs · you approve) ---------------- */
  function recParseDate(v){
    if(!v) return null;
    var s=(''+v).trim(); if(!s) return null;
    var m=s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})(?:[ T](\d{1,2}):(\d{2}))?/);
    if(m){ return new Date(+m[1], +m[2]-1, +m[3], +(m[4]||0), +(m[5]||0)); }
    var d=new Date(s); return isNaN(d.getTime())?null:d;
  }
  function recFmt(d){ if(!d) return ''; return d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0'); }
  function recGet(row, keys){ for(var i=0;i<keys.length;i++){ var k=keys[i]; if(row[k]!==undefined && (''+row[k]).trim()!=='') return (''+row[k]).trim(); } return ''; }
  function recSubjHit(subj, code, name){ subj=subj||''; return (code && subj.indexOf(code)>=0) || (name && subj.indexOf(name)>=0); }
  function recWaitDays(p){
    var n=recGet(p,['WaitingDays','DAYS_WAITING','PENDING_DAYS','WAIT_DAYS','days']);
    if(n && !isNaN(+n)) return Math.round(+n);
    var d=recParseDate(recGet(p,['SentOn','LAST_OUTBOUND','LAST_DIRECTION_DATE','LastDate','SENT_ON']));
    if(d){ return Math.max(0, Math.round((Date.now()-d.getTime())/86400000)); }
    return 0;
  }
  function recMatch(code, name){
    var count=0, lastDate=null, lastDir='', waiting=null;
    loaded.mails.forEach(function(m){
      if(recSubjHit(m.Subject, code, name)){
        count++;
        var d=recParseDate(m.EventDate);
        if(d && (!lastDate || d>lastDate)){ lastDate=d; lastDir=(m.Direction||'').toUpperCase(); }
      }
    });
    loaded.pending.forEach(function(p){
      var subj=recGet(p,['Subject','TITLE','NORMALIZED_TITLE','SUBJECT']);
      if(recSubjHit(subj, code, name)){
        var wd=recWaitDays(p);
        if(waiting===null || wd>waiting) waiting=wd;
        var d=recParseDate(recGet(p,['SentOn','LAST_OUTBOUND','LastDate']));
        if(d){ if(!lastDate || d>lastDate){ lastDate=d; lastDir='OUTBOUND'; } }
        else if(!lastDate){ lastDir='OUTBOUND'; }  // outbound-waiting item with no explicit date
      }
    });
    return { count:count+(waiting!==null?1:0), lastDate:lastDate, lastDir:lastDir, waiting:waiting, has:(count>0||waiting!==null) };
  }
  var REC_BADGE = {
    'Verified':      {t:'一致',   c:'#10b981', bg:'rgba(16,185,129,.14)', bd:'rgba(16,185,129,.4)'},
    'Stale':         {t:'控管表過期', c:'#f59e0b', bg:'rgba(245,158,11,.14)', bd:'rgba(245,158,11,.4)'},
    'Pending Review':{t:'待覆核', c:'#60a5fa', bg:'rgba(96,165,250,.14)', bd:'rgba(96,165,250,.4)'},
    'Conflicted':    {t:'需人工判讀', c:'#f87171', bg:'rgba(248,113,113,.14)', bd:'rgba(248,113,113,.4)'},
    'Unmatched':     {t:'無佐證', c:'#94a3b8', bg:'rgba(148,163,184,.12)', bd:'rgba(148,163,184,.35)'},
    'Incomplete':    {t:'資料不全', c:'#c084fc', bg:'rgba(192,132,252,.14)', bd:'rgba(192,132,252,.4)'}
  };
  function recReconcileRow(c){
    var code=recGet(c,['Code','ProjectCode','專案代號','案號','代號']);
    var name=recGet(c,['Name','ProjectName','專案名稱','案名']);
    var owner=recGet(c,['Owner','負責人','窗口']);
    var status=recGet(c,['Status','狀態','進度狀態']);
    var updatedRaw=recGet(c,['Updated','LastUpdated','最後更新','更新日','更新日期']);
    var updated=recParseDate(updatedRaw);
    var m=recMatch(code, name);
    var doneWords=['已完成','完成','結案','closed','done','complete'];
    var isDone=false, sl=(status||'').toLowerCase();
    doneWords.forEach(function(w){ if(sl.indexOf(w.toLowerCase())>=0) isDone=true; });
    var conf='Verified', field='', proposed='', ev='';
    if(!code || !status){ conf='Incomplete'; ev='控管表缺少代號或狀態欄位'; }
    else if(!m.has){ conf='Unmatched'; ev='此期間郵件中查無此案佐證(代號/案名未出現)'; }
    else {
      var newer = (m.lastDate && ((updated && m.lastDate>updated) || !updated));
      var waiting = (m.waiting!==null && m.waiting>=3);
      if(isDone && newer){ conf='Conflicted'; field='Status'; proposed='請人工判讀(標記已完成,但仍有較新郵件往來)';
        ev='控管表狀態=已完成,但郵件最後活動 '+recFmt(m.lastDate)+' '+m.lastDir+' 晚於更新日 '+updatedRaw; }
      else if(waiting && m.lastDir==='OUTBOUND' && !isDone){ var st=tStage(m.waiting);
        conf='Pending Review'; field='Status'; proposed='建議追蹤('+st.label+' · 已寄出待回覆 '+m.waiting+' 天)';
        ev='最後一次為你寄出,已等待 '+m.waiting+' 天未見回覆;'+st.hint+',建議範本 '+st.tpl; }
      else if(newer){ conf='Stale'; field='LastUpdated'; proposed=recFmt(m.lastDate);
        ev='郵件最後活動 '+recFmt(m.lastDate)+'('+m.lastDir+')晚於控管表更新日 '+updatedRaw+';建議更新最後更新日'; }
      else { conf='Verified'; ev='郵件佐證與控管表一致(最後活動 '+recFmt(m.lastDate)+')'; }
    }
    return { id:'rec_'+(code||Math.random().toString(36).slice(2,7)), code:code, name:name, owner:owner,
      conf:conf, baseStatus:status, baseUpdated:updatedRaw, obsLast:recFmt(m.lastDate), obsDir:m.lastDir, obsMsgs:m.count,
      field:field, proposed:proposed, ev:ev };
  }

  /* ---------------- 🔍 專案發掘 Discover (email keywords → human-confirmed new projects) ---------------- */
  var discState = { names:{}, kw:{} };  // transient per-session edits, keyed by cluster subject
  var discCache = [];
  function discNormSubj(s){ return (''+(s||'')).replace(/^((re|fw|fwd|回覆|轉寄|答复)[::]\s*)+/i,'').replace(/\s+/g,' ').trim(); }
  function discKeywords(s){
    var seen={}, out=[];
    var add=function(x){ if(x && !seen[x]){ seen[x]=1; out.push(x); } };
    (s.match(/[A-Za-z]{2,6}[-_]?\d{2,6}/g)||[]).forEach(add);            // code-like tokens
    (s.match(/[一-鿿]{2,8}/g)||[]).forEach(add);                  // CJK runs
    (s.match(/[A-Za-z]{4,}/g)||[]).forEach(function(x){ add(x.toLowerCase()); });
    return out.slice(0,8);
  }
  function discCandidates(){
    var groups={};
    loaded.mails.forEach(function(m){
      var ns=discNormSubj(m.Subject); if(!ns) return;
      var hit=false;
      loaded.control.forEach(function(c){ if((c.Code&&ns.indexOf(c.Code)>=0)||(c.Name&&ns.indexOf(c.Name)>=0)) hit=true; });
      registry.forEach(function(r){
        if((r.code&&ns.indexOf(r.code)>=0)||(r.name&&ns.indexOf(r.name)>=0)) hit=true;
        (r.kws||[]).forEach(function(k){ if(k && ns.indexOf(k)>=0) hit=true; });   // confirmed keywords absorb their cluster
      });
      if(hit) return;
      if(!groups[ns]) groups[ns]={subj:ns,count:0,last:''};
      groups[ns].count++;
      var d=m.EventDate||''; if(d>groups[ns].last) groups[ns].last=d;
    });
    return Object.keys(groups).map(function(k){ var g=groups[k]; g.kws=discKeywords(g.subj); return g; })
      .sort(function(a,b){ return b.count-a.count || (b.last>a.last?1:-1); }).slice(0,40);
  }
  function nextProjCode(){
    var maxN=0, prefix='PRJ-';

    loaded.control.forEach(function(c){ scan(c.Code); });
    registry.forEach(function(r){ scan(r.code); });
    var num=String(maxN+1); while(num.length<3) num='0'+num;
    return prefix+num;
  }

  /* ---------------- 🃏 專案卡總覽 Project Cards (status light · next step · ball · countdown) ---------------- */
  function cardMatch(terms){
    var count=0, lastDate=null, lastDir='', waiting=null;
    var hit=function(subj){ subj=subj||''; for(var i=0;i<terms.length;i++){ if(terms[i] && subj.indexOf(terms[i])>=0) return true; } return false; };
    loaded.mails.forEach(function(m){
      if(hit(m.Subject)){ count++; var d=recParseDate(m.EventDate); if(d && (!lastDate||d>lastDate)){ lastDate=d; lastDir=(m.Direction||'').toUpperCase(); } }
    });
    loaded.pending.forEach(function(p){
      var subj=recGet(p,['Subject','TITLE','NORMALIZED_TITLE','SUBJECT']);
      if(hit(subj)){
        var wd=recWaitDays(p); if(waiting===null||wd>waiting) waiting=wd;
        var d=recParseDate(recGet(p,['SentOn','LAST_OUTBOUND','LastDate']));
        if(d){ if(!lastDate||d>lastDate){ lastDate=d; lastDir='OUTBOUND'; } } else if(!lastDate){ lastDir='OUTBOUND'; }
      }
    });
    return { count:count+(waiting!==null?1:0), lastDate:lastDate, lastDir:lastDir, waiting:waiting, has:(count>0||waiting!==null) };
  }
  function projCards(){
    var cards=[];
    loaded.control.forEach(function(c){ cards.push({ code:c.Code, name:c.Name, owner:c.Owner, status:c.Status, progress:c.Progress, due:c.Due, updated:c.Updated, next:c.Next, ball:c.Ball, terms:[c.Code,c.Name] }); });
    registry.forEach(function(r){ cards.push({ code:r.code, name:r.name, owner:'', status:'新案(待補)', progress:'', due:'', updated:r.at, next:'', ball:'', terms:[r.code,r.name].concat(r.kws||[]) }); });
    var now=new Date(); now.setHours(0,0,0,0);
    return cards.map(function(c){
      var ev=cardMatch(c.terms.filter(Boolean));
      var sl=(c.status||'').toLowerCase();
      var isDone=['已完成','完成','結案','closed','done','complete'].some(function(w){ return sl.indexOf(w.toLowerCase())>=0; });
      var isStuck=['卡關','blocked','暫停','hold'].some(function(w){ return sl.indexOf(w.toLowerCase())>=0; });
      var dueD=recParseDate(c.due);
      var daysLeft=dueD?Math.ceil((dueD.getTime()-now.getTime())/86400000):null;
      var updD=recParseDate(c.updated);
      var stale=(ev.lastDate && ((updD && ev.lastDate>updD) || !updD));
      var waiting=(ev.waiting!==null && ev.waiting>=3);
      var light, lightW;
      if(isDone){ light='done'; lightW=3; }
      else if(isStuck || (daysLeft!==null&&daysLeft<0) || (ev.waiting!==null&&ev.waiting>=5)){ light='red'; lightW=0; }
      else if(waiting || stale || (daysLeft!==null&&daysLeft<=2)){ light='yellow'; lightW=1; }
      else { light='green'; lightW=2; }
      var ball=c.ball, next=c.next;
      if(!ball){ ball = isDone?'—' : (ev.lastDir==='OUTBOUND'&&ev.waiting!==null)?'對方' : ev.lastDir==='INBOUND'?'你' : '你'; }
      if(!next){
        next = isDone?'結案歸檔'
          : isStuck?'排除阻礙(見備註)'
          : (ev.lastDir==='OUTBOUND'&&ev.waiting!==null)?'等對方回覆'+(ev.waiting>=3?'(可補追)':'')
          : ev.lastDir==='INBOUND'?'輪你回覆 / 更新控管表'
          : '主動確認近況';
      }
      var pg=parseInt((''+(c.progress||'')).replace(/[^\d]/g,''),10); if(isNaN(pg)) pg=null;
      return { code:c.code, name:c.name, owner:c.owner, status:c.status, light:light, lightW:lightW,
        next:next, ball:ball, daysLeft:daysLeft, due:c.due, progress:pg,
        waiting:ev.waiting, lastDate:recFmt(ev.lastDate), lastDir:ev.lastDir, msgs:ev.count };
    }).sort(function(a,b){ return a.lightW-b.lightW || (a.daysLeft===null?999:a.daysLeft)-(b.daysLeft===null?999:b.daysLeft); });
  }
  var CARD_LIGHT={ red:{c:'#f87171',t:'需介入'}, yellow:{c:'#fbbf24',t:'注意'}, green:{c:'#34d399',t:'正常'}, done:{c:'#64748b',t:'已完成'} };
  /* 三段追蹤分級:T1 一般追蹤(+3天) / T2 積極跟進(+5天) / T3 緊急升級(+7天,建議 CC 主管) */
  function tStage(days){
    if(days>=7) return {k:'T3',label:'T3 緊急升級',icon:'🔴',tpl:'followup_firm',c:'#f87171',bg:'rgba(248,113,113,.1)',bd:'rgba(248,113,113,.3)',hint:'建議 CC 主管'};
    if(days>=5) return {k:'T2',label:'T2 積極跟進',icon:'🟠',tpl:'followup_firm',c:'#fb923c',bg:'rgba(251,146,60,.1)',bd:'rgba(251,146,60,.3)',hint:'要求明確答覆'};
    return {k:'T1',label:'T1 一般追蹤',icon:'🟡',tpl:'followup',c:'#fbbf24',bg:'rgba(245,158,11,.08)',bd:'rgba(245,158,11,.25)',hint:'友善提醒'};
  }

  /* ---------------- 🏷 關鍵字審核 Keyword Review (candidates → reviewed lexicon → feeds discovery) ---------------- */
  var kwState = { edits:{} };  // transient per-session edits keyed by canonical
  function kwGuessCat(term){
    var t=(''+term);
    if(/^[A-Za-z]{2,6}[-_]?\d{2,6}$/.test(t) || /(PRJ|WOP|案|專案)/.test(t)) return '專案';
    if(/(公司|株式|Inc|Ltd|Corp|GmbH|有限|集團|銀行|Page)/i.test(t)) return '公司/單位';
    if(/(系統|平台|ERP|CRM|API|系統|模組|SheetJS|Playwright|Selenium)/i.test(t)) return '產品/系統';
    if(/(金額|報價|合約|付款|發票|價|費|NT\$|USD)/.test(t)) return '財務/金額';
    return '其他';
  }
  function kwCandRows(){
    // normalize uploaded keyword-candidate CSV to a review model; protected tokens (codes/nums) never auto-edited
    return loaded.kwcand.map(function(r){
      var canon = recGet(r,['canonical','Canonical','keyword','詞','正式名稱']) || '';
      var hit = parseInt(recGet(r,['hit_count','hits','出現次數']),10); if(isNaN(hit)) hit=0;
      var docs= parseInt(recGet(r,['document_count','doc_count','文件數']),10); if(isNaN(docs)) docs=0;
      var note= recGet(r,['review_note','note','備註']);
      var existing = lexFind(canon);
      var ed = kwState.edits[canon] || {};
      return { canon:canon, hit:hit, docs:docs, note:note,
        cat: ed.cat!==undefined?ed.cat:(existing?existing.category:kwGuessCat(canon)),
        alias: ed.alias!==undefined?ed.alias:(existing?(existing.aliases||[]).join(', '):''),
        weight: ed.weight!==undefined?ed.weight:(existing?existing.weight:50),
        status: existing?existing.status:(ed.status||'pending') };
    }).sort(function(a,b){ return b.hit-a.hit; });
  }

          '<button data-kwacc="'+i+'" style="font-size:10px;font-weight:600;color:'+(st==='accept'?'#04101a':'var(--em2)')+';background:'+(st==='accept'?'var(--em)':'transparent')+';border:1px solid '+(st==='accept'?'var(--em)':'var(--line2)')+';border-radius:6px;padding:5px 10px;margin-right:4px">採納</button>'+
          '<button data-kwrej="'+i+'" style="font-size:10px;color:'+(st==='reject'?'#04101a':'var(--mut)')+';background:'+(st==='reject'?'#94a3b8':'transparent')+';border:1px solid var(--line2);border-radius:6px;padding:5px 10px">排除</button>'+
        '</td>'+
      '</tr>';
    }).join('');

    return '<div class="fadein" style="flex:1;display:flex;flex-direction:column;position:relative;z-index:10;overflow:hidden">'+head+
      '<div style="flex:none;padding:9px 22px;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line)">'+
        '<span class="mono" style="font-size:10px;color:var(--mut)">候選 '+rows.length+' · 已採納詞庫 '+accepted.length+'</span>'+
        (rows.length?'<span style="flex:1"></span><button data-kwact="acceptall" class="mono" style="font-size:10px;color:var(--em2);border:1px solid var(--line2);border-radius:6px;padding:5px 10px">全部採納</button><button data-kwact="clearlex" class="mono" style="font-size:10px;color:#e0899b;border:1px solid #3a2230;border-radius:6px;padding:5px 10px">清空詞庫</button>':'')+
      '</div>'+
      '<div style="flex:1;overflow:auto"><table style="width:100%;border-collapse:collapse">'+
        '<thead><tr>'+th('關鍵字 / 熱度')+th('分類')+th('別名')+th('權重')+th('處置',{a:'right'})+'</tr></thead>'+
        '<tbody>'+body+'</tbody></table></div>'+
    '</div>';
  }
  function kwCommit(i, status){
    var rows=kwCandRows(); var r=rows[i]; if(!r) return;
    var aliases=(r.alias||'').split(/[,，;；]/).map(function(s){return s.trim();}).filter(Boolean);
    var idx=-1; for(var j=0;j<lexicon.length;j++){ if(lexicon[j].canonical===r.canon){ idx=j; break; } }
    var entry={ canonical:r.canon, aliases:aliases, category:r.cat, weight:r.weight, status:status, at:today() };
    if(idx>=0) lexicon[idx]=entry; else lexicon.push(entry);
    delete kwState.edits[r.canon];
    lexSave(); render();
  }
  function kwAction(a){
    if(a==='loadcsv'){ var inp=D.createElement('input'); inp.type='file'; inp.accept='.csv,text/csv'; inp.onchange=function(){ ingestFiles(inp.files); }; inp.click(); return; }
    if(a==='exportlex'){
      var acc=lexicon.filter(function(x){return x.status==='accept';});
      if(!acc.length){ alert('詞庫是空的(尚無採納的關鍵字)。'); return; }
      function q(v){ v=(v==null?'':''+v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
      var csv='canonical,category,weight,aliases\n'+acc.map(function(x){ return [q(x.canonical),q(x.category),q(x.weight),q((x.aliases||[]).join('|'))].join(','); }).join('\n')+'\n';
      downloadText('confirmed_keywords.csv', csv, 'text/csv');
      downloadText('confirmed_keywords.json', JSON.stringify(acc,null,2), 'application/json');
      return;
    }
    if(a==='acceptall'){ var rows=kwCandRows(); rows.forEach(function(r,i){ if(r.status!=='reject') kwCommitSilent(i,'accept'); }); lexSave(); render(); return; }
    if(a==='clearlex'){ if(confirm('清空整個關鍵字詞庫?(候選 CSV 不受影響)')){ lexicon=[]; lexSave(); render(); } return; }
  }
  function kwCommitSilent(i, status){
    var rows=kwCandRows(); var r=rows[i]; if(!r) return;
    var aliases=(r.alias||'').split(/[,，;；]/).map(function(s){return s.trim();}).filter(Boolean);
    var idx=-1; for(var j=0;j<lexicon.length;j++){ if(lexicon[j].canonical===r.canon){ idx=j; break; } }
    var entry={ canonical:r.canon, aliases:aliases, category:r.cat, weight:r.weight, status:status, at:today() };
    if(idx>=0) lexicon[idx]=entry; else lexicon.push(entry);
    delete kwState.edits[r.canon];
  }

  /* ---------------- ↩ 回覆迴路 Reply Loop (parse replies → status-update proposals; never auto-write) ---------------- */
  var replyState = { text:'', appr:{} };
  var REPLY_OPT = { '1':{label:'已完成',status:'已完成'}, '2':{label:'需補資料',status:'需補資料'}, '3':{label:'需澄清',status:'需澄清'}, '4':{label:'需延長',status:'進行中(延長)'} };
  function replyKnownCode(s){
    // match against control/registry codes, else generic CODE-#### pattern
    var found='';
    loaded.control.forEach(function(c){ if(c.Code && s.indexOf(c.Code)>=0) found=c.Code; });
    registry.forEach(function(r){ if(r.code && s.indexOf(r.code)>=0) found=r.code; });
    if(found) return found;
    var m=s.match(/\b([A-Za-z]{2,5}[-_]\d{2,6})\b/); return m?m[1]:'';
  }
  function replyNameFor(code){
    var n=''; loaded.control.forEach(function(c){ if(c.Code===code) n=c.Name; });
    if(!n) registry.forEach(function(r){ if(r.code===code) n=r.name; });
    return n;
  }
  function replyParseBlock(b){
    var code=replyKnownCode(b);
    var opt=''; var m=b.match(/選項\s*[:：]\s*([1-4])/); if(m) opt=m[1];
    var status='';
    if(opt) status=REPLY_OPT[opt].status;
    else { // loose: status words / circled choice
      if(/[●○\[\(【][ ]*[xXvV✓]?[ ]*已完成|已完成\s*[✓●]/.test(b)||/\b已完成\b/.test(b)&&/[●✓]/.test(b)) status='已完成';
      else if(/卡關|blocked/i.test(b)) status='卡關';
      else if(/進行中/.test(b)) status='進行中';
    }
    var eta=''; var e=b.match(/(?:ETA|交期|預計完成|完成日)\s*[:：]?\s*(\d{4}[\/\-]\d{1,2}[\/\-]\d{1,2})/); if(e) eta=e[1];
    else { var e2=b.match(/\b(\d{4}[\/\-]\d{1,2}[\/\-]\d{1,2})\b/); if(e2) eta=e2[1]; }
    var pct=''; var pc=b.match(/(\d{1,3})\s*%/); if(pc) pct=pc[1]+'%';
    var reason=''; var r=b.match(/(?:原因|說明|備註|阻礙|reason)\s*[:：]\s*(.+)/i); if(r) reason=r[1].trim().slice(0,80);
    var blocked=/阻礙[^無]*有|有阻礙|卡關|blocked/i.test(b);
    if(!code && !opt && !status && !eta) return null;
    return { code:code, name:replyNameFor(code), opt:opt, status:status, eta:eta, pct:pct, reason:reason, blocked:blocked, raw:b.trim().slice(0,140) };
  }
  function parseReplies(text){
    if(!text||!text.trim()) return [];
    // split on the VMT token OR blank lines, so mixed token/loose-text input stays separated
    var blocks=text.split(/==VMT-REPLY==|\n\s*\n+/).map(function(s){return s.trim();}).filter(Boolean);
    var out=[]; blocks.forEach(function(b,i){ var p=replyParseBlock(b); if(p){ p.id='rep_'+i; out.push(p); } });
    return out;
  }
  function replyView(){
    var parsed=parseReplies(replyState.text);
    var matched=parsed.filter(function(p){return p.code;});
    var head='<div style="height:56px;flex:none;border-bottom:1px solid var(--line);padding:0 22px;display:flex;align-items:center;gap:12px;background:rgba(4,12,26,.5)">'+

      '<span class="mono" style="font-size:10px;background:#0f1e34;border:1px solid var(--line2);color:var(--mut);padding:2px 8px;border-radius:5px">貼上對方回覆→解析→狀態更新建議(不自動寫回)</span>'+
      '<span style="flex:1"></span>'+
      '<button data-rpact="sample" class="mono" style="font-size:10px;color:var(--mut);background:#0f1e34;border:1px solid var(--line2);border-radius:8px;padding:7px 11px">插入範例</button>'+
      '<button data-rpact="export" class="mono" style="font-size:10px;color:var(--em2);background:#0f1e34;border:1px solid var(--line2);border-radius:8px;padding:7px 11px">⭳ 匯出已採納更新</button>'+
    '</div>'+
    '<div class="mono" style="font-size:10px;color:var(--mut2);background:var(--panel2);border-bottom:1px solid var(--line);padding:7px 22px">把對方回信內容貼進左框(支援 <b style="color:var(--em2)">==VMT-REPLY==</b> token 或含案號+○選擇題的純文字)。系統解析成狀態更新<b style="color:var(--em2)">建議</b>,你勾選採納後匯出,自行套回控管表 — 不自動改檔、不寄信。</div>';

  /* ---------------- 📈 流程探勘 Process Mining (Case/Activity/Timestamp → DFG · waits · bottleneck) ---------------- */
  function pmEvents(){
    // build events from loaded mails: case = matched project (control/registry) or ConversationID; activity = direction; ts = EventDate
    var evs=[];
    loaded.mails.forEach(function(m){
      var subj=m.Subject||''; var caseId='';
      loaded.control.forEach(function(c){ if((c.Code&&subj.indexOf(c.Code)>=0)||(c.Name&&subj.indexOf(c.Name)>=0)) caseId=c.Code||c.Name; });
      if(!caseId) registry.forEach(function(r){ if((r.code&&subj.indexOf(r.code)>=0)||(r.name&&subj.indexOf(r.name)>=0)) caseId=r.code; });
      if(!caseId) caseId=m.ConversationID||'';
      if(!caseId) return;
      var d=recParseDate(m.EventDate); if(!d) return;
      var act=(m.Direction||'').toUpperCase()==='OUTBOUND'?'我方寄出':(m.Direction||'').toUpperCase()==='INBOUND'?'對方回覆':(m.SuggestedCategory||m.ConfirmedCategory||'事件');
      evs.push({ caseId:caseId, act:act, t:d.getTime(), cat:(m.ConfirmedCategory||m.SuggestedCategory||'') });
    });
    return evs;
  }
  function pmMine(){
    var evs=pmEvents();
    var byCase={}; evs.forEach(function(e){ (byCase[e.caseId]=byCase[e.caseId]||[]).push(e); });
    var trans={}, actFreq={}, durations=[];
    Object.keys(byCase).forEach(function(cid){
      var seq=byCase[cid].sort(function(a,b){return a.t-b.t;});
      durations.push({ caseId:cid, days:(seq[seq.length-1].t-seq[0].t)/86400000, n:seq.length });
      seq.forEach(function(e){ actFreq[e.act]=(actFreq[e.act]||0)+1; });
      for(var i=0;i<seq.length-1;i++){
        var key=seq[i].act+' → '+seq[i+1].act;
        var wait=(seq[i+1].t-seq[i].t)/86400000;
        if(!trans[key]) trans[key]={key:key,count:0,totWait:0};
        trans[key].count++; trans[key].totWait+=wait;
      }
    });
    var edges=Object.keys(trans).map(function(k){ var t=trans[k]; return {key:k,count:t.count,avgWait:t.totWait/t.count}; })
      .sort(function(a,b){ return b.avgWait-a.avgWait; });
    return { cases:Object.keys(byCase).length, events:evs.length, edges:edges,
      acts:Object.keys(actFreq).map(function(a){return {act:a,n:actFreq[a]};}).sort(function(a,b){return b.n-a.n;}),
      durations:durations.sort(function(a,b){return b.days-a.days;}) };
  }

          '<div style="background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 16px"><div style="font-size:11px;font-weight:700;color:var(--mut);margin-bottom:6px">活動頻率</div>'+actRows+'</div>'+

  function runValidation(){

      {n:'案件有狀態或分類', pass: loaded.cases.length? loaded.cases.every(function(c){return c.WorkflowStatus||c.SuggestedCategory||c.ConfirmedCategory;}) : true, d: loaded.cases.length?('cases='+loaded.cases.length):'（無 cases，略）'}
    ]});

    ]});

    subs.push({name:'③ 追蹤清單 Track List', checks:[

      {n:'專案號擷取', pass:null, info:true, d:list.filter(function(r){return r.code;}).length+'/'+list.length+' 有碼'}
    ]});

  function ingestFiles(fileList){
    var files = Array.prototype.slice.call(fileList||[]);
    if(!files.length) return;
    state.loadErr=''; var pending=files.length, names=[];
    files.forEach(function(f){
      var r=new FileReader();
      r.onload=function(){
        try{
          var arr, low=(f.name||'').toLowerCase();
          if(low.slice(-4)==='.csv'){ arr=parseCsv(r.result); }
          else if(low.slice(-6)==='.jsonl'){ arr=r.result.split(/\r?\n/).filter(function(l){return l.trim();}).map(function(l){return JSON.parse(l);}); }
          else { var data=JSON.parse(r.result); arr = Array.isArray(data)?data : (data.rows||data.items||data.Rows||[]); }
          if(!Array.isArray(arr) || !arr.length) throw 0;
          var kind = classify(f.name, arr[0]||{});
          if(kind){ storeBucket(kind, arr); if(kind!=='ignore') names.push(f.name); }
          else state.loadErr='無法辨識檔案類型: '+f.name;
        }catch(e){ state.loadErr='解析失敗: '+f.name+'(不是有效 JSON/CSV)'; }
        if(--pending===0){ if(names.length){ loaded.at=stampNow(); loaded.files=names; trackState.sel=null; } state.nav='loaded'; render(); }
      };
      r.readAsText(f);
    });
  }
  function classify(name, sample){
    var n=(name||'').toLowerCase();
    // ---- 控管表 governing control sheet (explicit; strict headers so mail exports are never stolen) ----
    if(/control_sheet|controlsheet|governance|控管表|治理表|專案控管|master_?tracker|wop_followup/.test(n)) return 'control';
    if((sample.ProjectCode!==undefined||sample.Trace_ID!==undefined||sample.WOP_ID!==undefined||sample['專案代號']!==undefined||sample['案號']!==undefined||sample['案件編號']!==undefined||sample['追蹤碼']!==undefined) &&
       (sample.Status!==undefined||sample.Current_Stage!==undefined||sample['狀態']!==undefined||sample.Owner!==undefined||sample.Stakeholder!==undefined||sample['負責人']!==undefined||sample['承辦人']!==undefined)) return 'control';
    // ---- 關鍵字候選(Text Intelligence keyword candidates)----
    if(/keyword_candidate|keyword_candidates|text_intelligence/.test(n) || (sample.canonical!==undefined && (sample.keyword_id!==undefined||sample.hit_count!==undefined||sample.suggested_action!==undefined))) return 'kwcand';
    // ---- VIA WorkOps v004 CSV outputs ----
    if(/pending/.test(n) || (sample.PENDING_STATUS!==undefined && sample.CASE_ID!==undefined)) return 'pending';
    if(/quality_check|quality_matrix/.test(n) || (sample.CHECK!==undefined && sample.RESULT!==undefined)) return 'qc';
    if(/mail_enriched|mail_index|mail_intel/.test(n) || sample.MAIL_FINGERPRINT!==undefined || sample.PROCESS_STATUS!==undefined) return 'mails';
    if(/mail_fetched/.test(n) || (sample.title!==undefined && sample.event_time!==undefined)) return 'mails';
    if(/project_candidate|cluster_candidate|controlling/.test(n) || sample.AUTO_PROJECT_CODE!==undefined || sample.PROJECT_NAME_CANDIDATE!==undefined) return 'cases';
    if(/stakeholder/.test(n) || sample.STAKEHOLDER!==undefined || sample.CONTACT!==undefined) return 'stake';
    if(/keyword_dictionary|forge_|folder_scan|scan_error/.test(n)) return 'ignore';
    // ---- Wizard: Mail_Events / Case_Groups / Stakeholders · SafeLocal: Subject_Events / Subject_Groups ----
    if(n.indexOf('mail_event')>=0 || n.indexOf('mail-event')>=0 || n.indexOf('subject_event')>=0 || n.indexOf('subject-event')>=0) return 'mails';
    if(n.indexOf('case_group')>=0 || n.indexOf('case-group')>=0 || n.indexOf('subject_group')>=0 || n.indexOf('subject-group')>=0) return 'cases';
    if(n.indexOf('stakeholder')>=0) return 'stake';
    // fall back to key sniffing
    if(sample.MailID!==undefined && sample.Subject!==undefined && sample.ConversationID!==undefined && sample.WorkflowStatus===undefined) return 'mails';
    if(sample.GroupID!==undefined || sample.WorkflowStatus!==undefined || sample.MailIDs!==undefined) return 'cases';
    if(sample.FromCount!==undefined && sample.ToOrCcCount!==undefined) return 'stake';
    return null;
  }
  // ---- minimal CSV parser (quoted fields, CRLF/LF, UTF-8 BOM) ----
  function parseCsv(text){
    text=(text||'').replace(/^﻿/,'');
    var rows=[], row=[], cur='', inq=false, i, c;
    for(i=0;i<text.length;i++){ c=text[i];
      if(inq){ if(c==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else inq=false; } else cur+=c; }
      else { if(c==='"') inq=true; else if(c===','){ row.push(cur); cur=''; } else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; } else if(c==='\r'){} else cur+=c; }
    }
    if(cur.length||row.length){ row.push(cur); rows.push(row); }
    if(!rows.length) return [];
    var head=rows[0].map(function(h){return h.trim();});
    return rows.slice(1).filter(function(r){return r.length && r.some(function(x){return x!=='';});}).map(function(r){
      var o={}; head.forEach(function(h,j){ o[h]=r[j]!==undefined?r[j]:''; }); return o;
    });
  }
  // ---- v004 → canonical normalizers ----
  function num(v){ v=parseInt(v,10); return isNaN(v)?0:v; }
  function firstAddr(s){ if(!s) return ''; return (''+s).split(/[;,]/)[0].trim(); }
  function normMailV004(r){ return { MailID:r.MAIL_FINGERPRINT||r.CASE_ID||'', Subject:r.TITLE||r.NORMALIZED_TITLE||'', EventDate:r.TIME||'', Direction:r.DIRECTION||'', Unread:(r.READ_STATUS==='UNREAD'), ConversationID:r.CASE_ID||'', SuggestedCategory:r.PRIMARY_CATEGORY||'', ConfirmedCategory:r.PRIMARY_CATEGORY||'', WorkflowStatus:r.PROCESS_STATUS||'', SenderEmail:r.FROM_ADDRESS||r.FROM||'', AttachmentCount:0 }; }
  function normStakeV004(r){ var em=r.CONTACT||r.STAKEHOLDER||''; var inb=num(r.INBOUND_COUNT), out=num(r.OUTBOUND_OR_TO_COUNT), cc=num(r.CC_COUNT); return { Email:em, Domain:((em.split('@')[1])||''), FromCount:inb, ToOrCcCount:out+cc, TotalTouches:inb+out+cc, LastDate:r.LAST_INBOUND||r.LAST_OUTBOUND||'' }; }
  /* universal header dictionary — exact-first, then fuzzy substring, so any industry's sheet maps */
  var CTRL_DICT = {
    Code:    ['ProjectCode','project_code','Trace_ID','TraceID','WOP_ID','WOP','專案代號','案號','案件編號','追蹤碼','代號','Code','ID'],
    Name:    ['ProjectName','project_name','專案名稱','案名','項目名稱','主題','Subject','Name','Activity','Step_Name'],
    Owner:   ['Owner','owner','負責人','承辦人','窗口','對口','PM','單位','Stakeholder','Owner_Domain','PIC'],
    Status:  ['Status','status','狀態','進度狀態','Current_Stage','Stage'],
    Progress:['Progress','progress','進度','完成','完成百分比','完成率'],
    Due:     ['DueDate','due','Deadline','ETA','交期','截止','預計完成','預計完成日','Target_Date','T3_Urgent_Date'],
    Updated: ['LastUpdated','last_updated','UpdatedAt','最後更新','更新日','更新日期','Last_Comm_Date','最後通訊','Timestamp'],
    Next:    ['NextStep','next','下一步','下一步行動','Next_Steps'],
    Ball:    ['Ball','ball','球在誰','待誰行動']
  };
  function ctrlPick(r, field){
    var keys=CTRL_DICT[field], rk=Object.keys(r);
    for(var i=0;i<keys.length;i++){ var k=keys[i]; if(r[k]!==undefined && (''+r[k]).trim()!=='') return (''+r[k]).trim(); }
    // fuzzy pass: header contains a dictionary word (case-insensitive), e.g. "專案代號(必填)" or "Owner Name"
    for(var i=0;i<keys.length;i++){
      var kw=keys[i].toLowerCase();
      if(kw.length<2) continue;
      for(var j=0;j<rk.length;j++){
        if(rk[j].toLowerCase().indexOf(kw)>=0 && r[rk[j]]!==undefined && (''+r[rk[j]]).trim()!=='') return (''+r[rk[j]]).trim();
      }
    }
    return '';
  }
  function normControl(r){
    return {
      Code:    ctrlPick(r,'Code'),
      Name:    ctrlPick(r,'Name'),
      Owner:   ctrlPick(r,'Owner'),

      Progress:ctrlPick(r,'Progress'),
      Due:     ctrlPick(r,'Due'),
      Updated: ctrlPick(r,'Updated'),
      Next:    ctrlPick(r,'Next'),
      Ball:    ctrlPick(r,'Ball'),

    };
  }
  function normProjV004(r){ return { GroupID:r.AUTO_PROJECT_CODE||r.CLUSTER_ID||'', Subject:r.PROJECT_NAME_CANDIDATE||r.REPRESENTATIVE_TITLE||'', MessageCount:num(r.MAIL_COUNT), InboundCount:0, OutboundCount:0, LastDate:'', WorkflowStatus:'候選(待確認)', SuggestedCategory:r.PRIMARY_CATEGORY_CODE||'', ConfirmedCategory:r.PRIMARY_CATEGORY_CODE||'', NeedsAttention:false, MailIDs:[] }; }
  // fetch_mailbox.py JSONL record: title/body/actor/counterparts/event_time/thread_id/source_ref
  function isFetchMail(r){ return r.title!==undefined && (r.counterparts!==undefined || r.event_time!==undefined); }
  function normMailFetch(r){ return { MailID:r.source_ref||r.thread_id||'', Subject:r.title||'', EventDate:(r.event_time||'').replace('T',' '), Direction:'', Unread:false, ConversationID:r.thread_id||'', SuggestedCategory:'', ConfirmedCategory:'', WorkflowStatus:'', SenderEmail:firstAddr(r.counterparts)||r.actor||'', AttachmentCount:0 }; }
  function isV004Mail(r){ return r.MAIL_FINGERPRINT!==undefined || r.PROCESS_STATUS!==undefined || r.PRIMARY_CATEGORY!==undefined; }
  function isV004Stake(r){ return r.STAKEHOLDER!==undefined || r.CONTACT!==undefined; }
  function isV004Proj(r){ return r.AUTO_PROJECT_CODE!==undefined || r.PROJECT_NAME_CANDIDATE!==undefined; }
  function storeBucket(kind, arr){
    if(kind==='ignore') return;
    if(kind==='pending'){ loaded.pending=arr; }
    else if(kind==='control'){ loaded.control=arr.map(normControl); state.recAppr={}; }
    else if(kind==='kwcand'){ loaded.kwcand=arr; }
    else if(kind==='qc'){ loaded.qc=arr; }
    else if(kind==='mails'){ loaded.mails=arr.map(function(r){ return isV004Mail(r)?normMailV004(r): isFetchMail(r)?normMailFetch(r): r; }); }
    else if(kind==='stake'){ loaded.stake=arr.map(function(r){ return isV004Stake(r)?normStakeV004(r):r; }); }

  }
  function stampNow(){ var d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0'); }
  function today(){ var d=new Date(); return d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0'); }

    var byCat = {};

    var catRows = Object.keys(byCat).sort().map(function(k){ return {k:k,n:byCat[k]}; });
    var needs = cases.filter(function(c){ return c.NeedsAttention===true||c.NeedsAttention==='True'; });
    var byStatus = {};
    cases.forEach(function(c){ var s=c.WorkflowStatus||'未分類'; (byStatus[s]=byStatus[s]||[]).push(c); });

    var slides = [];
    // 1) Title
    slides.push({type:'title', title:'專案狀態簡報', sub:'Veritas Mail-Ops · Project Status Review', meta:today()+' · 來源: '+(loaded.files.join(', ')||'本機匯出')});

    ], cats:catRows});

    slides.push({type:'title', title:'謝謝', sub:'Generated offline by Veritas Mail-Ops', meta:'資料未離開本機 · '+today()});

        '<div style="width:100%;max-width:980px;box-shadow:0 24px 60px rgba(0,0,0,.5);border-radius:14px;overflow:hidden">'+slideHTML(s, deck.idx, deck.slides.length, false)+'</div>'+
      '</div>'+
      '<div style="flex:none;display:flex;align-items:center;justify-content:center;gap:14px;padding:14px;color:#9aa2ad;font-family:var(--mono);font-size:12px;background:#0b0f16;border-top:1px solid #1b2330">'+
        '<button data-deck="prev" style="display:flex;align-items:center;gap:5px;color:#cbd5e1;border:1px solid #2a3444;border-radius:8px;padding:7px 14px">← 上一頁</button>'+
        '<span>'+(deck.idx+1)+' / '+deck.slides.length+' · ← → 換頁 · Esc 離開</span>'+
        '<button data-deck="next" style="display:flex;align-items:center;gap:5px;color:#cbd5e1;border:1px solid #2a3444;border-radius:8px;padding:7px 14px">下一頁 →</button>'+
        '<button data-deck="print" style="display:flex;align-items:center;gap:6px;color:#0b0f16;background:var(--em2);border-radius:8px;padding:7px 14px;font-weight:700;margin-left:16px">'+IC.printer({s:14})+' 列印 / PDF</button>'+
        '<button data-deck="exit" style="display:flex;align-items:center;gap:5px;color:#cbd5e1;border:1px solid #2a3444;border-radius:8px;padding:7px 14px">'+IC.x({s:13})+' 離開</button>'+
      '</div>'+
    '</div>';
  }
  function renderDeck(){
    // screen overlay appended to #app; print stack into #deckprint
    var host = D.getElementById('deckhost');
    if(!host){ host=D.createElement('div'); host.id='deckhost'; D.getElementById('app').appendChild(host); }
    host.innerHTML = deckOverlay();
    var pr = D.getElementById('deckprint');
    pr.innerHTML = deck.open ? deck.slides.map(function(s,i){ return slideHTML(s,i,deck.slides.length,true); }).join('') : '';
  }
  function openDeck(){ deck.slides=buildDeckSlides(); deck.idx=0; deck.open=true; renderDeck(); }
  function closeDeck(){ deck.open=false; renderDeck(); }
  function deckNav(dir){ if(dir==='next') deck.idx=Math.min(deck.idx+1,deck.slides.length-1); else if(dir==='prev') deck.idx=Math.max(deck.idx-1,0); renderDeck(); }

  /* ============================= EVENTS ============================= */
  D.getElementById('app').addEventListener('click', function(e){
    var t = e.target.closest('[data-act],[data-nav],[data-open],[data-addtask],[data-move],[data-ltab],[data-deck],[data-tsel],[data-tplsel],[data-tplact],[data-recact],[data-recappr],[data-dact],[data-dkw],[data-dconf],[data-dregdel],[data-kwact],[data-kwacc],[data-kwrej],[data-rpappr],[data-rpact]');
    if(!t) return;
    if(t.dataset.kwacc!==undefined && t.dataset.kwacc!==''){ kwCommit(+t.dataset.kwacc,'accept'); return; }
    if(t.dataset.kwrej!==undefined && t.dataset.kwrej!==''){ kwCommit(+t.dataset.kwrej,'reject'); return; }
    if(t.dataset.kwact){ kwAction(t.dataset.kwact); return; }
    if(t.dataset.rpappr){ replyState.appr[t.dataset.rpappr]=!replyState.appr[t.dataset.rpappr]; render(); return; }
    if(t.dataset.rpact){ replyAction(t.dataset.rpact); return; }
    if(t.dataset.dkw){ var dk=t.dataset.dkw.split('|'); var g=discCache[+dk[0]]; if(g){ var kw=g.kws[+dk[1]]; var sel=discKwSel(g.subj,g.kws); sel[kw]=!sel[kw]; render(); } return; }
    if(t.dataset.dconf!==undefined && t.dataset.dconf!==''){ discConfirm(+t.dataset.dconf); return; }
    if(t.dataset.dregdel){ var rc=t.dataset.dregdel; if(confirm('從登錄庫移除 '+rc+'?(不影響已匯出的檔案)')){ registry=registry.filter(function(r){return r.code!==rc;}); regSave(); render(); } return; }
    if(t.dataset.dact){ discAction(t.dataset.dact); return; }
    if(t.dataset.recappr){ state.recAppr[t.dataset.recappr]=!state.recAppr[t.dataset.recappr]; render(); return; }
    if(t.dataset.recact){ recAction(t.dataset.recact); return; }
    if(t.dataset.tplsel){ state.tplSel=t.dataset.tplsel; render(); return; }
    if(t.dataset.tplact){ tplAction(t.dataset.tplact); return; }
    if(t.dataset.deck){ var dd=t.dataset.deck; if(dd==='exit') closeDeck(); else if(dd==='print') window.print(); else deckNav(dd); return; }
    if(t.dataset.act==='deck'){ openDeck(); return; }
    if(t.dataset.act==='inject'){ var s=SAMPLES[sampleIdx%SAMPLES.length]; sampleIdx++; var a=engine.ingest({sender:s.sender,subject:s.subject,body:s.body,time:'Just Now'}); if(a) state.selected=a.id; state.nav='inbox'; persist(); render(); return; }
    if(t.dataset.act==='reset'){ if(confirm('清除本機示範資料並重新載入種子資料？')){ try{localStorage.removeItem(LS);}catch(e){} sampleIdx=0; boot(); } return; }
    if(t.dataset.act==='pickjson'){ var inp=D.createElement('input'); inp.type='file'; inp.accept='.json,application/json'; inp.multiple=true; inp.onchange=function(){ ingestFiles(inp.files); }; inp.click(); return; }
    if(t.dataset.act==='clearjson'){ loaded={mails:[],cases:[],stake:[],pending:[],qc:[],control:[],kwcand:[],at:null,files:[]}; trackState.sel=null; state.recAppr={}; state.loadErr=''; render(); return; }
    if(t.dataset.act==='exportcsv'){ exportTrackCsv(); return; }
    if(t.dataset.act==='runval'){ render(); return; }
    if(t.dataset.act==='resetset'){ settings=JSON.parse(JSON.stringify(DEFAULT_SET)); saveSettings(); trackState.sel=null; render(); return; }
    if(t.dataset.tsel){ var id=t.dataset.tsel; if(!trackState.sel) trackState.sel={}; trackState.sel[id]=!trackState.sel[id]; render(); return; }
    if(t.dataset.ltab){ state.loadedTab=t.dataset.ltab; render(); return; }
    if(t.dataset.nav){ state.nav=t.dataset.nav; render(); return; }
    if(t.dataset.open){ var m=engine.vault.get(t.dataset.open); if(m){ m.isUnread=false; state.selected=m.id; persist(); render(); } return; }
    if(t.dataset.addtask){ var p=t.dataset.addtask.split('|'); var mm=engine.vault.get(p[0]); engine.addTask(p[1], mm?mm.project:'未分類專案', p[2], p[0]); persist(); flashBoardHint(); render(); return; }
    if(t.dataset.move){ var q=t.dataset.move.split('|'); engine.moveTask(q[0], q[1]); persist(); render(); return; }
  });
  D.getElementById('app').addEventListener('input', function(e){
    if(e.target.id==='q'){ state.query=e.target.value; var f=D.activeElement, c=f&&f.selectionStart;
      // re-render inbox list only-ish: simplest is full render + refocus
      render(); var nq=D.getElementById('q'); if(nq){ nq.focus(); try{nq.setSelectionRange(c,c);}catch(_){} } return; }
    var dn=e.target.getAttribute && e.target.getAttribute('data-dname');
    if(dn!==null && dn!==undefined){ var dg=discCache[+dn]; if(dg) discState.names[dg.subj]=e.target.value; return; }
    if(e.target.getAttribute && e.target.getAttribute('data-rptext')!==null && e.target.hasAttribute('data-rptext')){ replyState.text=e.target.value; return; }
    var ka=e.target.getAttribute && e.target.getAttribute('data-kwalias');
    if(ka!==null && ka!==undefined){ var kr=kwCandRows()[+ka]; if(kr){ (kwState.edits[kr.canon]=kwState.edits[kr.canon]||{}).alias=e.target.value; } return; }
    var kw=e.target.getAttribute && e.target.getAttribute('data-kwwt');
    if(kw!==null && kw!==undefined){ var kr2=kwCandRows()[+kw]; if(kr2){ (kwState.edits[kr2.canon]=kwState.edits[kr2.canon]||{}).weight=+e.target.value; var sp=e.target.nextElementSibling; if(sp) sp.textContent=e.target.value; } return; }
    var tf=e.target.getAttribute && e.target.getAttribute('data-tf');
    if(tf){
      var t=currentTpl(); if(!t) return;
      t[tf]=e.target.value;
      if(tf==='name') t.key=tplKeyFromName(e.target.value);
      saveTemplates();
      // live-update preview only (no full render → caret preserved in the field being typed)
      if(tf==='subject'){ var ps=D.getElementById('tplprevsubj'); if(ps) ps.textContent='主旨:'+fillVars(e.target.value); }
      if(tf==='body'){ var pb=D.getElementById('tplpreview'); if(pb) pb.innerHTML=fillVars(e.target.value); }
      return;
    }
  });
  function flashBoardHint(){ /* subtle: switch nothing, task lands in board; ledger records it */ }

  // Drag-drop of exported JSON onto the dropzone (offline, in-memory)
  var appEl = D.getElementById('app');
  appEl.addEventListener('dragover', function(e){ var dz=e.target.closest&&e.target.closest('#dropzone'); if(dz){ e.preventDefault(); dz.style.borderColor='var(--em)'; dz.style.background='rgba(16,185,129,.06)'; } });
  appEl.addEventListener('dragleave', function(e){ var dz=e.target.closest&&e.target.closest('#dropzone'); if(dz){ dz.style.borderColor='var(--line2)'; dz.style.background='rgba(5,11,20,.5)'; } });
  appEl.addEventListener('drop', function(e){ var dz=e.target.closest&&e.target.closest('#dropzone'); if(dz){ e.preventDefault(); if(e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files.length) ingestFiles(e.dataTransfer.files); } });

  D.getElementById('app').addEventListener('change', function(e){
    if(e.target.getAttribute && e.target.getAttribute('data-thr')!=null){
      settings.thr = (+e.target.value)/100; saveSettings();
      resetTrackSel(computeTrackList());
      render();
    }
    if(e.target.getAttribute && e.target.getAttribute('data-wt')!=null){
      settings.w[e.target.getAttribute('data-wt')] = (+e.target.value)/100; saveSettings();
      trackState.sel=null; render();
    }
    if(e.target.getAttribute && e.target.getAttribute('data-kwcat')!=null){
      var kr=kwCandRows()[+e.target.getAttribute('data-kwcat')]; if(kr){ (kwState.edits[kr.canon]=kwState.edits[kr.canon]||{}).cat=e.target.value; }
    }
  });

  D.addEventListener('keydown', function(e){
    if(!deck.open) return;
    if(e.key==='ArrowRight'||e.key===' '){ e.preventDefault(); deckNav('next'); }
    else if(e.key==='ArrowLeft'){ e.preventDefault(); deckNav('prev'); }
    else if(e.key==='Escape'){ closeDeck(); }
  });

  boot();
})();
</script>
</body>
</html>
