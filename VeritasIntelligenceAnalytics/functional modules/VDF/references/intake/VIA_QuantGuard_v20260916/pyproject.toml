[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taiwan-quant-engine-mvp"
version = "0.1.0"
description = "VIA QuantGuard local-first Polars quantitative and numerical-regression engine"
requires-python = ">=3.11"
dependencies = [
  "polars>=1.21,<2",
]

[tool.setuptools]
packages = ["quant_engine"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
yfinance = ["yfinance>=0.2.50,<1", "pyarrow>=15,<22"]
persist = ["duckdb>=1,<2", "pytz>=2024", "psycopg[binary]>=3.2,<4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "anti_lookahead: deterministic point-in-time and future-leakage tests",
  "postgres: PostgreSQL persistence backend contract tests",
  "regression: fixed golden numerical regression tests",
]
