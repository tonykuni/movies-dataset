name: quant-engine-ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-anti-lookahead:
    name: Unit + anti-lookahead gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install -e ".[test,persist]"

      - name: Run full deterministic test suite
        run: python -m pytest -q --strict-markers

      - name: Run focused anti-lookahead suite
        run: python -m pytest -q --strict-markers tests/test_replay.py -m anti_lookahead

      - name: Run VIA QuantGuard numerical regression gate
        run: python -m pytest -q --strict-markers tests/test_quantguard_regression.py -m regression

      - name: Run DuckDB factor-composite backtest smoke test
        run: python -m pytest -q --strict-markers tests/test_duckdb_backtest.py

      - name: Compile source and validate SSOT
        run: |
          python -m compileall -q quant_engine tests examples scripts
          python scripts/export_ssot.py
          python -m json.tool ssot/quant_engine_ssot.json >/dev/null

  postgres-contract:
    name: PostgreSQL PointInTimeStore contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: quant
          POSTGRES_PASSWORD: quant
          POSTGRES_DB: quant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quant -d quant_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and persistence dependencies
        run: python -m pip install -e ".[test,persist]"

      - name: Run PostgreSQL adapter contract test
        env:
          TEST_POSTGRES_DSN: postgresql://quant:quant@localhost:5432/quant_test
        run: python -m pytest -q --strict-markers tests/test_replay.py -m postgres
