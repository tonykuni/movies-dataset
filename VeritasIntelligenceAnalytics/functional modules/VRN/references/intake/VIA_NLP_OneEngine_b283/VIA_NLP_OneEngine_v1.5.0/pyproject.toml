[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "via-nlp-one-engine"
version = "1.5.0"
description = "CPU/RAM-first bilingual NLP router with governed incremental learning"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary - VIA project"}
authors = [{name = "Veritas Intelligence Analytics"}]
dependencies = []

[project.optional-dependencies]
monitor = ["psutil>=6,<8"]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1"]
ml = ["scikit-learn>=1.5,<2", "joblib>=1.4,<2", "numpy>=1.26,<3"]
zh = ["jieba>=0.42,<1", "opencc-python-reimplemented>=0.1.7,<1"]
nlp = ["spacy>=3.8,<4"]
deep = ["sentence-transformers>=3,<7", "onnxruntime>=1.20,<2"]
documents = ["python-docx>=1.1,<2", "pypdf>=5,<7"]
translate = ["argostranslate>=1.9,<2", "google-cloud-translate>=3,<4"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
markitdown = ["markitdown>=0.1,<1"]
code-intelligence = ["libcst>=1.8,<2", "tree-sitter>=0.25,<1", "pydantic>=2,<3", "typeguard>=4,<5"]
devtools = ["ruff>=0.12,<1", "loguru>=0.7,<1", "icecream>=2,<3"]
data-fast = ["polars>=1,<2"]
html-fast = ["selectolax>=0.3,<1"]
browser = ["playwright>=1.55,<2"]
report = ["plotly>=6,<7", "dash>=3,<5"]
image = ["rembg>=2,<3", "Pillow>=11,<13"]
all = [
  "psutil>=6,<8",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "scikit-learn>=1.5,<2",
  "joblib>=1.4,<2",
  "numpy>=1.26,<3",
  "jieba>=0.42,<1",
  "opencc-python-reimplemented>=0.1.7,<1",
  "spacy>=3.8,<4",
  "sentence-transformers>=3,<7",
  "onnxruntime>=1.20,<2",
  "python-docx>=1.1,<2",
  "pypdf>=5,<7",
  "argostranslate>=1.9,<2",
  "google-cloud-translate>=3,<4",
  "markitdown>=0.1,<1",
  "libcst>=1.8,<2",
  "tree-sitter>=0.25,<1",
  "pydantic>=2,<3",
  "typeguard>=4,<5",
  "ruff>=0.12,<1",
  "loguru>=0.7,<1",
  "icecream>=2,<3",
  "polars>=1,<2",
  "selectolax>=0.3,<1",
  "playwright>=1.55,<2",
  "plotly>=6,<7",
  "dash>=3,<5",
  "rembg>=2,<3",
  "Pillow>=11,<13",
]

[project.scripts]
via-nlp = "via_nlp_engine.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
