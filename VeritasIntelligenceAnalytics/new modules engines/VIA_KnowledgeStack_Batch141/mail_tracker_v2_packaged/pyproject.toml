[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mail-tracker-v2"
version = "2.1.0"
description = "Modular email intelligence pipeline: identity, semantic risk, project/dept mapping, SLA, lifeline, workflow."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Mail Tracker Team" }]
keywords = ["email", "tracking", "sla", "workflow", "risk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
]
# Runtime deps: stdlib only for the core pipeline
dependencies = []

[project.optional-dependencies]
# User-facing extras (published) — none required for core
json-pretty = []

[project.scripts]
mail-tracker = "mail_tracker_v2.pipeline:main"

[project.urls]
Homepage = "https://example.com/mail-tracker-v2"

# ---------------------------------------------------------------------------
# PEP 735 dependency groups (dev-only; not published to PyPI)
# ---------------------------------------------------------------------------
[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
]
lint = [
    "ruff>=0.8",
    "mypy>=1.13",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["mail_tracker_v2"]

[tool.uv]
default-groups = ["dev"]
# fork-strategy = "requires-python"  # default; use "fewest" for fewer multi-version pins

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
