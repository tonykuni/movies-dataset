<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <filter id="rough" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3"/>
    </filter>
    <clipPath id="sq"><rect x="30" y="30" width="240" height="240" rx="6"/></clipPath>
  </defs>

  <!-- 朱文方印：硃紅底，陰刻留白邊框，紅字 -->
  <g filter="url(#rough)">
    <rect x="30" y="30" width="240" height="240" rx="6" fill="#b03a2e"/>
    <!-- 內框留白（陰線） -->
    <rect x="44" y="44" width="212" height="212" rx="3" fill="none" stroke="#f5f4f0" stroke-width="5"/>
  </g>

  <!-- 主字「樞」：樞紐／中軸——萬源匯於此、一台統御 -->
  <g clip-path="url(#sq)">
    <text x="150" y="206" font-family="'Noto Serif TC','Songti TC',serif" font-size="172"
          font-weight="700" text-anchor="middle" fill="#f5f4f0" filter="url(#rough)">樞</text>
  </g>

  <!-- 邊角斑駁（印泥質感） -->
  <g fill="#b03a2e" opacity="0.0"/>
</svg>
