  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ne;margin-top:1px;\"><span style=\"font-size:10px;font-weight:700;color:#c0392b;font-family:'DM Mono',monospace;\">−2.50%<\u002Fspan><span style=\"font-size:8.5px;color:var(--slate);\">週−4.1%<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <svg viewBox=\"0 0 100 22\" preserveAspectRatio=\"none\" style=\"display:block;width:100%;height:20px;margin-top:auto;\">\n            <defs><linearGradient id=\"spk7\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#c0392b\" stop-opacity=\"0.6\"><\u002Fstop><stop offset=\"1\" stop-color=\"#c0392b\" stop-opacity=\"0.05\"><\u002Fstop><\u002FlinearGradient><\u002Fdefs>\n            <polygon points=\"0,5 16,9 33,7 50,12 66,15 83,16 100,19 100,22 0,22\" fill=\"url(#spk7)\"><\u002Fpolygon>\n            <polyline points=\"0,5 16,9 33,7 50,12 66,15 83,16 100,19\" fill=\"none\" stroke=\"#c0392b\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><\u002Fpolyline>\n          <\u002Fsvg>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <div class=\"note\" style=\"margin:12px 0 4px;border-left-color:var(--purple);background:#ebe5fb;\"><b style=\"color:#6d28d9;\">本週重點（同步週共振矩陣）：<\u002Fb>央行決策超級週——FOMC 華許轉鷹(點陣圖 3.8%)、BoJ 升息 1.0%;美伊 MOU 待簽、油價 ~$80;三線共振(油價/日圓/10年債)決定台股與美股重定價。詳見 <span class=\"mono\">VIA Weekly Resonance Matrix<\u002Fspan>。<\u002Fdiv>\n\n  <div class=\"thesis\">\n    <b>核心命題：<\u002Fb>「川普政治降風險」對上「華許貨幣升風險」。市場目前先買前者,但後者決定反彈能走多遠;而期中選舉不是獨立殺手,它會「放大」Fed／油價／通膨／政策風險對高估值的衝擊。\n  <\u002Fdiv>\n\n  <!-- ===== 週情勢視覺儀表板 ===== -->\n  <div style=\"border:1px solid var(--line);border-radius:14px;padding:16px 18px 18px;margin:6px 0 4px;background:linear-gradient(170deg,#fbfbf8,var(--bg));box-shadow:0 1px 2px rgba(0,0,0,.03);\">\n    <div style=\"font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--slate);font-weight:600;margin-bottom:12px;\">Weekly Cockpit · 週情勢儀表板<\u002Fdiv>\n\n    <!-- 力場平衡條 -->\n    <div style=\"display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:600;margin-bottom:5px;\">\n      <span style=\"color:var(--teal);\">◀ 政治降風險(撐估值)<\u002Fspan><span style=\"color:var(--slate);font-weight:500;\">本週力場偏壓<\u002Fspan><span style=\"color:var(--red);\">貨幣升風險(壓估值) ▶<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"position:relative;height:16px;border-radius:9px;overflow:hidden;background:linear-gradient(90deg,#0F766E 0%,#5ba79f 38%,#e7d9bd 50%,#d99a6c 62%,#9F1D1D 100%);\">\n      <div style=\"position:absolute;top:-3px;left:60%;transform:translateX(-50%);width:3px;height:22px;background:#1f2933;border-radius:2px;box-shadow:0 0 0 2px #fff;\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;justify-content:space-between;font-size:9.5px;color:var(--slate);margin:3px 1px 14px;\">\n      <span>美伊 MOU · 降息預期<\u002Fspan><span style=\"font-weight:700;color:#9F1D1D;\">↘ 指針偏右:Fed 轉鷹主導<\u002Fspan><span>點陣圖3.8% · 殖利率↑<\u002Fspan>\n    <\u002Fdiv>\n\n    <!-- 三段流程:上週→催化→本週 -->\n    <div style=\"display:grid;grid-template-columns:1fr 22px 1fr 22px 1fr;align-items:stretch;gap:0;margin-bottom:16px;\">\n      <div style=\"border:1px solid #cdd9e8;background:#eef4fc;border-radius:9px;padding:9px 11px;\">\n        <div style=\"font-size:10px;font-weight:700;color:#2563EB;letter-spacing:.04em;margin-bottom:3px;\">上週情勢<\u002Fdiv>\n        <div style=\"font-size:11px;line-height:1.5;color:var(--ink);\">SPY 746→收高;科技基金 +$21.5B 紀錄流入;油價自高點回落 ~$80;美伊釋出和談訊號。<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:16px;\">›<\u002Fdiv>\n      <div style=\"border:1px solid #e4cf9a;background:#fbf1dc;border-radius:9px;padding:9px 11px;\">\n        <div style=\"font-size:10px;font-weight:700;color:#B45309;letter-spacing:.04em;margin-bottom:3px;\">本週催化劑<\u002Fdiv>\n        <div style=\"font-size:11px;line-height:1.5;color:var(--ink);\">FOMC 7/28–29 點陣圖;BoJ 升息 1.0%;美伊 MOU 簽署;Micron 6/24 財報;Hormuz 動態。<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:16px;\">›<\u002Fdiv>\n      <div style=\"border:1px solid #e3b9b9;background:#f7e6e6;border-radius:9px;padding:9px 11px;\">\n        <div style=\"font-size:10px;font-weight:700;color:#9F1D1D;letter-spacing:.04em;margin-bottom:3px;\">本週展望<\u002Fdiv>\n        <div style=\"font-size:11px;line-height:1.5;color:var(--ink);\">區間震盪偏防禦;反彈高度受殖利率封頂;留意三線共振(油/日圓/10年債)觸發重定價。<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 因子熱力矩陣 -->\n    <div style=\"font-size:10px;font-weight:700;color:var(--slate);letter-spacing:.04em;margin-bottom:6px;\">因子熱力矩陣 · 🟢安全 🟡留意 🔴警戒<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(5,1fr);gap:6px;\">\n      <div style=\"border-radius:8px;padding:7px 9px;background:#fbeed8;border:1px solid #e4cf9a;\"><div style=\"font-size:10px;color:#B45309;font-weight:600;\">油價/Hormuz<\u002Fdiv><div style=\"font-size:13px;font-weight:700;color:#B45309;\">$80 🟡<\u002Fdiv><\u002Fdiv>\n      <div style=\"border-radius:8px;padding:7px 9px;background:#fbeed8;border:1px solid #e4cf9a;\"><div style=\"font-size:10px;color:#B45309;font-weight:600;\">通膨核心<\u002Fdiv><div style=\"font-size:13px;font-weight:700;color:#B45309;\">2.9% 🟡<\u002Fdiv><\u002Fdiv>\n      <div style=\"border-radius:8px;padding:7px 9px;background:#f6e2e2;border:1px solid #e3b9b9;\"><div style=\"font-size:10px;color:#9F1D1D;font-weight:600;\">Fed 點陣圖<\u002Fdiv><div style=\"font-size:13px;font-weight:700;color:#9F1D1D;\">3.8% 🔴<\u002Fdiv><\u002Fdiv>\n      <div style=\"border-radius:8px;padding:7px 9px;background:#fbeed8;border:1px solid #e4cf9a;\"><div style=\"font-size:10px;color:#B45309;font-weight:600;\">2Y 殖利率<\u002Fdiv><div style=\"font-size:13px;font-weight:700;color:#B45309;\">4.2% 🟡<\u002Fdiv><\u002Fdiv>\n      <div style=\"border-radius:8px;padding:7px 9px;background:#e2ecfd;border:1px solid #cdd9e8;\"><div style=\"font-size:10px;color:#2563EB;font-weight:600;\">美元 one\" stroke=\"#9F1D1D\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fmarker>\n      <marker id=\"at\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6.4\" markerHeight=\"6.4\" orient=\"auto-start-reverse\"><path d=\"M2 1L8 5L2 9\" fill=\"none\" stroke=\"#0F766E\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fmarker>\n    <\u002Fdefs>\n\n    <!-- 邊(壓在節點下);紅=推升風險、青=壓制估值、虛線=回饋。正交路由對準框邊中心 -->\n    <g fill=\"none\" opacity=\"0.82\">\n      <path d=\"M450 88 V118\" stroke=\"#9F1D1D\" stroke-width=\"2\" marker-end=\"url(#ar)\"><\u002Fpath><!-- 政治→油價 -->\n      <path d=\"M450 176 V206\" stroke=\"#9F1D1D\" stroke-width=\"2\" marker-end=\"url(#ar)\"><\u002Fpath><!-- 油價→通膨 -->\n      <path d=\"M450 264 V294\" stroke=\"#9F1D1D\" stroke-width=\"2.2\" marker-end=\"url(#ar)\"><\u002Fpath><!-- 通膨→Fed -->\n      <path d=\"M550 323 H660\" stroke=\"#9F1D1D\" stroke-width=\"1.9\" marker-end=\"url(#ar)\"><\u002Fpath><!-- Fed→殖利率 -->\n      <path d=\"M350 323 H240\" stroke=\"#9F1D1D\" stroke-width=\"1.9\" marker-end=\"url(#ar)\"><\u002Fpath><!-- Fed→美元 -->\n      <path d=\"M760 352 V424 H562\" stroke=\"#0F766E\" stroke-width=\"2\" marker-end=\"url(#at)\"><\u002Fpath><!-- 殖利率→估值 -->\n      <path d=\"M140 352 V424 H338\" stroke=\"#0F766E\" stroke-width=\"2\" marker-end=\"url(#at)\"><\u002Fpath><!-- 美元→估值 -->\n      <path d=\"M450 502 V462\" stroke=\"#0F766E\" stroke-width=\"2\" marker-end=\"url(#at)\"><\u002Fpath><!-- AI→估值 -->\n      <path d=\"M720 294 V276 H472 V294\" stroke=\"#9F1D1D\" stroke-width=\"1.4\" stroke-dasharray=\"5 4\" marker-end=\"url(#ar)\"><\u002Fpath><!-- 殖利率→Fed 回饋 -->\n    <\u002Fg>\n\n    <!-- 節點 -->\n    <g font-weight=\"700\" text-anchor=\"middle\">\n    <rect x=\"280\" y=\"30\" width=\"340\" height=\"58\" rx=\"12\" fill=\"#EEEAFB\" stroke=\"#7C3AED\" stroke-width=\"1.4\"><\u002Frect><text x=\"450\" y=\"55\" fill=\"#6D28D9\" font-size=\"14.5\">地緣 / 接班政治<\u002Ftext><text x=\"450\" y=\"75\" fill=\"#6D28D9\" font-size=\"10.5\" font-weight=\"400\">美伊 MOU · 川普/Vance/Rubio · 期中選舉<\u002Ftext>\n    <rect x=\"350\" y=\"118\" width=\"200\" height=\"58\" rx=\"12\" fill=\"#FBEEDC\" stroke=\"#D97706\" stroke-width=\"1.8\"><\u002Frect><text x=\"450\" y=\"143\" fill=\"#B45309\" font-size=\"15\">油價 / Hormuz<\u002Ftext><text x=\"450\" y=\"162\" fill=\"#B45309\" font-size=\"10.5\" font-weight=\"400\">樞紐 · Brent ~$80<\u002Ftext>\n    <rect x=\"350\" y=\"206\" width=\"200\" height=\"58\" rx=\"12\" fill=\"#F5E3E3\" stroke=\"#9F1D1D\" stroke-width=\"1.4\"><\u002Frect><text x=\"450\" y=\"231\" fill=\"#9F1D1D\" font-size=\"14\">通膨 CPI4.2/PPI6.5<\u002Ftext><text x=\"450\" y=\"250\" fill=\"#9F1D1D\" font-size=\"10.5\" font-weight=\"400\">能源驅動 · 生產端更熱<\u002Ftext>\n    <rect x=\"350\" y=\"294\" width=\"200\" height=\"58\" rx=\"12\" fill=\"#F5E3E3\" stroke=\"#9F1D1D\" stroke-width=\"1.6\"><\u002Frect><text x=\"450\" y=\"319\" fill=\"#9F1D1D\" font-size=\"14\">Fed 華許(鷹)<\u002Ftext><text x=\"450\" y=\"338\" fill=\"#9F1D1D\" font-size=\"10.5\" font-weight=\"400\">點陣圖 3.8% · 升息上桌<\u002Ftext>\n    <rect x=\"40\" y=\"294\" width=\"200\" height=\"58\" rx=\"12\" fill=\"#E2ECFD\" stroke=\"#2563EB\"><\u002Frect><text x=\"140\" y=\"319\" fill=\"#2563EB\" font-size=\"14\">美元 DXY↑<\u002Ftext><text x=\"140\" y=\"338\" fill=\"#2563EB\" font-size=\"10.5\" font-weight=\"400\">利差撐 · 壓新興<\u002Ftext>\n    <rect x=\"660\" y=\"294\" width=\"200\" height=\"58\" rx=\"12\" fill=\"#ECEAE3\" stroke=\"#64748b\"><\u002Frect><text x=\"760\" y=\"319\" fill=\"#334155\" font-size=\"14\">美債殖利率↑<\u002Ftext><text x=\"760\" y=\"338\" fill=\"#475569\" font-size=\"10.5\" font-weight=\"400\">2Y4.2 · 10Y4.45 · 赤字<\u002Ftext>\n    <rect x=\"338\" y=\"398\" width=\"224\" height=\"64\" rx=\"13\" fill=\"#FBEEDC\" stroke=\"#D97706\" stroke-width=\"2.4\"><\u002Frect><text x=\"450\" y=\"425\" fill=\"#B45309\" font-size=\"16\">美股高估值 ↓<\u002Ftext><text x=\"450\" y=\"446\" fill=\"#B45309\" font-size=\"10.5\" font-weight=\"400\">FwdPE22.5 · PB5.4 · 折現壓縮<\u002Ftext>\n    <rect x=\"350\" y=\"502\" width=\"200\" height=\"58\" rx=\"12\" fill=\"#EEEAFB\" stroke=\"#7C3AED\"><\u002Frect><text x=\"450\" y=\"527\" fill=\"#6D28D9\" font-size=\"14\">AI 集中度 / capex<\u002Ftext><text x=\"450\" y=\"546\" fill=\"#6D28D9\" font-size=\"10.5\" font-weight=\"400\">前4大&gt;30% · capex≈現金流<\u002Ftext>\n    <\u002Fg>\n\n    <!-- 圖例 -->\n    <g font-size=\"10.5\" font-weight=\"500\">\n      <line x1=\"600\" y1=\"44\" x2=\"628\" y2=\"44\" stroke=\"#9F1D1D\" stroke-width=\"2\"><\u002Fline><text x=\"634\" y=\"48\" fill=\"#9F1D1D\" text-anchor=\"start\">推升風險<\u002Ftext>\n      <line x1=\"600\" y1=\"62\" x2=\"628\" y2=\"62\" stroke=\"#0F766E\" stroke-width=\"2\"><\u002Fline><text x=\"634\" y=\"66\" fill=\"#0F766E\" text-anchor=\"start\">壓制估值<\u002Ftext>\n      <line x1=\"710\" y1=\"44\" x2=\"738\" y2=\"44\" stroke=\"#9F1D1D\" stroke-width=\"1.4\" stroke-dasharray=\"5 4\"><\u002Fline><text x=\"744\" y=\"48\" fill=\"#9F1D1D\" text-anchor=\"start\">鷹派回饋<\u002Ftext>\n    <\u002Fg>\n  <\u002Fsvg>\n  <\u002Fdiv>\n  <div class=\"cap\" style=\"text-align:left;\">圖 0 · <b>多因子整合連動圖<\u002Fb>(單一全景):所有因子匯入中心「美股高估值」——地緣政治→油價→通膨→Fed,再經<span style=\"color:#0F766E\">殖利率/美元壓制估值<\u002Fspan>,AI 集中度為底部放大器;<span style=\"color:#9F1D1D\">紅=推升風險<\u002Fspan>、<span style=\"color:#0F766E\">青=壓制估值<\u002Fspan>、虛線=殖利率對 Fed 鷹派回饋<\u002Fdiv>\n\n  <!-- ===== 因子即時狀態盤 ===== -->\n  <h2><span class=\"n\">00<\u002Fspan>因子即時狀態盤<span class=\"v2\">refreshed · 2026/06/21<\u002Fspan><\u002Fh2>\n  <p>把連動網路上每個節點接到當前讀數與警戒線,一眼看哪些已轉紅(觸發)、哪些仍在安全區。狀態:🟢安全 / 🟡留意 / 🔴警戒。<\u002Fp>\n  <table>\n    <thead><tr><th style=\"width:24%\">因子節點<\u002Fth><th style=\"width:16%\">當前讀數<\u002Fth><th style=\"width:20%\">警戒線<\u002Fth><th style=\"width:10%\">狀態<\u002Fth><th>連動方向<\u002Fth><\u002Ftr><\u002Fthead>\n    <tbody>\n      <tr><td>Hormuz／Brent 油價<\u002Ftd><td>~$80<\u002Ftd><td>站上 $95 重啟<\u002Ftd><td><span class=\"pill p-amber\">🟡 留意<\u002Fspan><\u002Ftd><td>樞紐 → 通膨<\u002Ftd><\u002Ftr>\n      <tr><td>通膨 CPI / 核心<\u002Ftd><td>4.2% / 2.9%<\u002Ftd><td>核心黏 ≥3.3%<\u002Ftd><td><span class=\"pill p-amber\">🟡 留意<\u002Fspan><\u002Ftd><td>能源驅動,核心受控<\u002Ftd><\u002Ftr>\n      <tr><td>Fed 點陣圖中位<\u002Ftd><td>3.8%（轉鷹）<\u002Ftd><td>確認 2026 升息<\u002Ftd><td><span class=\"pill p-red\">🔴 警戒<\u002Fspan><\u002Ftd><td>升息上桌<\u002Ftd><\u002Ftr>\n      <tr><td>2 年期美債殖利率<\u002Ftd><td>~4.2%<\u002Ftd><td>升破 4.3–4.5%<\u002Ftd><td><span class=\"pill p-amber\">🟡 留意<\u002Fspan><\u002Ftd><td>傳導計,壓 AI 倍數<\u002Ftd><\u002Ftr>\n      <tr><td>美元 DXY<\u002Ftd><td>偏強<\u002Ftd><td>強勢突破<\u002Ftd><td><span class=\"pill p-amber\">🟡 留意<\u002Fspan><\u002Ftd><td>壓非美/新興<\u002Ftd><\u002Ftr>\n      <tr><td>AI 集中度（前4大）<\u002Ftd><td>&gt;30% S&amp;P<\u002Ftd><td>廣度 &lt;20% 出超<\u002Ftd><td><span class=\"pill p-red\">🔴 警戒<\u002Fspan><\u002Ftd><td>指數反噬風險<\u002Ftd><\u002Ftr>\n      <tr><td>AI capex / 現金流<\u002Ftd><td>~100% · 債 $1.2T<\u002Ftd><td>capex &gt;現金流<\u002Ftd><td><span class=\"pill p-red\">🔴 警戒<\u002Fspan><\u002Ftd><td>債務融資擴張<\u002Ftd><\u002Ftr>\n      <tr><td>就業（白領）<\u002Ftd><td>31 月收縮<\u002Ftd><td>初領 &gt;260k<\u002Ftd><td><span class=\"pill p-amber\">🟡 留意<\u002Fspan><\u002Ftd><td>消費→獲利鏈<\u002Ftd><\u002Ftr>\n      <tr><td>科技基金流向<\u002Ftd><td>+$21.46B（紀錄）<\u002Ftd><td>轉流出<\u002Ftd><td><span class=\"pill p-teal\">🟢 安全<\u002Fspan><\u002Ftd><td>主線仍在<\u002Ftd><\u002Ftr>\n      <tr><td>關稅有效稅率<\u002Ftd><td>7–13%（重置後）<\u002Ftd><td>升回 15%+<\u002Ftd><td><span class=\"pill p-teal\">🟢 安全<\u002Fspan><\u002Ftd><td>+0.5–0.8pp 核心<\u002Ftd><\u002Ftr>\n    <\u002Ftbody>\n  <\u002Ftable>\n  <div class=\"note\"><b>本輪刷新重點:<\u002Fb>三盞紅燈集中在「Fed 轉鷹 + AI 集中度/capex」——即連動圖<b>右半邊<\u002Fb>(升息→折現率壓縮→高估值股)已就位;左半邊(油價/通膨)仍黃燈待 Hormuz 確認。下一個二元事件:FOMC 7/28–29、Micron 財報 6/24。<\u002Fdiv>\n\n  <h2><span class=\"n\">01<\u002Fspan>三股力量框架<\u002Fh2>\n  <p>三份分析其實是同一條因果鏈的三段。下圖把它畫成一張戰情圖:兩股對沖力量夾著美股高估值,期中選舉在底下當放大器。左邊(青)把估值往上撐,右邊(紅)把估值往下壓,底下(紫)的選舉把上面兩股力量的政策風險放大。<\u002Fp>\n\n  <div class=\"fig\">\n  <svg viewBox=\"-50 0 820 312\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"'DM Sans','Noto Sans TC',sans-serif\">\n    <title>美股高估值的三股力量框架圖<\u002Ftitle>\n    <defs>\n      <marker id=\"aT\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M2 1L8 5L2 9\" fill=\"none\" stroke=\"#0F766E\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fmarker>\n      <marker id=\"aR\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M2 1L8 5L2 9\" fill=\"none\" stroke=\"#9F1D1D\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fmarker>\n      <marker id=\"aP\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M2 1L8 5L2 9\" fill=\"none\" stroke=\"#7C3AED\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fmarker>\n    <\u002Fdefs>\n\n    <!-- 箭頭(壓節點下) -->\n    <line x1=\"153\" y1=\"92\" x2=\"285\" y2=\"124\" stroke=\"#0F766E\" stroke-width=\"1.8\" marker-end=\"url(#aT)\"><\u002Fline>\n    <line x1=\"567\" y1=\"92\" x2=\"435\" y2=\"124\" stroke=\"#9F1D1D\" stroke-width=\"1.8\" marker-end=\"url(#aR)\"><\u002Fline>\n    <line x1=\"360\" y1=\"246\" x2=\"360\" y2=\"226\" stroke=\"#7C3AED\" stroke-width=\"1.8\" marker-end=\"url(#aP)\"><\u002Fline>\n    <text x=\"214\" y=\"112\" text-anchor=\"middle\" fill=\"#0F766E\" font-size=\"10.5\" font-weight=\"600\">支撐<\u002Ftext>\n    <text x=\"506\" y=\"112\" text-anchor=\"middle\" fill=\"#9F1D1D\" font-size=\"10.5\" font-weight=\"600\">壓制<\u002Ftext>\n    <text x=\"392\" y=\"240\" text-anchor=\"start\" fill=\"#6D28D9\" font-size=\"10.5\" font-weight=\"600\">放大<\u002Ftext>\n\n    <!-- 政治降風險 -->\n    <rect x=\"28\" y=\"26\" width=\"252\" height=\"66\" rx=\"9\" fill=\"#E1F0EC\" stroke=\"#0F766E\" stroke-width=\"1.2\"><\u002Frect>\n    <text x=\"154\" y=\"50\" text-anchor=\"middle\" fill=\"#0F766E\" font-size=\"14\" font-weight=\"700\">政治降風險(撐)<\u002Ftext>\n    <text x=\"154\" y=\"69\" text-anchor=\"middle\" fill=\"#0F766E\" font-size=\"10.5\">伊朗 MOU · 油價回落 ~$80<\u002Ftext>\n    <text x=\"154\" y=\"85\" text-anchor=\"middle\" fill=\"#3f766e\" font-size=\"10.5\">戰爭風險溢價↓ · 降息預期<\u002Ftext>\n\n    <!-- 貨幣升風險 -->\n    <rect x=\"440\" y=\"26\" width=\"252\" height=\"66\" rx=\"9\" fill=\"#F5E3E3\" stroke=\"#9F1D1D\" stroke-width=\"1.2\"><\u002Frect>\n    <text x=\"566\" y=\"50\" text-anchor=\"middle\" fill=\"#9F1D1D\" font-size=\"14\" font-weight=\"700\">貨幣升風險(壓)<\u002Ftext>\n    <text x=\"566\" y=\"69\" text-anchor=\"middle\" fill=\"#9F1D1D\" font-size=\"10.5\">華許偏鷹 · 點陣圖 3.8% · 升息上桌<\u002Ftext>\n    <text x=\"566\" y=\"85\" text-anchor=\"middle\" fill=\"#b04545\" font-size=\"10.5\">2Y 4.2% · 美元強 · 折現壓縮<\u002Ftext>\n\n    <!-- 美股高估值(中心) -->\n    <rect x=\"235\" y=\"124\" width=\"250\" height=\"64\" rx=\"9\" fill=\"#FBEEDC\" stroke=\"#D97706\" stroke-width=\"2\"><\u002Frect>\n    <text x=\"360\" y=\"150\" text-anchor=\"middle\" fill=\"#B45309\" font-size=\"16\" font-weight=\"700\">美股高估值<\u002Ftext>\n    <text x=\"360\" y=\"170\" text-anchor=\"middle\" fill=\"#B45309\" font-size=\"10.5\">SPY 746.74 · FwdPE 22.5 · PB 5.4<\u002Ftext>\n    <text x=\"360\" y=\"184\" text-anchor=\"middle\" fill=\"#b4823a\" font-size=\"10.5\">資金流支撐,容錯率低<\u002Ftext>\n\n    <!-- 四支柱(必須同時成立) -->\n    <text x=\"195\" y=\"216\" text-anchor=\"end\" fill=\"#475569\" font-size=\"10\" font-weight=\"600\">四支柱<\u002Ftext>\n    <g font-size=\"10.5\" font-weight=\"600\" text-anchor=\"middle\">\n      <rect x=\"202\" y=\"200\" width=\"78\" height=\"26\" rx=\"6\" fill=\"#f6e2e2\" stroke=\"#e3b9b9\"><\u002Frect><text x=\"241\" y=\"216\" fill=\"#9F1D1D\">低利率 🔴<\u002Ftext>\n      <rect x=\"286\" y=\"200\" width=\"78\" height=\"26\" rx=\"6\" fill=\"#fbeed8\" stroke=\"#e4cf9a\"><\u002Frect><text x=\"325\" y=\"216\" fill=\"#B45309\">低油價 🟡<\u002Ftext>\n      <rect x=\"370\" y=\"200\" width=\"78\" height=\"26\" rx=\"6\" fill=\"#dcefe9\" stroke=\"#b6ddd3\"><\u002Frect><text x=\"409\" y=\"216\" fill=\"#0F766E\">強獲利 🟢<\u002Ftext>\n      <rect x=\"454\" y=\"200\" width=\"78\" height=\"26\" rx=\"6\" fill=\"#fbeed8\" stroke=\"#e4cf9a\"><\u002Frect><text x=\"493\" y=\"216\" fill=\"#B45309\">AI成長 🟡<\u002Ftext>\n    <\u002Fg>\n\n    <!-- 期中選舉(放大器) -->\n    <rect x=\"235\" y=\"246\" width=\"250\" height=\"52\" rx=\"9\" fill=\"#EEEAFB\" stroke=\"#7C3AED\" stroke-width=\"1.2\"><\u002Frect>\n    <text x=\"360\" y=\"270\" text-anchor=\"middle\" fill=\"#6D28D9\" font-size=\"14\" font-weight=\"700\">期中選舉(11/3)<\u002Ftext>\n    <text x=\"360\" y=\"287\" text-anchor=\"middle\" fill=\"#6D28D9\" font-size=\"10.5\">放大 Fed／油價／政策風險溢價<\u002Ftext>\n  <\u002Fsvg>\n  <\u002Fdiv>\n  <div class=\"cap\">圖 1 · 三股力量框架:<span style=\"color:#0F766E\">政治降風險(撐)<\u002Fspan>／<span style=\"color:#9F1D1D\">貨幣升風險(壓)<\u002Fspan>夾住「美股高估值」,<span style=\"color:#6D28D9\">期中選舉<\u002Fspan>在底部放大;中間<b>四支柱須同時成立<\u002Fb>——目前低利率已轉紅、低油價/AI 黃燈<\u002Fdiv>\n\n  <p>撐住中間那顆「美股高估值」的,是四根支柱必須同時成立:<b>低利率、低油價、強獲利、AI 成長<\u002Fb>。破任一根,回檔就很快——破壞方式主要是兩條傳導鏈:<\u002Fp>\n  <table>\n    <thead><tr><th style=\"width:22%\">傳導鏈<\u002Fth><th>路徑<\u002Fth><\u002Ftr><\u002Fthead>\n    <tbody>\n      <tr><td><span class=\"pill p-red\">利率鏈<\u002Fspan><\u002Ftd><td>油價或核心通膨沒降 → Fed 更鷹 → 2 年期美債上行 → 高 duration／AI 估值壓縮 → 資金由追高轉避險。<\u002Ftd><\u002Ftr>\n      <tr><td><span class=\"pill p-amber\">AI 自噬鏈<\u002Fspan><\u002Ftd><td>AI 仍有營收,但 capex(hyperscaler 2026 估約 7,700 億,逼近營運現金流)吃掉自由現金流 → 市場質疑投報率 → 科技集中度反噬指數。<\u002Ftd><\u002Ftr>\n    <\u002Ftbody>\n  <\u002Ftable>\n\n  <h2><span class=\"n\">02<\u002Fspan>風險矩陣：機率 × 殺傷力<\u002Fh2>\n  <p>把會觸動上述兩條鏈的事件,全部擺進「機率 × 殺傷力」矩陣,就能看出哪些是真正該盯的。紅點＝殺傷力高,灰點＝中等;右上角是「機率高又殺傷重」的當務之急,左上角是「平常不會發生、一發生就重傷」的尾端風險。<\u002Fp>\n  <table>\n    <thead><tr><th style=\"width:7%\">#<\u002Fth><th style=\"width:33%\">風險事件<\u002Fth><th style=\"width:12%\">機率<\u002Fth><th style=\"width:12%\">殺傷力<\u002Fth><th>落點含意<\u002Fth><\u002Ftr><\u002Fthead>\n    <tbody>\n      <tr><td>1<\u002Ftd><td>Fed 重新偏鷹／升息定價<\u002Ftd><td>中高<\u002Ftd><td><span class=\"pill p-red\">高<\u002Fspan><\u002Ftd><td><b>最危險<\u002Fb>——單一最大風險,利率鏈起點<\u002Ftd><\u002Ftr>\n      <tr><td>2<\u002Ftd><td>AI capex 投報率被質疑<\u002Ftd><td>中<\u002Ftd><td><span class=\"pill p-red\">高<\u002Fspan><\u002Ftd><td>科技股核心風險,AI 自噬鏈起點<\u002Ftd><\u002Ftr>\n      <tr><td>3<\u002Ftd><td>油價重新上攻<\u002Ftd><td>中<\u002Ftd><td><span class=\"pill p-red\">高<\u002Fspan><\u002Ftd><td>同時打通膨＋Fed,破壞停火紅利<\u002Ftd><\u002Ftr>\n      <tr><td>4<\u002Ftd><td>科技基金轉流出<\u002Ftd><td>中<\u002Ftd><td><span class=\"pill p-slate\">中高<\u002Fspan><\u002Ftd><td>高估值快速修正的先行訊號<\u002Ftd><\u002Ftr>\n      <tr><td>5<\u002Ftd><td>期中選舉政策風險<\u002Ftd><td>中<\u002Ftd><td><span class=\"pill p-slate\">中<\u002Fspan><\u002Ftd><td>放大器,推升風險溢價<\u002Ftd><\u002Ftr>\n      <tr><td>6<\u002Ftd><td>伊朗協議破裂<\u002Ftd><td>中低<\u002Ftd><td><span class=\"pill p-red\">很高<\u002Fspan><\u002Ftd><td><b>尾端風險<\u002Fb>——機率低但殺傷最大<\u002Ftd><\u002Ftr>\n      <tr><td>7<\u002Ftd><td>美元強升<\u002Ftd><td>中<\u002Ftd><td><span class=\"pill p-slate\">中高<\u002Fspan><\u002Ftd><td>壓新興市場與跨國企業估值<\u002Ftd><\u002Ftr>\n      <tr><td>8<\u002Ftd><td>信用利差擴大<\u002Ftd><td>中低<\u002Ftd><td><span class=\"pill p-red\">高<\u002Fspan><\u002Ftd><td>從估值修正升級成信用風險<\u002Ftd><\u002Ftr>\n    <\u002Ftbody>\n  <\u002Ftable>\n\n  <h2><span class=\"n\">03<\u002Fspan>當前市場狀態<\u002Fh2>\n  <table>\n    <thead><tr><th style=\"width:18%\">力量<\u002Fth><th style=\"width:46%\">內容<\u002Fth><th>市場效果<\u002Fth><\u002Ftr><\u002Fthead>\n    <tbody>\n      <tr><td><span class=\"pill p-teal\">政治降風險<\u002Fspan><\u002Ftd><td>伊朗停火 → 14 點 MOU → 60 天談判;油價回落<\u002Ftd><td>股漲、債反彈、油跌,戰爭風險溢價消退<\u002Ftd><\u002Ftr>\n      <tr><td><span class=\"pill p-red\">貨幣升風險<\u002Fspan><\u002Ftd><td>華許首場 FOMC 維持 3.50–3.75% 但偏鷹、取消前瞻指引、升息上桌<\u002Ftd><td>美元／短端認真定價偏鷹;黃金、比特幣受壓<\u002Ftd><\u002Ftr>\n    <\u002Ftbody>\n  <\u002Ftable>\n  <p><b>結論:不是全面 risk-on,而是分裂市場<\u002Fb>——股票買和平紅利,但匯率／利率敏感資產更認真看 Fed。資金流呈三層擴散結構,非單押大型科技:<\u002Fp>\n  <table>\n    <thead><tr><th style=\"width:16%\">層級<\u002Fth><th style=\"width:44%\">方向<\u002Fth><th>含意<\u002Fth><\u002Ftr><\u002Fthead>\n    <tbody>\n      <tr><td>第一層<\u002Ftd><td>科技／AI(科技基金單週 +214.6 億,創紀錄)<\u002Ftd><td>主線仍在<\u002Ftd><\u002Ftr>\n      <tr><td>第二層<\u002Ftd><td>小型股 +65.2 億、中型股<\u002Ftd><td>押「景氣不硬著陸」<\u002Ftd><\u002Ftr>\n      <tr><td>第三層<\u002Ftd><td>工業／金融／金屬礦業<\u002Ftd><td>窄基多頭 → 擴散多頭<\u002Ftd><\u002Ftr>\n    <\u002Ftbody>\n  <\u002Ftable>\n  <div class=\"note\"><b>白話解讀:<\u002Fb>同一週,投資人一邊把錢買進股票(股票基金 +383.7 億),一邊又把更多錢放進「幾乎零風險」的貨幣市場基金(+532.5 億,等於存現金生利息)。代表大家有進場、但<b>手上仍留著大筆現金、不是把錢全押進股市<\u002Fb>——心態積極但保留退路。另外,這波是中小型股與科技股(QQQ、IWM)漲得比大盤(SPY)兇,也就是<b>反彈有在「擴散」、不只靠少數權值股<\u002Fb>。<\u002Fdiv>\n\n  <h2><span class=\"n\">04<\u002Fspan>期中選舉情境（11/3）<\u002Fh2>\n  <table>\n    <thead><tr><th style=\"width:26%\">情境<\u002Fth><th style=\"width:24%\">高估值風險<\u002Fth><th>理由<\u002Fth><\u002Ftr><\u002Fthead>\n    <tbody>\n      <tr><td>分裂國會(基準)<\u002Ftd><td><span class=\"pill p-slate\">中性偏小利多<\u002Fspan><\u002Ftd><td>極端政策難過,但選前風險溢價上升<\u002Ftd><\u002Ftr>\n      <tr><td>共和黨雙控<\u002Ftd><td><span class=\"pill p-amber\">短多中空<\u002Fspan><\u002Ftd><td>企業友善預期 vs 赤字／通膨推升長端利率<\u002Ftd><\u002Ftr>\n      <tr><td>民主黨雙控<\u002Ftd><td><span class=\"pill p-red\">偏空<\u002Fspan><\u002Ftd><td>科技／能源／金融監管風險溢價上升<\u002Ftd><\u002Ftr>\n    <\u002Ftbody>\n  <\u002Ftable>\n  <div class=\"note\"><b>最毒組合:<\u002Fb>民主黨藍潮機率上升 ＋ Fed 偏鷹 ＋ 核心通膨黏著 ＋ AI 財報被質疑(選舉與貨幣／通膨共振)。<\u002Fdiv>\n\n  <h2><span class=\"n\">05<\u002Fspan>未來半年風險時間軸<\u002Fh2>\n  <table>\n    <thead><tr><th style=\"width:12%\">時間<\u002Fth><th style=\"width:42%\">主要事件<\u002Fth><th>觸發風險<\u002Fth><\u002Ftr><\u002Fthead>\n    <tbody>\n      <tr><td>2026/07<\u002Ftd><td>CPI／PCE／就業、FOMC 前定價<\u002Ftd><td>通膨超預期 → 升息預期回來<\u002Ftd><\u002Ftr>\n      <tr><td>2026/08<\u002Ftd><td>美伊 60 天談判窗口<\u002Ftd><td>核查／霍姆茲卡住 → 油價回升<\u002Ftd><\u002Ftr>\n      <tr><td>2026/09<\u002Ftd><td>FOMC、Q3 財報前<\u002Ftd><td>Fed 偏鷹 → 估值壓縮<\u002Ftd><\u002Ftr>\n      <tr><td>2026/10<\u002Ftd><td>大型科技財報、AI capex 檢驗<\u002Ftd><td>capex 高但現金流不夠 → AI 修正<\u002Ftd><\u002Ftr>\n      <tr><td>2026/11<\u002Ftd><td>期中選舉<\u002Ftd><td>政策不確定性、避險需求上升<\u002Ftd><\u002Ftr>\n      <tr><td>2026/12<\u002Ftd><td>FOMC、年底再平衡<\u002Ftd><td>暗示 2027 仍高利率 → 再壓估值<\u002Ftd><\u002Ftr>\n    <\u002Ftbody>\n  <\u002Ftable>\n\n  <h2><span class=\"n\">06<\u002Fspan>警戒儀表板（10 指標）<\u002Fh2>\n  <table>\n    <thead><tr><th style=\"width:46%\">指標<\u002Fth><th>偏空警戒線<\u002Fth><\u002Ftr><\u002Fthead>\n    <tbody>\n      <tr><td>川普 approval／獨立選民<\u002Ftd><td>持續 &lt;40%<\u002Ftd><\u002Ftr>\n      <tr><td>2 年期美債<\u002Ftd><td>升破 4.3–4.5%<\u002Ftd><\u002Ftr>\n      <tr><td>核心 PCE<\u002Ftd><td>年增黏在 3% 以上<\u002Ftd><\u002Ftr>\n      <tr><td>WTI／Brent<\u002Ftd><td>WTI 88–90 / Brent 100+<\u002Ftd><\u002Ftr>\n      <tr><td>30 年房貸<\u002Ftd><td>黏在 6.5% 以上<\u002Ftd><\u002Ftr>\n      <tr><td>DXY<\u002Ftd><td>強勢突破<\u002Ftd><\u002Ftr>\n      <tr><td>VIX<\u002Ftd><td>不降反升／破 20<\u002Ftd><\u002Ftr>\n      <tr><td>QQQ ÷ SPY 相對強弱<\u002Ftd><td>QQQ 轉弱(AI 主線動搖)<\u002Ftd><\u002Ftr>\n      <tr><td>IWM ÷ SPY 相對強弱<\u002Ftd><td>小型股反彈失敗(廣度惡化)<\u002Ftd><\u002Ftr>\n      <tr><td>科技基金流向<\u002Ftd><td>由流入轉流出<\u002Ftd><\u002Ftr>\n    <\u002Ftbody>\n  <\u002Ftable>\n\n  <h2><span class=\"n\">07<\u002Fspan>操作判斷<\u002Fh2>\n  <table>\n    <thead><tr><th style=\"width:18%\">類別<\u002Fth><th>判斷<\u002Fth><\u002Ftr><\u002Fthead>\n    <tbody>\n      <tr><td><span class=\"pill p-teal\">主線<\u002Fspan><\u002Ftd><td>高品質 AI／半導體／強現金流科技——可留,但不無風控追高<\u002Ftd><\u002Ftr>\n      <tr><td><span class=\"pill p-blue\">補漲<\u002Fspan><\u002Ftd><td>工業／金融／運輸／部分小型股——僅在利率不升時有續航<\u002Ftd><\u002Ftr>\n      <tr><td><span class=\"pill p-slate\">防守<\u002Fspan><\u002Ftd><td>短債、現金、高品質股——須保留,修正會很快<\u002Ftd><\u002Ftr>\n      <tr><td><span class=\"pill p-amber\">對沖<\u002Fspan><\u002Ftd><td>黃金／能源／軍工少量保留尾端風險<\u002Ftd><\u002Ftr>\n      <tr><td><span class=\"pill p-red\">避免<\u002Fspan><\u002Ftd><td>無獲利高估值、過度槓桿、只靠故事沒現金流的 AI 概念股<\u002Ftd><\u002Ftr>\n    <\u002Ftbody>\n  <\u002Ftable>\n  <p>一句話:從「追漲」改成「高估值風控」;未來半年從「資金流推升估值」進入「事件／政策檢驗估值」階段。<\u002Fp>\n\n  <h2><span class=\"n\">08<\u002Fspan>奈許平衡：反覆測試<\u002Fh2>\n  <p>把六方博弈疊在市場上,系統會繞著一個平衡點打轉——在這個平衡裡,沒有任何一方能<b>單方面<\u002Fb>改變策略而讓自己更好,所以它會持續、反覆地被測試。市場特徵是<b>「高不確定性 × 高利率 × 高美元 × 高政治敘事」<\u002Fb>,資金結構偏向「四強三弱」:<\u002Fp>\n  <table>\n    <thead><tr><th style=\"width:24%\">結構<\u002Fth><th>資產<\u002Fth><\u002Ftr><\u002Fthead>\n    <tbody>\n      <tr><td><span class=\"pill p-teal\">四強<\u002Fspan><\u002Ftd><td>美元、黃金、能源、波動率(VIX／MOVE)<\u002Ftd><\u002Ftr>\n      <tr><td><span class=\"pill p-red\">三弱<\u002Fspan><\u002Ftd><td>科技股(尤其無獲利高估值)、美債(尤其 2 年期)、非美市場<\u002Ftd><\u002Ftr>\n    <\u002Ftbody>\n  <\u002Ftable>\n  <div class=\"note\"><b>連動回主線:<\u002Fb>「奈許平衡」就是 §01 兩條傳導鏈的政治版本——<span class=\"lk\">利率鏈 §01<\u002Fspan> 對應估值壓縮、尾端風險 <span class=\"lk\">§02 #6<\u002Fspan> 對應全面避險。政治盤反覆測試的,正是首頁連動圖右下角那三個分流會被推到哪一個。<\u002Fdiv>\n\n  <h2><span class=\"n\">09<\u002Fspan>事件更新時間軸<span class=\"v2\">append · 只增不減<\u002Fspan><\u002Fh2>\n  <p>把今年關鍵節點放在同一條線上,看出五個新變數其實是同一個回饋環的不同時點:關稅法規重置 → 美伊戰爭 → 停火 → MOU/FOMC 同日引爆 → 談判延期。<\u002Fp>\n  <table>\n    <thead><tr><th style=\"width:14%\">日期<\u002Fth><th style=\"width:40%\">事件<\u002Fth><th>市場/政策含意<\u002Fth><\u002Ftr><\u002Fthead>\n    <tbody>\n      <tr><td>2026/02/20<\u002Ftd><td>最高院 6-3 裁定 IEEPA 不授權對等關稅,「解放日」關稅違憲(2/24 生效終止)<\u002Ftd><td>已收 $166–179B 待退;關稅法源重置<\u002Ftd><\u002Ftr>\n      <tr><td>2026/02/24<\u002Ftd><td>改依 §122 課 10% 全球關稅(150 天上限、擬升 15%)+ §232 鋼鋁/車維持<\u002Ftd><td>Bessent:2026 關稅收入「幾乎不變」<\u002Ftd><\u002Ftr>\n      <tr><td>2026/02/28<\u002Ftd><td>美以聯合空襲,美伊戰爭開打<\u002Ftd><td>油價衝向 Brent ~$118–120(3月)<\u002Ftd><\u002Ftr>\n      <tr><td>2026/04<\u002Ftd><td>首次停火<\u002Ftd><td>油價自峰值回落起點<\u002Ftd><\u002Ftr>\n      <tr><td>2026/06/10<\u002Ftd><td>5 月 CPI +4.2% YoY(三年高)、核心 2.9%;能源佔月增逾 60%<\u002Ftd><td>通膨由能源驅動,核心相對受控<\u002Ftd><\u002Ftr>\n      <tr><td>2026/06/17<\u002Ftd><td>凡爾賽 14 點 MOU(60 天窗口、Hormuz 重開)+ <b>同日<\u002Fb> FOMC 維持 3.50–3.75%、點陣圖轉鷹(中位 3.8%)<\u002Ftd><td>政治降風險＋貨幣升風險同日引爆;2Y +16bp→4.2%<\u002Ftd><\u002Ftr>\n      <tr><td>2026/06/18–19<\u002Ftd><td>瑞士談判延期、萬斯取消行程、以─真主黨續戰;Hormuz 仍需德黑蘭核准<\u002Ftd><td>停火脆弱,尾端風險未除<\u002Ftd><\u002Ftr>\n    <\u002Ftbody>\n  <\u002Ftable>\n\n  <h2><span class=\"n\">10<\u002Fspan>因果回饋網路（政治↔貨幣矛盾環）<span class=\"v2\">reworked<\u002Fspan><\u002Fh2>\n  <p>核心矛盾講清楚:<b>川普要降息撐股價,但他自己的關稅戰＋美伊戰爭推升通貨膨脹<\u002Fb>,逼新任 聯準會主席華許(接替鮑威爾)轉鷹——政治意圖與貨幣後果互相打架,形成一個自我矛盾的回饋環。Hormuz/油價是樞紐,AI replacement 從就業端加壓。<\u002Fp>\n  <div class=\"fig\">\n  <svg viewBox=\"0 0 820 470\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"'DM Sans','Noto Sans TC',sans-serif\">\n    <title>政治↔貨幣矛盾回饋環<\u002Ftitle>\n    <desc>川普政策一面要降息撐股、一面以關稅與美伊戰爭推升通貨膨脹,逼華許Fed轉鷹,殖利率上行壓高估值股,與降息初衷矛盾。<\u002Fdesc>\n    <defs>\n      <marker id=\"cp\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M2 1L8 5L2 9\" fill=\"none\" stroke=\"#9F1D1D\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fmarker>\n      <marker id=\"cn\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M2 1L8 5L2 9\" fill=\"none\" stroke=\"#0F766E\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fmarker>\n      <marker id=\"cx\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6.5\" markerHeight=\"6.5\" orient=\"auto-start-reverse\"><path d=\"M2 1L8 5L2 9\" fill=\"none\" stroke=\"#7C3AED\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fmarker>\n    <\u002Fdefs>\n\n    <!-- 川普政策中樞 -->\n    <rect x=\"300\" y=\"24\" width=\"220\" height=\"60\" rx=\"11\" fill=\"#EEEAFB\" stroke=\"#7C3AED\" stroke-width=\"1.4\"><\u002Frect>\n    <text x=\"410\" y=\"50\" text-anchor=\"middle\" fill=\"#6D28D9\" font-size=\"15.5\" font-weight=\"700\">川普政策<\u002Ftext>\n    <text x=\"410\" y=\"70\" text-anchor=\"middle\" fill=\"#6D28D9\" font-size=\"12\">要降息撐股 ⚔ 政策卻推通貨膨脹<\u002Ftext>\n\n    <!-- 左：降息訴求(挺股) -->\n    <rect x=\"40\" y=\"150\" width=\"200\" height=\"58\" rx=\"10\" fill=\"#E1F0EC\" stroke=\"#0F766E\" stroke-width=\"1.2\"><\u002Frect>\n    <text x=\"140\" y=\"174\" text-anchor=\"middle\" fill=\"#0F766E\" font-size=\"14\" font-weight=\"600\">降息訴求（挺股價）<\u002Ftext>\n    <text x=\"140\" y=\"193\" text-anchor=\"middle\" fill=\"#0F766E\" font-size=\"11.5\">施壓 Fed · 撐高估值<\u002Ftext>\n\n    <!-- 右上：關稅戰 -->\n    <rect x=\"580\" y=\"150\" width=\"200\" height=\"58\" rx=\"10\" fill=\"#FBEEDC\" stroke=\"#D97706\" stroke-width=\"1.2\"><\u002Frect>\n    <text x=\"680\" y=\"174\" text-anchor=\"middle\" fill=\"#B45309\" font-size=\"14\" font-weight=\"600\">關稅戰 7–13%<\u002Ftext>\n    <text x=\"680\" y=\"193\" text-anchor=\"middle\" fill=\"#B45309\" font-size=\"11.5\">+0.5–0.8pp 核心通貨膨脹<\u002Ftext>\n\n    <!-- 中上：美伊戰爭→油價 -->\n    <rect x=\"310\" y=\"150\" width=\"200\" height=\"58\" rx=\"10\" fill=\"#FBEEDC\" stroke=\"#D97706\" stroke-width=\"1.4\"><\u002Frect>\n    <text x=\"410\" y=\"174\" text-anchor=\"middle\" fill=\"#B45309\" font-size=\"14\" font-weight=\"700\">美伊戰爭 → 油價↑<\u002Ftext>\n    <text x=\"410\" y=\"193\" text-anchor=\"middle\" fill=\"#B45309\" font-size=\"11.5\">Hormuz 樞紐 · Brent ~$80<\u002Ftext>\n\n    <!-- 通貨膨脹 -->\n    <rect x=\"310\" y=\"258\" width=\"200\" height=\"58\" rx=\"10\" fill=\"#F5E3E3\" stroke=\"#9F1D1D\" stroke-width=\"1.4\"><\u002Frect>\n    <text x=\"410\" y=\"282\" text-anchor=\"middle\" fill=\"#9F1D1D\" font-size=\"15\" font-weight=\"700\">通貨膨脹 CPI 4.2%<\u002Ftext>\n    <text x=\"410\" y=\"301\" text-anchor=\"middle\" fill=\"#9F1D1D\" font-size=\"11.5\">核心 2.9%<\u002Ftext>\n\n    <!-- 華許 Fed -->\n    <rect x=\"310\" y=\"358\" width=\"200\" height=\"58\" rx=\"10\" fill=\"#F5E3E3\" stroke=\"#9F1D1D\" stroke-width=\"1.4\"><\u002Frect>\n    <text x=\"410\" y=\"382\" text-anchor=\"middle\" fill=\"#9F1D1D\" font-size=\"14.5\" font-weight=\"700\">Fed 華許（鷹派）<\u002Ftext>\n    <text x=\"410\" y=\"401\" text-anchor=\"middle\" fill=\"#9F1D1D\" font-size=\"11\">鮑威爾→華許 · 點陣圖 3.8%<\u002Ftext>\n\n    <!-- 左下：高估值股↓ -->\n    <rect x=\"40\" y=\"358\" width=\"200\" height=\"58\" rx=\"10\" fill=\"#F5E3E3\" stroke=\"#9F1D1D\" stroke-width=\"1.1\"><\u002Frect>\n    <text x=\"140\" y=\"382\" text-anchor=\"middle\" fill=\"#9F1D1D\" font-size=\"14\" font-weight=\"600\">高估值股 ↓<\u002Ftext>\n    <text x=\"140\" y=\"401\" text-anchor=\"middle\" fill=\"#9F1D1D\" font-size=\"11.5\">殖利率↑ 折現率壓縮<\u002Ftext>\n\n    <!-- 右下：AI replacement -->\n    <rect x=\"580\" y=\"358\" width=\"200\" height=\"58\" rx=\"10\" fill=\"#EEEAFB\" stroke=\"#7C3AED\" stroke-width=\"1.1\"><\u002Frect>\n    <text x=\"680\" y=\"382\" text-anchor=\"middle\" fill=\"#6D28D9\" font-size=\"14\" font-weight=\"600\">AI replacement<\u002Ftext>\n    <text x=\"680\" y=\"401\" text-anchor=\"middle\" fill=\"#6D28D9\" font-size=\"11.5\">白領就業↓ → 消費/獲利↓<\u002Ftext>\n\n    <!-- edges · 正交直角路由,不與任何節點重疊,箭頭對準框邊中心 -->\n    <!-- 川普 → 降息訴求(挺股):下→左→下,入頂邊中心 -->\n    <path d=\"M350 84 V117 H140 V150\" fill=\"none\" stroke=\"#0F766E\" stroke-width=\"1.5\" marker-end=\"url(#cn)\"><\u002Fpath>\n    <!-- 川普 → 美伊戰爭:直下,入頂邊中心 -->\n    <path d=\"M410 84 V150\" fill=\"none\" stroke=\"#9F1D1D\" stroke-width=\"1.5\" marker-end=\"url(#cp)\"><\u002Fpath>\n    <!-- 川普 → 關稅戰:下→右→下,入頂邊中心 -->\n    <path d=\"M470 84 V117 H680 V150\" fill=\"none\" stroke=\"#9F1D1D\" stroke-width=\"1.5\" marker-end=\"url(#cp)\"><\u002Fpath>\n    <!-- 美伊戰爭 → 通貨膨脹:直下,入頂邊中心 -->\n    <path d=\"M410 208 V258\" fill=\"none\" stroke=\"#9F1D1D\" stroke-width=\"1.6\" marker-end=\"url(#cp)\"><\u002Fpath>\n    <!-- 關稅戰 → 通貨膨脹:下→左,入右邊中心 -->\n    <path d=\"M680 226 V287 H513\" fill=\"none\" stroke=\"#9F1D1D\" stroke-width=\"1.4\" marker-end=\"url(#cp)\"><\u002Fpath>\n    <!-- 通貨膨脹 → Fed:直下,入頂邊中心 -->\n    <path d=\"M410 316 V358\" fill=\"none\" stroke=\"#9F1D1D\" stroke-width=\"1.6\" marker-end=\"url(#cp)\"><\u002Fpath>\n    <!-- Fed → 高估值股:直左,入右邊中心 -->\n    <path d=\"M310 387 H244\" fill=\"none\" stroke=\"#9F1D1D\" stroke-width=\"1.5\" marker-end=\"url(#cp)\"><\u002Fpath>\n    <!-- Fed → AI replacement:直右,入左邊中心 -->\n    <path d=\"M510 387 H576\" fill=\"none\" stroke=\"#7C3AED\" stroke-width=\"1.4\" marker-end=\"url(#cx)\"><\u002Fpath>\n    <!-- 矛盾回饋(虛線):高估值股 → 降息訴求,沿左欄直上,入底邊中心 -->\n    <path d=\"M140 358 V212\" fill=\"none\" stroke=\"#7C3AED\" stroke-width=\"1.5\" stroke-dasharray=\"6 4\" marker-end=\"url(#cx)\" opacity=\"0.85\"><\u002Fpath>\n    <rect x=\"86\" y=\"270\" width=\"108\" height=\"34\" rx=\"4\" fill=\"#fff\" opacity=\"0.82\"><\u002Frect>\n    <text x=\"140\" y=\"284\" text-anchor=\"middle\" fill=\"#6D28D9\" font-size=\"10.5\" font-weight=\"700\">矛盾回饋<\u002Ftext>\n    <text x=\"140\" y=\"298\" text-anchor=\"middle\" fill=\"#6D28D9\" font-size=\"9\">挺股初衷被自身通貨膨脹打臉<\u002Ftext>\n  <\u002Fsvg>\n  <\u002Fdiv>\n  <div class=\"cap\">圖 4 · 紅＝升通貨膨脹/升風險　青＝降息訴求(挺股)　紫＝矛盾回饋與 AI 就業衝擊;川普一面要降息、一面以關稅與美伊戰爭推通貨膨脹,逼華許轉鷹<\u002Fdiv>\n\n  <h2><span class=\"n\">10b<\u002Fspan>川普第二任政策 · 順序 / 意圖 / 行動成敗 / 副作用 / 衝擊面<span class=\"v2\">structured<\u002Fspan><\u002Fh2>\n  <p>川普第二任上任以來,政策有<b>明確順序<\u002Fb>、有<b>真實意圖性<\u002Fb>;行動有成功有失敗、更有副作用,衝擊到美債、地緣、聯準會信用、美元、財政與股市。結構化整理:<\u002Fp>\n  <table>\n    <thead><tr><th style=\"width:5%\">序<\u002Fth><th style=\"width:17%\">政策行動<\u002Fth><th style=\"width:18%\">真實意圖<\u002Fth><th style=\"width:13%\">成敗<\u002Fth><th style=\"width:20%\">副作用<\u002Fth><th>主要衝擊面<\u002Fth><\u002Ftr><\u002Fthead>\n    <tbody>\n      <tr><td>1<\u002Ftd><td>對等關稅(解放日)<\u002Ftd><td>逼製造業回流、增財源、談判槓桿<\u002Ftd><td><span class=\"pill p-red\">部分失敗<\u002Fspan> 最高院判違憲<\u002Ftd><td>輸入性通貨膨脹 +0.5–0.8pp 核心<\u002Ftd><td>通貨膨脹↑ · 財政(關稅收) · 股市波動<\u002Ftd><\u002Ftr>\n      <tr><td>2<\u002Ftd><td>改依 §122/§232 重課 10%<\u002Ftd><td>關稅違憲後保住財源<\u002Ftd><td><span class=\"pill p-amber\">過渡<\u002Fspan> 150天上限<\u002Ftd><td>政策不確定性、企業觀望<\u002Ftd><td>財政 · 企業利潤 · 美元<\u002Ftd><\u002Ftr>\n      <tr><td>3<\u002Ftd><td>施壓 Fed 降息<\u002Ftd><td>降融資成本、撐股價與房市<\u002Ftd><td><span class=\"pill p-red\">失敗<\u002Fspan> 華許反轉鷹<\u002Ftd><td>傷 Fed 獨立性與信用<\u002Ftd><td>聯準會信用 · 美債 · 美元<\u002Ftd><\u002Ftr>\n      <tr><td>4<\u002Ftd><td>撤鮑威爾、任命華許<\u002Ftd><td>換上「聽話」主席<\u002Ftd><td><span class=\"pill p-red\">反效果<\u002Fspan> 華許更鷹<\u002Ftd><td>市場質疑央行政治化<\u002Ftd><td>聯準會信用 · 殖利率 · 黃金<\u002Ftd><\u002Ftr>\n      <tr><td>5<\u002Ftd><td>聯手以色列空襲伊朗<\u002Ftd><td>地緣施壓、能源/外交籌碼<\u002Ftd><td><span class=\"pill p-amber\">混合<\u002Fspan> 開戰→停火<\u002Ftd><td>油價衝 $118 再回落,通貨膨脹反覆<\u002Ftd><td>地緣 · 油價 · 通貨膨脹 · 避險<\u002Ftd><\u002Ftr>\n      <tr><td>6<\u002Ftd><td>促成美伊 14 點 MOU<\u002Ftd><td>停火紅利、降油價助選<\u002Ftd><td><span class=\"pill p-amber\">未定<\u002Fspan> 待簽、延期<\u002Ftd><td>停火脆弱,尾端風險未除<\u002Ftd><td>地緣 · 油價 · 風險溢價<\u002Ftd><\u002Ftr>\n      <tr><td>7<\u002Ftd><td>擴張性財政(減稅+支出)<\u002Ftd><td>刺激成長、鞏固票源<\u002Ftd><td><span class=\"pill p-red\">代價高<\u002Fspan><\u002Ftd><td>赤字 FY26e −2.05兆、利息攀升<\u002Ftd><td>財政 · 美債評等 · 長端利率<\u002Ftd><\u002Ftr>\n    <\u002Ftbody>\n  <\u002Ftable>\n  <div class=\"note\"><b>結構性矛盾:<\u002Fb>意圖端(降息撐股、關稅增源、地緣施壓)與後果端(通貨膨脹↑→Fed 鷹→殖利率↑→壓股、Fed 信用受損→美元/美債需求動搖、赤字→評等壓力)<b>方向相反<\u002Fb>——這正是 §10 政治↔貨幣矛盾環的根因:川普的「行動」反而觸發了他最想避免的「升息與估值壓縮」。<\u002Fdiv>\n  <h3>六大衝擊面 · 淨效果<\u002Fh3>\n  <table>\n    <thead><tr><th style=\"width:16%\">衝擊面<\u002Fth><th style=\"width:12%\">淨方向<\u002Fth><th>機制<\u002Fth><\u002Ftr><\u002Fthead>\n    <tbody>\n      <tr><td>美債<\u002Ftd><td><span class=\"pill p-red\">承壓<\u002Fspan><\u002Ftd><td>赤字擴大 + 鷹派 → 長端利率↑、借新還舊利息↑、評等壓力<\u002Ftd><\u002Ftr>\n      <tr><td>地緣政治<\u002Ftd><td><span class=\"pill p-amber\">不穩<\u002Fspan><\u002Ftd><td>開戰→停火反覆,Hormuz 未永久重開,油價尾端風險<\u002Ftd><\u002Ftr>\n      <tr><td>聯準會信用<\u002Ftd><td><span class=\"pill p-red\">受損<\u002Fspan><\u002Ftd><td>撤換主席、政治施壓 → 央行獨立性被質疑<\u002Ftd><\u002Ftr>\n      <tr><td>美元<\u002Ftd><td><span class=\"pill p-teal\">短強中弱<\u002Fspan><\u002Ftd><td>鷹派利差撐美元(短) vs 信用/赤字侵蝕(中)<\u002Ftd><\u002Ftr>\n      <tr><td>財政<\u002Ftd><td><span class=\"pill p-red\">惡化<\u002Fspan><\u002Ftd><td>減稅+支出+關稅違憲退款 → 赤字與利息雙升<\u002Ftd><\u002Ftr>\n      <tr><td>股市<\u002Ftd><td><span class=\"pill p-amber\">分裂<\u002Fspan><\u002Ftd><td>挺股意圖 vs 折現率壓縮;高估值容錯率低<\u002Ftd><\u002Ftr>\n    <\u002Ftbody>\n  <\u002Ftable>\n\n  <h2><span class=\"n\">10c<\u002Fspan>川普民意調查 × 媒體評價<span class=\"v2\">sourced<\u002Fspan><\u002Fh2>\n  <p>民意高度極化,<b>經濟與通膨是最大軟肋<\u002Fb>、移民治安為相對優勢;媒體焦點集中在利益衝突、經濟壓力與治理風格。<\u002Fp>\n  <table>\n    <thead><tr><th style=\"width:24%\">議題<\u002Fth><th style=\"width:14%\">認可<\u002Fth><th style=\"width:14%\">不認可<\u002Fth><th>重點<\u002Fth><\u002Ftr><\u002Fthead>\n    <tbody>\n      <tr><td>整體施政<\u002Ftd><td><span class=\"pill p-amber\">42–43%<\u002Fspan><\u002Ftd><td><span class=\"pill p-red\">56–57%<\u002Fspan><\u002Ftd><td>反對微多於支持,社會高度分裂(NBC/SurveyMonkey · Reuters/Ipsos)<\u002Ftd><\u002Ftr>\n      <tr><td>通膨/生活成本<\u002Ftd><td><span class=\"pill p-red\">30%<\u002Fspan><\u002Ftd><td><span class=\"pill p-red\">61%<\u002Fspan><\u002Ftd><td><b>最大軟肋<\u002Fb>;關稅推升每戶年增 ~$1,300–1,400<\u002Ftd><\u002Ftr>\n      <tr><td>經濟管理<\u002Ftd><td><span class=\"pill p-red\">36%<\u002Fspan><\u002Ftd><td><span class=\"pill p-amber\">—<\u002Fspan><\u002Ftd><td>經濟政策肯定度低<\u002Ftd><\u002Ftr>\n      <tr><td>移民/犯罪<\u002Ftd><td><span class=\"pill p-teal\">42–47%<\u002Fspan><\u002Ftd><td><span class=\"pill p-amber\">—<\u002Fspan><\u002Ftd><td><b>相對優勢<\u002Fb>;邊境/治安強硬獲核心支持<\u002Ftd><\u002Ftr>\n      <tr><td>年輕/都市選民<\u002Ftd><td><span class=\"pill p-red\">極低<\u002Fspan><\u002Ftd><td><span class=\"pill p-red\">高<\u002Fspan><\u002Ftd><td>Z 世代否定率遠高於正評<\u002Ftd><\u002Ftr>\n    <\u002Ftbody>\n  <\u002Ftable>\n  <h3>媒體與評論焦點<\u002Fh3>\n  <table>\n    <thead><tr><th style=\"width:20%\">面向<\u002Fth><th>評論要旨<\u002Fth><\u002Ftr><\u002Fthead>\n    <tbody>\n      <tr><td><span class=\"pill p-red\">利益衝突<\u002Fspan><\u002Ftd><td>家族加密公司短期吸金逾 $20 億(含 UAE/沙/卡達外資);$TRUMP 幣投資人晚宴被批「赤裸權力尋租」<\u002Ftd><\u002Ftr>\n      <tr><td><span class=\"pill p-amber\">經濟壓力<\u002Fspan><\u002Ftd><td>廣泛關稅被評「1993 來最大增稅」,成本轉嫁民眾、推升生活成本<\u002Ftd><\u002Ftr>\n      <tr><td><span class=\"pill p-slate\">治理風格<\u002Fspan><\u002Ftd><td>情緒動員為主、制度化能力弱;短期操作與情感訴求取勝,缺長期制度治理<\u002Ftd><\u002Ftr>\n    <\u002Ftbody>\n  <\u002Ftable>\n  <h3>支持者 vs 批評者<\u002Fh3>\n  <table>\n    <thead><tr><th style=\"width:18%\">陣營<\u002Fth><th>觀點<\u002Fth><\u002Ftr><\u002Fthead>\n    <tbody>\n      <tr><td><span class=\"pill p-teal\">支持者<\u002Fspan><\u002Ftd><td>強力執法+嚴管邊境「恢復秩序」;反建制打破政治迴路、快速決策;對外強硬提升議價籌碼<\u002Ftd><\u002Ftr>\n      <tr><td><span class=\"pill p-red\">批評者<\u002Fspan><\u002Ftd><td>關稅/干預市場/衝突外交增不確定性;與富豪(如馬斯克)密切恐政策傾斜;削弱制衡與中長期規劃<\u002Ftd><\u002Ftr>\n    <\u002Ftbody>\n  <\u002Ftable>\n  <div class=\"note\"><b>整體趨勢:<\u002Fb>高度極化,負評略高於正評,<b>經濟通膨不滿漸盛<\u002Fb>(連動 §10b 通貨膨脹→Fed→估值);移民治安維持核心支持。外媒/智庫多聚焦腐敗與治理爭議,對第二任期偏批判。<span class=\"srcline\" style=\"margin:0;display:block;margin-top:4px;\">資料來源:NBC/SurveyMonkey · Reuters/Ipsos · NYT 等多項民調與媒體報導綜合彙整(代表性整理,具體數字以原文為準)。<\u002Fspan><\u002Fdiv>\n\n  <h2><span class=\"n\">10d<\u002Fspan>政策事件時序 · 意圖 / 結果 / 副作用<span class=\"v2\">timeline<\u002Fspan><\u002Fh2>\n  <p>依<b>時間先後<\u002Fb>排列川普第二任政策事件;<b>政策行動<\u002Fb>與<b>反應措施<\u002Fb>分欄不混淆,美伊戰爭後列其<b>副作用<\u002Fb>並推論<b>意圖<\u002Fb>。<\u002Fp>\n  <div class=\"fig\">\n  <svg viewBox=\"0 0 860 132\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"'DM Sans','Noto Sans TC',sans-serif\">\n    <title>政策事件時序軸<\u002Ftitle>\n    <line x1=\"30\" y1=\"46\" x2=\"830\" y2=\"46\" stroke=\"#cfc9ba\" stroke-width=\"2\"><\u002Fline>\n    <g text-anchor=\"middle\">\n      <g><circle cx=\"80\" cy=\"46\" r=\"5\" fill=\"#7C3AED\"><\u002Fcircle><text x=\"80\" y=\"30\" font-size=\"9.5\" fill=\"#6D28D9\" font-weight=\"700\">2/20<\u002Ftext><text x=\"80\" y=\"66\" font-size=\"8.5\" fill=\"#475569\">關稅違憲<\u002Ftext><\u002Fg>\n      <g><circle cx=\"200\" cy=\"46\" r=\"5\" fill=\"#D97706\"><\u002Fcircle><text x=\"200\" y=\"30\" font-size=\"9.5\" fill=\"#B45309\" font-weight=\"700\">2/24<\u002Ftext><text x=\"200\" y=\"66\" font-size=\"8.5\" fill=\"#475569\">§122 課10%<\u002Ftext><\u002Fg>\n      <g><circle cx=\"330\" cy=\"46\" r=\"5.5\" fill=\"#9F1D1D\"><\u002Fcircle><text x=\"330\" y=\"30\" font-size=\"9.5\" fill=\"#9F1D1D\" font-weight=\"700\">2/28<\u002Ftext><text x=\"330\" y=\"66\" font-size=\"8.5\" fill=\"#9F1D1D\" font-weight=\"700\">美伊開戰<\u002Ftext><text x=\"330\" y=\"78\" font-size=\"8\" fill=\"#475569\">Brent→$118<\u002Ftext><\u002Fg>\n      <g><circle cx=\"460\" cy=\"46\" r=\"5\" fill=\"#0F766E\"><\u002Fcircle><text x=\"460\" y=\"30\" font-size=\"9.5\" fill=\"#0F766E\" font-weight=\"700\">4月<\u002Ftext><text x=\"460\" y=\"66\" font-size=\"8.5\" fill=\"#475569\">首次停火<\u002Ftext><\u002Fg>\n      <g><circle cx=\"590\" cy=\"46\" r=\"5\" fill=\"#9F1D1D\"><\u002Fcircle><text x=\"590\" y=\"30\" font-size=\"9.5\" fill=\"#9F1D1D\" font-weight=\"700\">6/10<\u002Ftext><text x=\"590\" y=\"66\" font-size=\"8.5\" fill=\"#475569\">CPI4.2/PPI6.5<\u002Ftext><\u002Fg>\n      <g><circle cx=\"700\" cy=\"46\" r=\"5.5\" fill=\"#9F1D1D\"><\u002Fcircle><text x=\"700\" y=\"30\" font-size=\"9.5\" fill=\"#9F1D1D\" font-weight=\"700\">6/17<\u002Ftext><text x=\"700\" y=\"66\" font-size=\"8.5\" fill=\"#9F1D1D\" font-weight=\"700\">FOMC轉鷹<\u002Ftext><text x=\"700\" y=\"78\" font-size=\"8\" fill=\"#475569\">+MOU同日<\u002Ftext><\u002Fg>\n      <g><circle cx=\"800\" cy=\"46\" r=\"5\" fill=\"#D97706\"><\u002Fcircle><text x=\"800\" y=\"30\" font-size=\"9.5\" fill=\"#B45309\" font-weight=\"700\">6/19<\u002Ftext><text x=\"800\" y=\"66\" font-size=\"8.5\" fill=\"#475569\">談判延期<\u002Ftext><\u002Fg>\n    <\u002Fg>\n  <\u002Fsvg>\n  <\u002Fdiv>\n  <table>\n    <thead><tr><th style=\"width:9%\">時間<\u002Fth><th style=\"width:19%\">政策行動<\u002Fth><th style=\"width:18%\">意圖(推論)<\u002Fth><th style=\"width:18%\">結果<\u002Fth><th>副作用<\u002Fth><\u002Ftr><\u002Fthead>\n    <tbody>\n      <tr><td>2/20<\u002Ftd><td>最高院判對等關稅違憲<\u002Ftd><td>—(司法外力)<\u002Ftd><td>關稅法源重置、待退$166–179B<\u002Ftd><td>政策不確定性↑<\u002Ftd><\u002Ftr>\n      <tr><td>2/24<\u002Ftd><td>改依 §122 課 10%<\u002Ftd><td>保住財源、維持槓桿<\u002Ftd><td>有效稅率 7–13%<\u002Ftd><td>輸入性通貨膨脹 +0.5–0.8pp 核心<\u002Ftd><\u002Ftr>\n      <tr><td>2/28<\u002Ftd><td><b>美伊開戰<\u002Fb>(聯以空襲)<\u002Ftd><td>地緣施壓、能源/外交籌碼<\u002Ftd><td>Brent 衝 $118–120<\u002Ftd><td><b>油價→通貨膨脹反覆;尾端風險<\u002Fb><\u002Ftd><\u002Ftr>\n      <tr><td>4月<\u002Ftd><td>首次停火<\u002Ftd><td>停火紅利、降油助選<\u002Ftd><td>油價自峰回落<\u002Ftd><td>停火脆弱、代理戰場未控<\u002Ftd><\u002Ftr>\n      <tr><td>6/10<\u002Ftd><td>CPI 4.2% / PPI 6.5% 公布<\u002Ftd><td>—(數據)<\u002Ftd><td>通貨膨脹重新偏熱、能源驅動<\u002Ftd><td>核心 PCE 黏 2.9%<\u002Ftd><\u002Ftr>\n      <tr><td>6/17<\u002Ftd><td>FOMC 轉鷹 + 14點 MOU 同日<\u002Ftd><td>降息訴求 vs 通貨膨脹現實<\u002Ftd><td>2Y +16bp、點陣圖 3.8%<\u002Ftd><td>高估值股壓縮、信用受質疑<\u002Ftd><\u002Ftr>\n      <tr><td>6/19<\u002Ftd><td>瑞士談判延期<\u002Ftd><td>—(對手反應)<\u002Ftd><td>和平紅利部分回吐<\u002Ftd><td>Hormuz 未永久重開<\u002Ftd><\u002Ftr>\n    <\u002Ftbody>\n  <\u002Ftable>\n\n  <h2><span class=\"n\">10e<\u002Fspan>聯準會工具箱 · 緊縮 vs 寬鬆 · 用於何處<span class=\"v2\">toolkit<\u002Fspan><\u002Fh2>\n  <table>\n    <thead><tr><th style=\"width:10%\">方向<\u002Fth><th style=\"width:24%\">措施<\u002Fth><th style=\"width:30%\">機制<\u002Fth><th>用於何處 / 現況<\u002Fth><\u002Ftr><\u002Fthead>\n    <tbody>\n      <tr><td rowspan=\"4\"><span class=\"pill p-red\">緊縮<\u002Fspan><\u002Ftd><td>升息(調升 Fed Funds)<\u002Ftd><td>提高借貸成本、抑制需求與通貨膨脹<\u002Ftd><td>抗通膨;現 3.50–3.75%,點陣圖示意年內可能再升<\u002Ftd><\u002Ftr>\n      <tr><td>縮表 QT<\u002Ftd><td>不再續買到期債、抽銀根<\u002Ftd><td>收緊流動性;SOMA 自高點 −$1.42T<\u002Ftd><\u002Ftr>\n      <tr><td>鷹派前瞻/取消 dot<\u002Ftd><td>溝通「higher for longer」<\u002Ftd><td>錨定通膨預期;華許取消 dot、啟動溝通檢討<\u002Ftd><\u002Ftr>\n      <tr><td>調升 IORB<\u002Ftd><td>設利率走廊上緣<\u002Ftd><td>控制有效聯邦基金利率<\u002Ftd><\u002Ftr>\n      <tr><td rowspan=\"4\"><span class=\"pill p-teal\">寬鬆<\u002Fspan><\u002Ftd><td>降息<\u002Ftd><td>降融資成本、刺激需求與資產<\u002Ftd><td>救經濟/撐股;川普訴求但通貨膨脹未降難為<\u002Ftd><\u002Ftr>\n      <tr><td>QE 購債<\u002Ftd><td>擴表壓低長端利率<\u002Ftd><td>危機時注入流動性(如 2020)<\u002Ftd><\u002Ftr>\n      <tr><td>鴿派前瞻<\u002Ftd><td>承諾低利率更久<\u002Ftd><td>穩定市場、壓低殖利率曲線<\u002Ftd><\u002Ftr>\n      <tr><td>緊急流動性(RRP/貼現窗/BTFP)<\u002Ftd><td>提供短期資金、穩金融<\u002Ftd><td>金融壓力時防擠兌;RRP 已近耗盡<\u002Ftd><\u002Ftr>\n    <\u002Ftbody>\n  <\u002Ftable>\n  <div class=\"note\"><b>當前定位:<\u002Fb>Fed 卡在「升也痛(打股市/房市/AI capex)、不升也痛(失通膨控制與公信力)」——暫停但偏鷹、爭取時間;被迫升息條件(油價高檔 + PPI 連續高於 CPI + 通膨預期脫錨)正在靠近,市場已開始為「升息」而非「降息」定價。<\u002Fdiv>\n\n  <h2><span class=\"n\">11<\u002Fspan>美國財政收支走勢<span class=\"v2\">stacked · 雙軸<\u002Fspan><\u002Fh2>\n  <p>收入向上、支出向下(分類堆疊,seaborn 配色 α0.75);右軸=收支差(赤字),<b>縮放至 −1.0～−2.5(間隔 0.25、6 格)以放大波動<\u002Fb>;赤字折線加白色描邊,任何配色下都清晰可辨。<\u002Fp>\n  <div class=\"fig\">\n  <svg viewBox=\"0 0 820 400\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"'DM Sans','Noto Sans TC',sans-serif\">\n    <title>美國財政:收入向上/支出向下 + 赤字折線(右軸縮放)<\u002Ftitle>\n    <desc>FY22-FY26e 收入向上、支出向下分類堆疊(seaborn 配色 α0.75),右軸縮放至 −1.0~−2.5 放大赤字波動,赤字折線加白色描邊清晰可辨。<\u002Fdesc>\n    <!-- 軸框 -->\n    <line x1=\"64\" y1=\"60\" x2=\"64\" y2=\"340\" stroke=\"#475569\" stroke-width=\"1\"><\u002Fline>\n    <line x1=\"756\" y1=\"60\" x2=\"756\" y2=\"340\" stroke=\"#C44E52\" stroke-width=\"1\"><\u002Fline>\n    <!-- 0 橫線(左右軸0對齊) -->\n    <line x1=\"64\" y1=\"200\" x2=\"756\" y2=\"200\" stroke=\"#1f2933\" stroke-width=\"1.4\"><\u002Fline>\n    <!-- 左軸刻度:±7.5,間隔2.5,6格,0於y200 -->\n    <g font-size=\"10\" fill=\"#475569\" text-anchor=\"end\">\n      <text x=\"58\" y=\"63\">+7.5<\u002Ftext><text x=\"58\" y=\"110\">+5<\u002Ftext><text x=\"58\" y=\"157\">+2.5<\u002Ftext><text x=\"58\" y=\"204\">0<\u002Ftext><text x=\"58\" y=\"250\">-2.5<\u002Ftext><text x=\"58\" y=\"297\">-5<\u002Ftext><text x=\"58\" y=\"343\">-7.5<\u002Ftext><\u002Fg>\n    <text x=\"24\" y=\"200\" text-anchor=\"middle\" fill=\"#475569\" font-size=\"11\" transform=\"rotate(-90 24 200)\">收入(↑)/支出(↓) 兆美元<\u002Ftext>\n    <!-- 右軸刻度:縮放 -1.0~-2.5,間隔0.25,6格(放大赤字波動) -->\n    <g font-size=\"10\" fill=\"#C44E52\" text-anchor=\"start\">\n      <text x=\"762\" y=\"63\">-1.0<\u002Ftext><text td><span class=\"pill p-red\">Warsh/Fed<\u002Fspan><\u002Ftd><td>恢復公信力,不讓政治主導利率<\u002Ftd><td>升息打爆股市/不升失通膨控制<\u002Ftd><td>首會維持 3.50–3.75% 但點陣圖轉鷹<\u002Ftd><\u002Ftr>\n      <tr><td><span class=\"pill p-teal\">伊朗<\u002Fspan><\u002Ftd><td>換制裁鬆綁/凍結資產,保留區域籌碼<\u002Ftd><td>國內強硬派批賣國<\u002Ftd><td>霍爾木茲與黎巴嫩綁一起談<\u002Ftd><\u002Ftr>\n      <tr><td><span class=\"pill p-amber\">以色列<\u002Fspan><\u002Ftd><td>反 Hezbollah,不被協議綁住<\u002Ftd><td>破壞協議被美施壓<\u002Ftd><td>保留黎巴嫩南部行動自由(最大破口)<\u002Ftd><\u002Ftr>\n    <\u002Ftbody>\n  <\u002Ftable>\n  <div class=\"note\"><b>最危險反身循環:<\u002Fb>和談破裂 → 油價↑ → 通膨再起 → Fed 被迫升息 → AI/高估值股下修 → 就業信心惡化 → 期中反執政 → 川普更激烈轉移焦點。<b style=\"display:block;margin-top:6px;\">最好情境:<\u002Fb>和談維持、油價回落、Fed 暫停、AI 投資延續、通膨緩降(脆弱點:黎巴嫩/霍爾木茲/以色列是否受控)。<span class=\"srcline\" style=\"display:block;margin:4px 0 0;\">來源:Reuters(14點草案·Vance 政治上升·Warsh dot·股債反應·Trump 36%)·AP(Vance 伊朗會談)綜合彙整。<\u002Fspan><\u002Fdiv>\n\n  <h2><span class=\"n\">11c<\u002Fspan>通膨矩陣(CPI/PPI 2026/5) × S&amp;P 500 估值<span class=\"v2\">data · sourced<\u002Fspan><\u002Fh2>\n  <p>通膨重新偏熱:CPI 4.2% / PPI 6.5%(生產端比消費端更熱,後續有轉嫁壓力);S&amp;P 估值不便宜:Forward P/E 22.5x、P/B 5.4x。<\u002Fp>\n  <table>\n    <thead><tr><th style=\"width:22%\">面向<\u002Fth><th style=\"width:20%\">CPI(5月)<\u002Fth><th style=\"width:20%\">PPI(5月)<\u002Fth><th>含義<\u002Fth><\u002Ftr><\u002Fthead>\n    <tbody>\n      <tr><td>Headline YoY<\u002Ftd><td><span class=\"pill p-red\">+4.2%<\u002Fspan><\u002Ftd><td><span class=\"pill p-red\">+6.5%<\u002Fspan><\u002Ftd><td>生產端更熱→轉嫁壓力<\u002Ftd><\u002Ftr>\n      <tr><td>Core YoY<\u002Ftd><td>+2.9%<\u002Ftd><td><span class=\"pill p-red\">+5.1%<\u002Fspan><\u002Ftd><td>企業毛利可能先被擠壓<\u002Ftd><\u002Ftr>\n      <tr><td>能源<\u002Ftd><td>+23.5%(汽油+40.5%)<\u002Ftd><td>energy MoM +10.7%<\u002Ftd><td>油價是通膨重新升溫主因<\u002Ftd><\u002Ftr>\n      <tr><td>核心商品/商品<\u002Ftd><td>−0.1% MoM<\u002Ftd><td>goods +2.8% MoM<\u002Ftd><td>消費端尚未反映全部成本(滯後)<\u002Ftd><\u002Ftr>\n      <tr><td>核心服務/住宅<\u002Ftd><td>+3.4% YoY<\u002Ftd><td>services +0.3% MoM<\u002Ftd><td>服務通膨仍黏<\u002Ftd><\u002Ftr>\n    <\u002Ftbody>\n  <\u002Ftable>\n  <table>\n    <thead><tr><th style=\"width:34%\">S&amp;P 500 估值(2026/6/18)<\u002Fth><th style=\"width:16%\">數字<\u002Fth><th>判讀<\u002Fth><\u002Ftr><\u002Fthead>\n    <tbody>\n      <tr><td>Forward P/E FY1<\u002Ftd><td><span class=\"pill p-amber\">22.51x<\u002Fspan><\u002Ftd><td>不便宜,須靠 EPS 成長兌現<\u002Ftd><\u002Ftr>\n      <tr><td>Trailing P/E<\u002Ftd><td>27.55x<\u002Ftd><td>歷史偏高區間<\u002Ftd><\u002Ftr>\n      <tr><td>Price / Book<\u002Ftd><td><span class=\"pill p-red\">5.43x<\u002Fspan><\u002Ftd><td>高 ROE/無形/AI 溢價<\u002Ftd><\u002Ftr>\n      <tr><td>股息殖利率<\u002Ftd><td>1.10%<\u002Ftd><td>安全墊不在股息,在成長/資金流<\u002Ftd><\u002Ftr>\n      <tr><td>反推 FY1 EPS<\u002Ftd><td>~$333<\u002Ftd><td>7,500.58 ÷ 22.51(Wells Fargo 上修至 340 一致)<\u002Ftd><\u002Ftr>\n      <tr><td>Est. 3–5Y EPS 成長<\u002Ftd><td>21.13%<\u002Ftd><td>估值建立在高成長假設;AI capex 須兌現<\u002Ftd><\u002Ftr>\n    <\u002Ftbody>\n  <\u002Ftable>\n  <div class=\"note\"><b>核心賭局:<\u002Fb>油價回落 + PPI 不再傳導 + EPS 續上修 → 22.5x 撐得住;反之 PPI 連續高於 CPI + Fed 偏鷹 + EPS 被能源/工資壓縮 → 估值先壓縮(尤其 AI/高 P/B/高 duration)。<span class=\"srcline\" style=\"display:block;margin:4px 0 0;\">來源:BLS 2026/5 CPI(6/10)·PPI · State Street/SPDR SPY characteristics(6/18)·AP 收盤·Wells Fargo EPS 綜合彙整。<\u002Fspan><\u002Fdiv>\n\n  <h2><span class=\"n\">11d<\u002Fspan>S&amp;P 500 估值情境 × 奈許平衡<span class=\"v2\">append · scenarios<\u002Fspan><\u002Fh2>\n\n  <div class=\"note\" style=\"border-left-color:var(--co);background:#f7e8e4;\">\n    <b style=\"color:#9F1D1D;\">因果鏈:政策製造的通膨 → 央行被綁 → 股市無風險溢酬<\u002Fb>\n  <\u002Fdiv>\n  <table>\n    <thead><tr><th style=\"width:18%\">動作 / 因子<\u002Fth><th style=\"width:34%\">傳導機制<\u002Fth><th>結果<\u002Fth><\u002Ftr><\u002Fthead>\n    <tbody>\n      <tr><td>川普關稅戰<\u002Ftd><td>進口成本墊高 → 直接推升物價<\u002Ftd><td>通貨膨脹率 ▲(第一次)<\u002Ftd><\u002Ftr>\n      <tr><td>美伊開戰<\u002Ftd><td>能源端衝擊;開戰以來原油維持高檔、逼近 $100<\u002Ftd><td>透過油價 → 通貨膨脹率 ▲▲(第二次)<\u002Ftd><\u002Ftr>\n      <tr><td>川普干預市場<\u002Ftd><td>股價=政治資本,傾向維持低利率、寬鬆、資金充沛<\u002Ftd><td>與通膨方向對撞(製造通膨卻又壓利率)<\u002Ftd><\u002Ftr>\n      <tr><td>資金行情<\u002Ftd><td>充沛流動性推升風險資產至極限<\u002Ftd><td>S&amp;P 500 創歷史新高;台股、韓股 AI/科技股同步新高<\u002Ftd><\u002Ftr>\n      <tr><td>估值極限<\u002Ftd><td>以當前股價回推盈餘殖利率(≈1/Fwd P/E≈4.4%)<\u002Ftd><td>已與 10Y 美債殖利率(≈4.45%)幾乎相等<\u002Ftd><\u002Ftr>\n    <\u002Ftbody>\n  <\u002Ftable>\n  <table>\n    <thead><tr><th style=\"width:22%\">比較<\u002Fth><th style=\"width:20%\">隱含/無風險報酬<\u002Fth><th style=\"width:16%\">承擔風險<\u002Fth><th>結論<\u002Fth><\u002Ftr><\u002Fthead>\n    <tbody>\n      <tr><td>買美股(S&amp;P 500)<\u002Ftd><td><span class=\"pill p-amber\">盈餘殖利率 ≈ 4.4%<\u002Fspan><\u002Ftd><td>高(波動+估值壓縮+地緣/政策尾部)<\u002Ftd><td rowspan=\"2\"><b>報酬看起來一樣,風險並不一樣<\u002Fb>:用相同預期報酬卻多扛了股市風險 → <b>風險溢酬(ERP)被壓到趨近於零<\u002Fb>。補償一旦消失,任一觸發點(油價、Fed 轉鷹、EPS 下修)都會讓估值率先回吐。<\u002Ftd><\u002Ftr>\n      <tr><td>買美債(10Y)<\u002Ftd><td><span class=\"pill p-teal\">無風險殖利率 ≈ 4.45%<\u002Fspan><\u002Ftd><td>低(無風險基準)<\u002Ftd><\u002Ftr>\n    <\u002Ftbody>\n  <\u002Ftable>\n\n  <p>S&amp;P 500 非「便宜多頭」,而是<b>高估值 × 強 EPS × 低安全邊際<\u002Fb>,靠 AI 與地緣降溫撐住的脆弱奈許平衡:<b>EPS 由 AI 支撐、P/E 被 Fed 與油價壓制<\u002Fb>。目標點位 = Forward EPS × Forward P/E。<\u002Fp>\n\n  <p>S&amp;P 500 非「便宜多頭」,而是<b>高估值 × 強 EPS × 低安全邊際<\u002Fb>,靠 AI 與地緣降溫撐住的脆弱奈許平衡:<b>EPS 由 AI 支撐、P/E 被 Fed 與油價壓制<\u002Fb>。目標點位 = Forward EPS × Forward P/E。<\u002Fp>\n  <table>\n    <thead><tr><th style=\"width:16%\">情境<\u002Fth><th style=\"width:10%\">機率<\u002Fth><th style=\"width:12%\">EPS<\u002Fth><th style=\"width:14%\">Fwd P/E<\u002Fth><th style=\"width:18%\">點位<\u002Fth><th>條件<\u002Fth><\u002Ftr><\u002Fthead>\n    <tbody>\n      <tr><td>樂觀(和平+AI兌現)<\u002Ftd><td>25%<\u002Ftd><td>340–350<\u002Ftd><td>23–24x<\u002Ftd><td><span class=\"pill p-teal\">7,800–8,400<\u002Fspan><\u002Ftd><td>Hormuz 穩、PCE 降、AI 財報強<\u002Ftd><\u002Ftr>\n      <tr><td><b>基準(奈許維持)<\u002Fb><\u002Ftd><td>45%<\u002Ftd><td>335–340<\u002Ftd><td>21.5–22.5x<\u002Ftd><td><span class=\"pill p-amber\">7,200–7,650<\u002Fspan><\u002Ftd><td>邊談邊威脅、Brent 75–90、Fed 偏鷹暫停<\u002Ftd><\u002Ftr>\n      <tr><td>油價反撲+Fed偏鷹<\u002Ftd><td>22%<\u002Ftd><td>320–335<\u002Ftd><td>19–21x<\u002Ftd><td><span class=\"pill p-red\">6,100–7,000<\u002Fspan><\u002Ftd><td>Hormuz 再卡、Brent 90–100、2Y&gt;4.30、PPI 熱<\u002Ftd><\u002Ftr>\n      <tr><td>戰爭重啟/尾部<\u002Ftd><td>8%<\u002Ftd><td>300–315<\u002Ftd><td>17–19x<\u002Ftd><td><span class=\"pill p-red\">5,100–6,000<\u002Fspan><\u002Ftd><td>談判破裂、停滯性通膨、高 P/B 先殺估值<\u002Ftd><\u002Ftr>\n    <\u002Ftbody>\n  <\u002Ftable>\n  <div class=\"note\"><b>估值定義:<\u002Fb>上限由 EPS 決定、下限由 P/E 壓縮速度決定。觸發計:Brent&lt;80 + 2Y&lt;4.15 + AI 強 → 挑戰 7,800–8,300;Brent&gt;90 + 2Y&gt;4.30 → 6,500–7,000;Brent&gt;100 + 10Y&gt;4.80 + EPS 下修 → 5,600–6,300。<b>當前底座:<\u002Fb>Fwd P/E 22.5x · P/B 5.43x · 股息 1.10% · 3–5Y EPS 成長 21%(Wells Fargo 2026 EPS 上修 340/2027 390、目標 7,950)。<\u002Fdiv>\n\n  <h2><span class=\"n\">11e<\u002Fspan>川普法律風險 × 特赦權邊界<span class=\"v2\">append · legal<\u002Fspan><\u002Fh2>\n  <p>美國總統特赦權<b>非萬能保命符<\u002Fb>:只及<b>聯邦刑事<\u002Fb>,不及州罪、民事、彈劾、外國/ICC。下任共和黨可大幅降低聯邦風險,但無法保證絕對平安。<\u002Fp>\n  <table>\n    <thead><tr><th style=\"width:24%\">風險類別<\u002Fth><th style=\"width:18%\">可被共和黨壓低?<\u002Fth><th style=\"width:14%\">保平安度<\u002Fth><th>理由<\u002Fth><\u002Ftr><\u002Fthead>\n    <tbody>\n      <tr><td>聯邦選舉干預案<\u002Ftd><td><span class=\"pill p-teal\">高<\u002Fspan><\u002Ftd><td>85–95%<\u002Ftd><td>可赦免/撤案/不起訴 + 最高院豁免判決<\u002Ftd><\u002Ftr>\n      <tr><td>聯邦機密文件案<\u002Ftd><td><span class=\"pill p-teal\">高<\u002Fspan><\u002Ftd><td>80–90%<\u002Ftd><td>已遭駁回;重啟須克服任命/證據障礙<\u002Ftd><\u002Ftr>\n      <tr><td>Georgia RICO 州案<\u002Ftd><td><span class=\"pill p-teal\">目前高<\u002Fspan><\u002Ftd><td>80–95%<\u002Ftd><td>已被撤(非赦免,檢方決定不追)<\u002Ftd><\u002Ftr>\n      <tr><td>紐約封口費州刑事定罪<\u002Ftd><td><span class=\"pill p-red\">低<\u002Fspan><\u002Ftd><td>30–50%<\u002Ftd><td>總統不能赦免州罪;已 unconditional discharge<\u002Ftd><\u002Ftr>\n      <tr><td>民事賠償/Carroll<\u002Ftd><td><span class=\"pill p-red\">低<\u002Fspan><\u002Ftd><td>20–40%<\u002Ftd><td>赦免不消滅民事判決($88.3M)<\u002Ftd><\u002Ftr>\n      <tr><td>ICC/海牙<\u002Ftd><td><span class=\"pill p-amber\">中低<\u002Fspan><\u002Ftd><td>50–80%<\u002Ftd><td>美非締約國+可制裁+安理會否決;漏洞:締約國領土/普遍管轄<\u002Ftd><\u002Ftr>\n      <tr><td>外國普遍管轄<\u002Ftd><td><span class=\"pill p-amber\">低–中<\u002Fspan><\u002Ftd><td>40–70%<\u002Ftd><td>卸任赴歐/加/拉美有理論風險<\u002Ftd><\u002Ftr>\n    <\u002Ftbody>\n  <\u002Ftable>\n  <div class=\"note\"><b>四個保不了:<\u002Fb>州刑事案、民事賠償、彈劾(取決國會)、國際法/外國法院。<b>最危險情境:<\u002Fb>若出現清楚證據證明直接下令違法攻擊平民/酷刑/系統性迫害,且連到 ICC 締約國領土或普遍管轄國 → 非一句話能保。戰爭罪/反人類罪門檻高(需命令鏈+意圖+傷亡證據),2024 Trump v. US 豁免判決僅約束美國國內、不綁 ICC。<\u002Fdiv>\n\n  <h2><span class=\"n\">11f<\u002Fspan>三層奈許平衡矩陣<span class=\"v2\">append<\u002Fspan><\u002Fh2>\n  <p>同一局向上/向下展開三層,皆為「低信任、高威脅、各方暫不願破局」的交易型僵局。<\u002Fp>\n  <table>\n    <thead><tr><th style=\"width:18%\">層級<\u002Fth><th style=\"width:34%\">平衡內容<\u002Fth><th>為何穩定 / 脆弱點<\u002Fth><\u002Ftr><\u002Fthead>\n    <tbody>\n      <tr><td><span class=\"pill p-red\">美伊戰爭層<\u002Fspan><\u002Ftd><td>受控威脅 + 分階段談判;Hormuz 條件性重開<\u002Ftd><td>各方比全面戰好;脆弱點=Hormuz/Lebanon/油品豁免綁一起<\u002Ftd><\u002Ftr>\n      <tr><td><span class=\"pill p-blue\">國際多方層<\u002Fspan><\u002Ftd><td>多極交易型僵局;美仍最強但 Iran/Israel/Gulf/中/俄有局部否決權<\u002Ftd><td>無人能單方結束;3000億基金治理為破局炸彈<\u002Ftd><\u002Ftr>\n      <tr><td><span class=\"pill p-amber\">美國政經層<\u002Fspan><\u002Ftd><td>川普強硬敘事 + 實際風控;Fed 偏鷹暫停;市場以 AI 牛市忍受高利率<\u002Ftd><td>條件:油價別爆;脆弱點=油價↑+2Y↑+美元↑ 同時<\u002Ftd><\u002Ftr>\n    <\u002Ftbody>\n  <\u002Ftable>\n  <div class=\"note\"><b>最破局因子(排名):<\u002Fb>① Hormuz+Lebanon+油品豁免三綁 ② PCE/PPI 再熱 ③ 2Y 破 4.30 ④ 3000億基金治理失敗。<b>基準劇本(60天):<\u002Fb>邊談、邊威脅、邊測油價、邊看 Fed、邊備期中敘事 → 高波動停火而非穩定和平。<\u002Fdiv>\n\n  <h2><span class=\"n\">11g<\u002Fspan>分析師共識因子 × 論證測試<span class=\"v2\">append · analyst<\u002Fspan><\u002Fh2>\n  <p>納入主要分析師/機構的<b>目標價、EPS、論點<\u002Fb>為一組因子,並以「多空論證 + 條件驗證」測試其成立前提。<\u002Fp>\n  <table>\n    <thead><tr><th style=\"width:16%\">機構<\u002Fth><th style=\"width:14%\">S&amp;P 目標<\u002Fth><th style=\"width:12%\">2026 EPS<\u002Fth><th style=\"width:14%\">立場<\u002Fth><th>核心論點<\u002Fth><\u002Ftr><\u002Fthead>\n    <tbody>\n      <tr><td>Wells Fargo<\u002Ftd><td><span class=\"pill p-teal\">7,950<\u002Fspan><\u002Ftd><td>340(↑315)<\u002Ftd><td><span class=\"pill p-teal\">偏多<\u002Fspan><\u002Ftd><td>獲利強 + 美伊降風險 + AI/半導體支撐<\u002Ftd><\u002Ftr>\n      <tr><td>Goldman Sachs<\u002Ftd><td>7,200<\u002Ftd><td>330<\u002Ftd><td><span class=\"pill p-amber\">中性偏謹慎<\u002Fspan><\u002Ftd><td>油價衝擊→成長失望+金融收緊,牛市終點特徵<\u002Ftd><\u002Ftr>\n      <tr><td>Morgan Stanley<\u002Ftd><td>7,000<\u002Ftd><td>325<\u002Ftd><td><span class=\"pill p-amber\">高估值風控<\u002Fspan><\u002Ftd><td>從追漲轉事件/政策檢驗估值,偏好品質<\u002Ftd><\u002Ftr>\n      <tr><td>State Street<\u002Ftd><td>—<\u002Ftd><td>—<\u002Ftd><td><span class=\"pill p-teal\">建設性<\u002Fspan><\u002Ftd><td>科技與其餘獲利差收斂,反彈擴散健康<\u002Ftd><\u002Ftr>\n      <tr><td>Yardeni<\u002Ftd><td>8,000+<\u002Ftd><td>345<\u002Ftd><td><span class=\"pill p-amber\">意外鷹但多<\u002Fspan><\u002Ftd><td>華許轉鷹出乎意料,2026 利率更黏<\u002Ftd><\u002Ftr>\n    <\u002Ftbody>\n  <\u002Ftable>\n  <h3>論證測試 · 多空前提驗證<\u002Fh3>\n  <table>\n    <thead><tr><th style=\"width:30%\">論點<\u002Fth><th style=\"width:14%\">當前證據<\u002Fth><th>成立 / 證偽條件<\u002Fth><\u002Ftr><\u002Fthead>\n    <tbody>\n      <tr><td>「EPS 340 撐 22.5x」(多)<\u002Ftd><td><span class=\"pill p-amber\">部分<\u002Fspan><\u002Ftd><td>成立:AI capex 轉現金流、半導體續強;證偽:PPI 連續&gt;CPI 壓毛利<\u002Ftd><\u002Ftr>\n      <tr><td>「油價衝擊=牛市終點」(空)<\u002Ftd><td><span class=\"pill p-amber\">未觸發<\u002Fspan><\u002Ftd><td>成立:Brent 重回 90+ 且 2Y 破 4.30;證偽:Hormuz 永久重開、油回 $75<\u002Ftd><\u002Ftr>\n      <tr><td>「反彈擴散=健康」(多)<\u002Ftd><td><span class=\"pill p-red\">未過關<\u002Fspan><\u002Ftd><td>成立:IWM 連續強於 SPY、廣度&gt;前10大;證偽:前10大佔反彈仍逾六成<\u002Ftd><\u002Ftr>\n      <tr><td>「2026 利率更黏」(鷹)<\u002Ftd><td><span class=\"pill p-red\">支持<\u002Fspan><\u002Ftd><td>成立:點陣圖 3.8%、核心 PCE 黏 2.9%;證偽:PCE 連兩月降溫<\u002Ftd><\u002Ftr>\n    <\u002Ftbody>\n  <\u002Ftable>\n  <div class=\"note\"><b>共識區間:<\u002Fb>目標 7,000–8,000+(中樞 ~7,400)、EPS 325–345;<b>分歧點:<\u002Fb>油價是否傳導進核心、AI capex 回報、廣度能否擴散。<b>測試結論:<\u002Fb>多方靠 EPS 兌現、空方靠 P/E 壓縮——目前證據偏「高位震盪」而非單邊。<span class=\"srcline\" style=\"display:block;margin:4px 0 0;\">來源:Wells Fargo/GS/MS/State Street/Yardeni 公開評論綜合彙整(代表性整理,數字以原文為準)。<\u002Fspan><\u002Fdiv>\n\n  <h2><span class=\"n\">11h<\u002Fspan>台股投資戰略 × 風控驗證<span class=\"v2\">append · TW<\u002Fspan><\u002Fh2>\n  <p>台股非一般景氣循環,而是<b>AI 半導體供應鏈高度集中牛市 + 地緣溢價 + 美債利率制約 + 台幣波動<\u002Fb>混合市場。戰略:<b>核心 AI + 防禦現金流 + 現金等回檔 + 嚴格風控<\u002Fb>。<\u002Fp>\n  <table>\n    <thead><tr><th style=\"width:18%\">因子<\u002Fth><th style=\"width:30%\">現況<\u002Fth><th>對台股意義<\u002Fth><\u002Ftr><\u002Fthead>\n    <tbody>\n      <tr><td>AI 出口動能<\u002Ftd><td>2026/5 出口 +51.7% 至 784.8 億(史上第2高);電子零件 +66.9%、資通訊 +118%<\u002Ftd><td>主軸是 AI 供應鏈非傳統內需<\u002Ftd><\u002Ftr>\n      <tr><td>台灣 GDP/利率<\u002Ftd><td>央行上修 2026 GDP 7.25→9.45%;利率 2%、通膨 2.2%(偏謹慎)<\u002Ftd><td>基本面強但通膨/能源限降息<\u002Ftd><\u002Ftr>\n      <tr><td>台積電(估值錨)<\u002Ftd><td>魏哲家:AI 需求強、避免成瓶頸、漲價但不突然大漲<\u002Ftd><td>EPS/capex/CoWoS 是台股總判斷<\u002Ftd><\u002Ftr>\n      <tr><td>地緣/美債/美元<\u002Ftd><td>五天即戰力操演;Fed 偏鷹、美元強<\u002Ftd><td>高估值電子最怕 2Y↑+美元強+台幣貶<\u002Ftd><\u002Ftr>\n    <\u002Ftbody>\n  <\u002Ftable>\n  <h3>配置 × 風控驗證<\u002Fh3>\n  <table>\n    <thead><tr><th style=\"width:22%\">部位<\u002Fth><th style=\"width:14%\">比重<\u002Fth><th>內容 / 驗證條件<\u002Fth><\u002Ftr><\u002Fthead>\n    <tbody>\n      <tr><td><span class=\"pill p-red\">核心<\u002Fspan><\u002Ftd><td>40–55%<\u002Ftd><td>台積電/先進製程/CoWoS/AI server/散熱/電源/PCB — 驗證:台積電 EPS 上修+外資買超<\u002Ftd><\u002Ftr>\n      <tr><td><span class=\"pill p-blue\">衛星成長<\u002Fspan><\u002Ftd><td>15–25%<\u002Ftd><td>ASIC/矽光子/機器人/設備材料 — 須停利停損,不當核心<\u002Ftd><\u002Ftr>\n      <tr><td><span class=\"pill p-teal\">防禦現金流<\u002Fspan><\u002Ftd><td>15–25%<\u002Ftd><td>金融/電信/公用 — 降波動,避高溢價ETF<\u002Ftd><\u002Ftr>\n      <tr><td><span class=\"pill p-amber\">對沖/現金<\u002Fspan><\u002Ftd><td>10–25%<\u002Ftd><td>現金/短債/美元/黃金 — 等回檔+對沖地緣利率<\u002Ftd><\u002Ftr>\n    <\u002Ftbody>\n  <\u002Ftable>\n  <div class=\"note\"><b>風控儀表板(警戒線):<\u002Fb>Brent&gt;90 減高估值;2Y 快速上行降 AI 衛星;美元強/台幣急貶/外資連賣→控電子集中度+降槓桿;融資暴增不追高;台積電月營收增速鈍化→檢查 AI 鏈。<b>驗證結論:<\u002Fb>單一利空可買回檔;<b>「油價+Fed+美元+台幣」四同時惡化才需先保命<\u002Fb>。一句話:可做多但不能無腦做多,主線 AI、風控看美債/油價/台幣/外資/台積電。<span class=\"srcline\" style=\"display:block;margin:4px 0 0;\">來源:台灣財政部出口/央行/台積電法說綜合彙整(代表性整理)。<\u002Fspan><\u002Fdiv>\n\n  <h2><span class=\"n\">11i<\u002Fspan>整合執行摘要 · 高槓桿止血局<span class=\"v2\">append<\u002Fspan><\u002Fh2>\n  <p>局勢定位＝<b>止血局<\u002Fb>:受控衝突下的交易式停火,非真正和平。看法順序:先結論、再傳導、最後風控。<\u002Fp>\n  <table>\n    <thead><tr><th style=\"width:20%\">構面<\u002Fth><th style=\"width:18%\">定位<\u002Fth><th>一句話<\u002Fth><\u002Ftr><\u002Fthead>\n    <tbody>\n      <tr><td>局勢<\u002Ftd><td><span class=\"pill p-amber\">止血局<\u002Fspan><\u002Ftd><td>美伊談判壓尾部風險,但停火條件式、可逆<\u002Ftd><\u002Ftr>\n      <tr><td>Fed/利率<\u002Ftd><td><span class=\"pill p-red\">偏鷹暫停<\u002Fspan><\u002Ftd><td>EPS 撐上限、P/E 決定下殺速度<\u002Ftd><\u002Ftr>\n      <tr><td>風險引擎<\u002Ftd><td><span class=\"pill p-amber\">觸發低·脆弱高<\u002Fspan><\u002Ftd><td>不易立刻崩,但任何點火被放大<\u002Ftd><\u002Ftr>\n      <tr><td>台股<\u002Ftd><td><span class=\"pill p-teal\">核心 AI<\u002Fspan><\u002Ftd><td>做多但非無腦全押,風控看美債/油價/台幣<\u002Ftd><\u002Ftr>\n    <\u002Ftbody>\n  <\u002Ftable>\n  <div class=\"note\"><b>一句話結論:<\u002Fb>全球處於「高槓桿止血局」——美伊談判壓低尾部風險但和平未完成;AI 支撐風險資產,但高估值受 2Y 美債與美元限制。可做多、不可無腦,主線盯<b>油價→通膨→Fed→殖利率→估值<\u002Fb>這條鏈。<\u002Fdiv>\n\n  <h2><span class=\"n\">12<\u002Fspan>變數相依矩陣<span class=\"v2\">data layer · sourced<\u002Fspan><\u002Fh2>\n  <table>\n    <thead><tr><th style=\"width:24%\">From → To<\u002Fth><th style=\"width:8%\">方向<\u002Fth><th style=\"width:30%\">機制<\u002Fth><th>關鍵證據<\u002Fth><\u002Ftr><\u002Fthead>\n    <tbody>\n      <tr><td>關稅 → 通膨<\u002Ftd><td><span class=\"pill p-red\">+<\u002Fspan><\u002Ftd><td>輸入成本轉嫁(~70–90% 由美方承擔)<\u002Ftd><td>Dallas Fed +0.8pp 核心PCE;Feroli +0.2–0.4pp<\u002Ftd><\u002Ftr>\n      <tr><td>美伊/Hormuz → 油價<\u002Ftd><td><span class=\"pill p-red\">+<\u002Fspan><\u002Ftd><td>供給路線封鎖<\u002Ftd><td>Brent 峰 ~$118–120(3月)→ ~$80(6/19)<\u002Ftd><\u002Ftr>\n      <tr><td>油價 → 通膨<\u002Ftd><td><span class=\"pill p-red\">+<\u002Fspan><\u002Ftd><td>能源佔 5 月 CPI 增幅 60%+<\u002Ftd><td>CPI 4.2%;能源 +23.5% YoY;汽油 +40.5%<\u002Ftd><\u002Ftr>\n      <tr><td>通膨 → Fed 鷹派<\u002Ftd><td><span class=\"pill p-red\">+<\u002Fspan><\u002Ftd><td>物價穩定使命<\u002Ftd><td>點陣圖中位升至 3.8%;9/18 預期升息<\u002Ftd><\u002Ftr>\n      <tr><td>Fed 鷹派 → 2Y 殖利率<\u002Ftd><td><span class=\"pill p-red\">+<\u002Fspan><\u002Ftd><td>利率路徑重定價<\u002Ftd><td>6/17 +16bp → 4.2%(2008來最大 Fed 日波動)<\u002Ftd><\u002Ftr>\n      <tr><td>2Y 殖利率 → AI/高估值股<\u002Ftd><td><span class=\"pill p-teal\">–<\u002Fspan><\u002Ftd><td>折現率壓縮<\u002Ftd><td>S&amp;P −1.2%(6/17);Daco 機制<\u002Ftd><\u002Ftr>\n      <tr><td>關稅 → 利潤 → 就業<\u002Ftd><td><span class=\"pill p-teal\">–<\u002Fspan><\u002Ftd><td>非 AI 企業成本擠壓<\u002Ftd><td>Snider 利潤率壓力<\u002Ftd><\u002Ftr>\n      <tr><td>AI capex → 科技裁員<\u002Ftd><td><span class=\"pill p-teal\">–<\u002Fspan><\u002Ftd><td>成本重配置到 AI<\u002Ftd><td>Meta −8k、Oracle −30k;56% 提及 AI<\u002Ftd><\u002Ftr>\n      <tr><td>就業疲弱 → 消費 → 獲利<\u002Ftd><td><span class=\"pill p-teal\">–<\u002Fspan><\u002Ftd><td>所得/支出通道<\u002Ftd><td>Helfert;Citrini 情境;Zandi 前10%佔 49.2%<\u002Ftd><\u002Ftr>\n      <tr><td>基金流入 → 股市水位<\u002Ftd><td><span class=\"pill p-red\">+<\u002Fspan><\u002Ftd><td>單週 $38.37B / 科技 $21.46B<\u002Ftd><td>LSEG Lipper 週(6/17)<\u002Ftd><\u002Ftr>\n      <tr><td>Hormuz 重開 → 廣度擴散<\u002Ftd><td><span class=\"pill p-red\">+<\u002Fspan><\u002Ftd><td>risk-on 輪動<\u002Ftd><td>Schwab 條件<\u002Ftd><\u002Ftr>\n      <tr><td>AI capex/債 → 利率敏感<\u002Ftd><td><span class=\"pill p-teal\">–<\u002Fspan><\u002Ftd><td>債務融資擴張<\u002Ftd><td>Nvidia $20B 債;AI 債 ~$1.2T<\u002Ftd><\u002Ftr>\n    <\u002Ftbody>\n  <\u002Ftable>\n  <div class=\"note\"><b>樞紐門檻:<\u002Fb>Brent 站穩 ~$75 下方＝能源通膨通道降溫;重回 ~$95 上方＝回饋環重啟。<b>傳導計:<\u002Fb>2Y 升破 ~4.3–4.5% 壓 AI 倍數;回到 ~3.8% 緩解。下次 FOMC 7/28–29(市場價 ~60% 10月升息)。<\u002Fdiv>\n\n  <h2><span class=\"n\">13<\u002Fspan>利害關係人 · 誰 / 何時何地 / 說了什麼 / 如何影響<span class=\"v2\"
