<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VIA · VENDOR × CUSTOMER LIST · 供應商×元件×客戶</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f4f0;--paper:#fff;--paper2:#fafaf8;--ink:#1e1d1a;--ink2:#33403f;--mut:#6b6860;--mut2:#9c9890;
 --line:#dbd9d3;--soft:#ecebe6;--vi:#7a6daa;--up:#c96b5a;--down:#5a9e6f;--am:#c4943a;--blue:#4c78a8;}
*{box-sizing:border-box;margin:0;padding:0}html,body{background:var(--bg)}html{scrollbar-gutter:stable}
body{color:var(--ink2);font-family:'DM Sans','Noto Sans TC',system-ui,sans-serif;font-size:12px;line-height:1.5}
.wrap{max-width:none;margin:0 auto;padding:20px 8px 60px}
.pdf{position:fixed;top:12px;right:14px;z-index:999;background:var(--ink);color:#fff;border:none;border-radius:5px;padding:7px 13px;font:700 9px 'DM Mono',monospace;cursor:pointer}
@media print{.pdf,.tabs{display:none!important}}
h1{font:800 21px/1.2 'Syne','Noto Sans TC',sans-serif;color:var(--ink);display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1::before{content:"";display:inline-block;width:5px;height:22px;background:var(--vi);border-radius:2px;transform:translateY(3px);margin-right:2px}
h1 .flow{font:500 10px 'DM Mono',monospace;color:var(--mut2)}
.tabs{display:flex;gap:26px;flex-wrap:wrap;margin:12px 0 0;border-bottom:2px solid var(--soft);position:sticky;top:0;background:var(--bg);z-index:30}
.tab{font:700 12px 'DM Sans','Noto Sans TC',sans-serif;color:var(--ink2);padding:9px 2px 11px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;letter-spacing:.3px}
.tab.on{color:var(--vi);border-bottom-color:var(--vi)}
.tab:hover:not(.on){color:var(--ink)}
.toolrow{display:flex;gap:7px;align-items:center;padding:12px 0 4px}
.toolrow input{flex:1;min-width:220px;font:600 11px 'DM Mono','Noto Sans TC',monospace;border:1px solid var(--line);border-radius:5px;padding:7px 10px;background:var(--paper);color:var(--ink)}
table{width:100%;border-collapse:collapse;font:500 11px 'DM Mono','Noto Sans TC',monospace;background:var(--paper);border:none;border-radius:8px;overflow:hidden;margin-top:10px}
th{font:700 9px 'DM Mono',monospace;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);text-align:left;padding:8px 12px;border-bottom:2px solid var(--ink);background:var(--paper2)}
td{padding:7px 12px;border-bottom:1px solid var(--soft);vertical-align:top}
tr:hover td{background:var(--paper2)}
td .code{color:var(--vi);font-weight:700;white-space:nowrap}
td .tk{font:600 9px 'DM Mono',monospace;background:var(--soft);border-radius:3px;padding:1px 7px;color:var(--ink2);white-space:nowrap}
.note{font:500 9.5px/1.7 'DM Mono',monospace;color:var(--mut);background:var(--paper);border:1px solid var(--soft);border-left:3px solid var(--vi);border-radius:4px;padding:9px 13px;margin:12px 0 0}
.note b{color:var(--ink2)}
</style></head><body>
<button class="pdf" onclick="window.print()">⤓ PDF</button>
<div class="wrap">
<h1>VENDOR × CUSTOMER LIST <span class="flow">供應商×元件×客戶 · 六同業 SixPeer · 權威=uploads JSON · VIA-M-VENCUS</span></h1>
<div class="tabs" id="tabs"></div>
<div class="toolrow"><input id="q" placeholder="🔍 搜尋 公司/元件/客戶/BU…"></div>
<div id="chips" style="display:flex;gap:6px;flex-wrap:wrap;padding:6px 0 0"></div>
<div id="view"></div>
<div class="note">🔒 <b>權威來源</b> — uploads/VIA_Supplier_Component_Customer_Roadmap_SixPeer_20260702.json(零複本 · 即時讀取)· SAP 佐證欄位鎖定 align-only(MM/SD/CO-PA)。</div>
</div>
<script>
const $=s=>document.querySelector(s);
let D=null,TAB="co",Q="",SEL=[];
// 自動擷取：公司快選(可複選 · 電源三雄一鍵擷取 台達電/光寶科/康舒)
const CHIPS=[["電源三雄",["台達","光寶","康舒","DELTA","LITEON","ACBEL"]],["台達電",["台達","DELTA"]],["光寶科",["光寶","LITEON"]],["康舒",["康舒","ACBEL"]],["健策",["健策","JENTECH"]],["奇鋭",["奇鋭","AVC"]],["雙鴻",["雙鴻","AURAS"]]];
function renderChips(){$("#chips").innerHTML=CHIPS.map((c,i)=>'<span data-c="'+i+'" style="cursor:pointer;font:700 9.5px \'DM Mono\',\'Noto Sans TC\',monospace;border:1px solid '+(SEL.includes(i)?"var(--vi)":"var(--line)")+';color:'+(SEL.includes(i)?"#fff":"var(--ink2)")+';background:'+(SEL.includes(i)?"var(--vi)":"var(--paper2)")+';border-radius:20px;padding:4px 12px">'+(SEL.includes(i)?"✓ ":"")+c[0]+'</span>').join("");
 document.querySelectorAll("[data-c]").forEach(el=>el.onclick=()=>{const i=+el.dataset.c;SEL=SEL.includes(i)?SEL.filter(x=>x!==i):[...SEL,i];renderChips();render();});}
const TABS=[["co","六同業 Companies"],["vd","VENDOR 供應商×元件"],["cu","CUSTOMER LIST 客戶路線"],["px","產品矩陣"],["ca","交叉分析"],["va","驗證"]];
const hit=r=>{const s=r.join(" ").toLowerCase();
 if(Q&&!s.includes(Q))return false;
 if(SEL.length){const kws=SEL.flatMap(i=>CHIPS[i][1]);if(!kws.some(k=>s.includes(k.toLowerCase())))return false;}
 return true;};
function tbl(head,rows){return '<table><thead><tr>'+head.map(h=>'<th>'+h+'</th>').join("")+'</tr></thead><tbody>'+(rows.join("")||'<tr><td colspan="'+head.length+'" style="color:var(--mut2)">無符合項目</td></tr>')+'</tbody></table>';}
const esc=s=>String(s==null?"":s).replace(/</g,"&lt;");
function render(){
 $("#tabs").innerHTML=TABS.map(t=>'<div class="tab'+(TAB===t[0]?" on":"")+'" data-t="'+t[0]+'">'+t[1]+'</div>').join("");
 document.querySelectorAll(".tab").forEach(el=>el.onclick=()=>{TAB=el.dataset.t;render();});
 const v=$("#view");if(!D){v.innerHTML='<div class="note">載入中…</div>';return;}
 if(TAB==="co")v.innerHTML=tbl(["代碼","Ticker","公司","事業範疇","產品線","佐證狀態"],D.companies.filter(hit).map(r=>'<tr><td><span class="code">'+esc(r[0])+'</span></td><td><span class="tk">'+esc(r[1])+'</span></td><td><b>'+esc(r[2])+'</b></td><td>'+esc(r[3])+'</td><td>'+esc(r[4])+'</td><td style="color:var(--mut)">'+esc(r[5])+'</td></tr>'));
 else if(TAB==="vd")v.innerHTML=tbl(["代碼","供應類別","元件 Components","主要對象(六同業)","間接對象","SAP 佐證","狀態"],D.supplier_component.filter(hit).map(r=>'<tr><td><span class="code">'+esc(r[0])+'</span></td><td><b>'+esc(r[1])+'</b></td><td>'+esc(r[2])+'</td><td>'+esc(r[3])+'</td><td style="color:var(--mut)">'+esc(r[4])+'</td><td>'+esc(r[5])+'</td><td style="color:var(--mut)">'+esc(r[6])+'</td></tr>'));
 else if(TAB==="cu")v.innerHTML=tbl(["代碼","客戶類型","需求領域","供應之六同業","對接 BU","導入路線 Roadmap","SAP/佐證","狀態"],D.customer_roadmap.filter(hit).map(r=>'<tr><td><span class="code">'+esc(r[0])+'</span></td><td><b>'+esc(r[1])+'</b></td><td>'+esc(r[2])+'</td><td>'+esc(r[3])+'</td><td>'+esc(r[4])+'</td><td>'+esc(r[5])+'</td><td>'+esc(r[6])+'</td><td style="color:var(--mut)">'+esc(r[7])+'</td></tr>'));
 else if(TAB==="px")v.innerHTML=tbl(["產品 / 能力","台達","光寶","康舒","健策","奇鋐","雙鴻"],D.product_matrix.filter(hit).map(r=>'<tr><td><b>'+esc(r[0])+'</b></td>'+r.slice(1,7).map(c=>'<td style="color:'+(String(c).startsWith("Strong")?"var(--up)":String(c).startsWith("Medium")?"var(--am)":"var(--mut)")+';font-weight:700">'+esc(c)+'</td>').join("")+'</tr>'));
 else if(TAB==="ca")v.innerHTML=tbl(["代碼","交叉分析項","內容","狀態"],D.cross_analysis.filter(hit).map(r=>'<tr><td><span class="code">'+esc(r[0])+'</span></td><td><b>'+esc(r[1])+'</b></td><td>'+r.slice(2,-1).map(esc).join(" · ")+'</td><td style="color:var(--mut)">'+esc(r[r.length-1])+'</td></tr>'));
 else if(TAB==="va")v.innerHTML=tbl(["代碼","驗證項","內容","狀態"],D.validation.filter(hit).map(r=>'<tr><td><span class="code">'+esc(r[0])+'</span></td><td><b>'+esc(r[1])+'</b></td><td>'+r.slice(2,-1).map(esc).join(" · ")+'</td><td style="color:var(--mut)">'+esc(r[r.length-1])+'</td></tr>'));
}
$("#q").oninput=e=>{Q=e.target.value.trim().toLowerCase();render();};
fetch("uploads/VIA_Supplier_Component_Customer_Roadmap_SixPeer_20260702.json",{cache:"no-store"}).then(r=>r.json()).then(j=>{D=j;render();}).catch(e=>{$("#view").innerHTML='<div class="note">⚠ 無法載入 JSON:'+e.message+'</div>';});
const P=new URLSearchParams(location.search);if(P.get("tab"))TAB=P.get("tab");
if(P.get("co")){const i=CHIPS.findIndex(c=>c[0]===P.get("co"));if(i>=0)SEL=[i];}
renderChips();
render();
</script>
</body></html>
