let Q="";const OPEN={};PHASES.forEach(p=>OPEN[p.id]=true);
function render(){

  if(Q&&!rows.length)return "";
  return '<div class="phase"><div class="ph" data-p="'+p.id+'"><span class="st">'+p.id+'</span><b>'+p.t+'</b><span class="dt">'+p.dt+'</span><span class="n">'+rows.length+' 項 '+(OPEN[p.id]?"▾":"▸")+'</span></div>'+

 document.querySelectorAll(".ph").forEach(el=>el.onclick=()=>{OPEN[el.dataset.p]=!OPEN[el.dataset.p];render();});}

 const u=document.createElement("a");u.href=URL.createObjectURL(b);u.download="VIA_Knowledge_Base.json";u.click();};
