function T(svg,x,y,t,an,sz,col){const e=NS('text',{x,y,'text-anchor':an,'font-size':sz,fill:cv(col),'font-family':'DM Mono, monospace'});e.textContent=t;svg.append(e);}
function PL(svg,pts,col,w){svg.append(NS('polyline',{points:pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' '),fill:'none',stroke:cv(col),'stroke-width':w,'stroke-linejoin':'round','stroke-linecap':'round'}));}
function gridY(svg,L,R,vals,Y,col){vals.forEach(v=>{svg.append(NS('line',{x1:L,x2:R,y1:Y(v),y2:Y(v),stroke:cv('--bg1'),'stroke-width':1}));});}

function chNFP(){const svg=document.getElementById('c-nfp'),W=420,H=210,L=34,Rr=34,Tp=10,B=24,pw=W-L-Rr,ph=H-Tp-B;
 const d=F.nfp,n=d.lab.length,bw=pw/n*0.6;
 const top=Math.max(...d.nfp)*1.12,Y=v=>Tp+ph*(top-v)/top,cx=i=>L+pw*(i+0.5)/n;
 for(let t=0;t<=4;t++){const v=top*t/4;svg.append(NS('line',{x1:L,x2:W-Rr,y1:Y(v),y2:Y(v),stroke:cv('--bg1')}));T(svg,L-4,Y(v)+3,Math.round(v),'end',7.5,'--i3');}
 const ur=d.ur,ulo=Math.min(...ur)-0.2,uhi=Math.max(...ur)+0.2,UY=v=>Tp+ph*(uhi-v)/((uhi-ulo)||1);
 [ulo,(ulo+uhi)/2,uhi].forEach(v=>T(svg,W-Rr+4,UY(v)+3,v.toFixed(1)+'%','start',7.5,'--am'));
 d.nfp.forEach((v,i)=>{const col=i===0?'--bl':(v>=d.nfp[i-1]?'--up':'--dn');svg.append(NS('rect',{x:cx(i)-bw/2,y:Y(v),width:bw,height:ph-(Y(v)-Tp),fill:cv(col),opacity:.9}));
   if(i%2===0)T(svg,cx(i),H-8,d.lab[i],'middle',7,'--i3');});
 PL(svg,ur.map((v,i)=>[cx(i),UY(v)]),'--am',2);
 ur.forEach((v,i)=>svg.append(NS('circle',{cx:cx(i),cy:UY(v),r:2.2,fill:cv('--am')})));
}
function chDur(){const svg=document.getElementById('c-dur'),W=420,H=210,L=40,Rr=10,Tp=10,B=24,pw=W-L-Rr,ph=H-Tp-B;
 const d=F.dur,n=d.lab.length,bw=pw/n*0.62,segs=[['b1','--gn-l'],['b2','--am-l'],['b3','--am'],['b4','--co']];
 const tot=d.lab.map((_,i)=>segs.reduce((a,[k])=>a+d[k][i],0)),top=Math.max(...tot)*1.08,Y=v=>Tp+ph*(top-v)/top,cx=i=>L+pw*(i+0.5)/n;
 for(let t=0;t<=4;t++){const v=top*t/4;svg.append(NS('line',{x1:L,x2:W-Rr,y1:Y(v),y2:Y(v),stroke:cv('--bg1')}));T(svg,L-4,Y(v)+3,(v/1000).toFixed(1)+'M','end',7,'--i3');}
 d.lab.forEach((l,i)=>{let acc=0;const x=cx(i)-bw/2;segs.forEach(([k,c])=>{const v=d[k][i];svg.append(NS('rect',{x,y:Y(acc+v),width:bw,height:Math.max(0,Y(acc)-Y(acc+v)),fill:cv(c),opacity:.95}));acc+=v;});T(svg,cx(i),H-8,l,'middle',7,'--i3');});
}
function chRet(){const svg=document.getElementById('c-ret'),W=420,H=210,L=38,Rr=32,Tp=10,B=24,pw=W-L-Rr,ph=H-Tp-B;
 const d=F.retail,n=d.lab.length,bw=pw/n*0.6;
 const lo=Math.min(...d.lvl)*0.985,hi=Math.max(...d.lvl)*1.01,Y=v=>Tp+ph*(hi-v)/((hi-lo)||1),cx=i=>L+pw*(i+0.5)/n;
 [lo,(lo+hi)/2,hi].forEach(v=>{svg.append(NS('line',{x1:L,x2:W-Rr,y1:Y(v),y2:Y(v),stroke:cv('--bg1')}));T(svg,L-4,Y(v)+3,Math.round(v),'end',7,'--i3');});
 d.lvl.forEach((v,i)=>{svg.append(NS('rect',{x:cx(i)-bw/2,y:Y(v),width:bw,height:ph-(Y(v)-Tp),fill:cv('--bl'),opacity:.85}));if(i%2===0)T(svg,cx(i),H-8,d.lab[i],'middle',7,'--i3');});
 const yo=d.yoy,ylo=Math.min(...yo)-0.5,yhi=Math.max(...yo)+0.5,YY=v=>Tp+ph*(yhi-v)/((yhi-ylo)||1);
 [ylo,(ylo+yhi)/2,yhi].forEach(v=>T(svg,W-Rr+4,YY(v)+3,v.toFixed(1)+'%','start',7,'--yoy'));
 PL(svg,yo.map((v,i)=>[cx(i),YY(v)]),'--yoy',2);yo.forEach((v,i)=>svg.append(NS('circle',{cx:cx(i),cy:YY(v),r:2.2,fill:cv('--yoy')})));
}
function chConf(){const svg=document.getElementById('c-conf'),W=420,H=210,L=34,Rr=10,Tp=10,B=24,pw=W-L-Rr,ph=H-Tp-B;
 const d=F.conf,n=d.lab.length,all=d.umich.concat(d.cb),lo=Math.min(...all)-3,hi=Math.max(...all)+3,Y=v=>Tp+ph*(hi-v)/((hi-lo)||1),X=i=>L+pw*i/(n-1);
 [lo,(lo+hi)/2,hi].forEach(v=>{svg.append(NS('line',{x1:L,x2:W-Rr,y1:Y(v),y2:Y(v),stroke:cv('--bg1')}));T(svg,L-4,Y(v)+3,Math.round(v),'end',7,'--i3');});
 d.lab.forEach((l,i)=>{if(i%2===0)T(svg,X(i),H-8,l,'middle',7,'--i3');});
 PL(svg,d.umich.map((v,i)=>[X(i),Y(v)]),'--bl',1.8);PL(svg,d.cb.map((v,i)=>[X(i),Y(v)]),'--vi',1.8);
 [['--bl',d.umich],['--vi',d.cb]].forEach(([c,a])=>{const i=a.length-1;svg.append(NS('circle',{cx:X(i),cy:Y(a[i]),r:2.4,fill:cv(c)}));});
}
chNFP();chDur();chRet();chConf();
</script></body></html>
