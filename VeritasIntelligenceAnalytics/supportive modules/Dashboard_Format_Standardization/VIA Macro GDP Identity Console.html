 const W=380,H=200,L=30,Rr=8,T=8,B=24,pw=W-L-Rr,ph=H-T-B;
 const lab=r.pmi.lab,mfg=r.pmi.mfg,nm=r.pmi.nm,all=mfg.concat(nm);
 let lo=Math.min(...all,50),hi=Math.max(...all,50);lo=Math.floor(lo-1);hi=Math.ceil(hi+1);
 const X=i=>L+pw*i/(lab.length-1),Y=v=>T+ph*(hi-v)/(hi-lo);
 [46,48,50,52,54].forEach(t=>{if(t<lo||t>hi)return;svg.append(NS('line',{x1:L,x2:W-Rr,y1:Y(t),y2:Y(t),stroke:cssv('--bg1'),'stroke-width':1}));
   svg.append(txt(L-4,Y(t)+3,t,'end',8,'--i3'));});
 svg.append(NS('line',{x1:L,x2:W-Rr,y1:Y(50),y2:Y(50),stroke:cssv('--i3'),'stroke-width':1,'stroke-dasharray':'3 3'}));
 lab.forEach((l,i)=>{if(i%2)return;svg.append(txt(X(i),H-8,l,'middle',7.5,'--i3'));});
 svg.append(poly(mfg.map((v,i)=>[X(i),Y(v)]),'--bl',1.8));
 svg.append(poly(nm.map((v,i)=>[X(i),Y(v)]),'--tl',1.8));
 [['--bl',mfg],['--tl',nm]].forEach(([c,a])=>{const i=a.length-1;svg.append(NS('circle',{cx:X(i),cy:Y(a[i]),r:2.6,fill:cssv(c)}));
   svg.append(txt(X(i)-3,Y(a[i])-5,a[i].toFixed(1),'end',8.5,c));});
}
function drawGDP(code,r){
 const svg=document.getElementById('gdp-'+code);if(!svg)return;
 const W=380,H=200,L=34,Rr=30,T=10,B=22,pw=W-L-Rr,ph=H-T-B;
 const q=r.gdp_q,n=q.length,bw=pw/n*0.56;
 let top=0,bot=0;q.forEach(d=>{const pos=d.C+d.I+d.G+Math.max(d.NX,0);top=Math.max(top,pos);bot=Math.min(bot,Math.min(d.NX,0));});
 top=top*1.08;const span=top-bot||1;
 const cx=i=>L+pw*(i+0.5)/n, Y=v=>T+ph*(top-v)/span, y0=Y(0);
 // left axis ticks
 for(let t=0;t<=4;t++){const v=top*t/4,yy=Y(v);svg.append(NS('line',{x1:L,x2:W-Rr,y1:yy,y2:yy,stroke:cssv('--bg1'),'stroke-width':1}));svg.append(txt(L-4,yy+3,Math.round(v),'end',7.5,'--i3'));}
 // right axis YoY scale
 const ys=q.map(d=>d.yoy);let ylo=Math.min(...ys,0),yhi=Math.max(...ys);ylo=Math.floor(ylo-0.5);yhi=Math.ceil(yhi+0.5);
 const YY=v=>T+ph*(yhi-v)/((yhi-ylo)||1);
 for(let t=0;t<=3;t++){const v=ylo+(yhi-ylo)*t/3;svg.append(txt(W-Rr+4,YY(v)+3,v.toFixed(0)+'%','start',7.5,'--yoy'));}
 const segs=[['C','--bl'],['I','--tl'],['G','--vi']];
 q.forEach((d,i)=>{let acc=0;const x=cx(i)-bw/2;
   segs.forEach(([k,c])=>{const v=d[k];svg.append(NS('rect',{x:x,y:Y(acc+v),width:bw,height:Math.max(0,Y(acc)-Y(acc+v)),fill:cssv(c),opacity:.92}));acc+=v;});
   // NX (above if +, below 0 if -)
   if(d.NX>=0){svg.append(NS('rect',{x:x,y:Y(acc+d.NX),width:bw,height:Math.max(0,Y(acc)-Y(acc+d.NX)),fill:cssv('--am'),opacity:.92}));}
   else{svg.append(NS('rect',{x:x,y:y0,width:bw,height:Math.max(0,Y(d.NX)-y0),fill:cssv('--am'),opacity:.55}));}
   svg.append(txt(cx(i),H-7,d.q,'middle',7.5,'--i3'));});
 // zero line
 svg.append(NS('line',{x1:L,x2:W-Rr,y1:y0,y2:y0,stroke:cssv('--bd2'),'stroke-width':1}));
 // YoY line (green, right axis)
 svg.append(poly(q.map((d,i)=>[cx(i),YY(d.yoy)]),'--yoy',2));
 q.forEach((d,i)=>{svg.append(NS('circle',{cx:cx(i),cy:YY(d.yoy),r:2.6,fill:cssv('--yoy')}));
   svg.append(txt(cx(i),YY(d.yoy)-5,d.yoy.toFixed(1),'middle',8,'--yoy'));});
}
function txt(x,y,t,anchor,size,col){return NS('text',{x:x,y:y,'text-anchor':anchor,'font-size':size,fill:cssv(col),'font-family':cssv('--mo')}),(()=>{const e=NS('text',{x:x,y:y,'text-anchor':anchor,'font-size':size,fill:cssv(col),'font-family':"DM Mono, monospace"});e.textContent=t;return e;})();}
function poly(pts,col,w){return NS('polyline',{points:pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' '),fill:'none',stroke:cssv(col),'stroke-width':w,'stroke-linejoin':'round','stroke-linecap':'round'});}
document.addEventListener('keydown',e=>{const b=[...document.querySelectorAll('#tabs button')],c=b.findIndex(x=>x.classList.contains('on'));
 if(e.key==='ArrowRight')b[(c+1)%b.length]?.click();else if(e.key==='ArrowLeft')b[(c-1+b.length)%b.length]?.click();else if(e.key>='1'&&e.key<='5')b[+e.key-1]?.click();});
</script></body></html>
