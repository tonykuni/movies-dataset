<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VIA · PSU & THERMAL SOLUTIONS ONE · 產業×個股全合一</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f4f0;--paper:#fff;--paper2:#fafaf8;--ink:#1e1d1a;--ink2:#33403f;--mut:#6b6860;--mut2:#9c9890;
 --line:#dbd9d3;--soft:#ecebe6;--blue:#4c78a8;--teal:#439a9a;--up:#c96b5a;--down:#5a9e6f;--am:#c4943a;--vi:#7a6daa;}
*{box-sizing:border-box;margin:0;padding:0}html,body{background:var(--bg);height:100%}
body{color:var(--ink2);font-family:'DM Sans','Noto Sans TC',system-ui,sans-serif;font-size:12px;line-height:1.5;display:flex;flex-direction:row}
.side{width:232px;flex:none;overflow:auto;border-right:1px solid var(--line);padding:12px 10px 20px;background:var(--paper2);transition:margin .18s ease;scrollbar-width:thin}
.side.hide{margin-left:-232px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh}
h1{font:800 15px/1.25 'Syne','Noto Sans TC',sans-serif;color:var(--ink)}
h1 .flow{display:block;font:500 9px 'DM Mono',monospace;color:var(--mut2);margin-top:3px}
.gl{font:800 10px 'DM Mono',monospace;letter-spacing:1px;padding:10px 2px 4px;text-transform:uppercase;border-bottom:1px solid var(--soft);margin-bottom:2px}
.gl.g1{color:var(--vi)}.gl.g2{color:var(--up)}.gl.g3{color:var(--blue)}.gl.g4{color:var(--teal)}.gl.g5{color:var(--am)}
.tab{font:700 12px 'DM Sans','Noto Sans TC',sans-serif;color:var(--ink2);padding:7px 8px;cursor:pointer;border-left:3px solid transparent;letter-spacing:.3px;border-radius:0 4px 4px 0}
.tab.on{color:var(--vi);border-left-color:var(--vi);background:var(--paper)}
.tab:hover:not(.on){color:var(--ink)}
.tab .no{font:700 9px 'DM Mono',monospace;color:var(--mut2);margin-right:5px}
.meta{display:flex;gap:10px;align-items:center;padding:6px 8px;font:500 10px 'DM Mono',monospace;color:var(--mut)}
.meta .code{color:var(--vi);font-weight:700}
.meta a{font:700 9px 'DM Mono',monospace;color:var(--ink2);border:1px solid var(--line);border-radius:4px;padding:4px 8px;text-decoration:none;background:var(--paper2)}
.meta .sp{margin-left:auto}
.tgl{font:700 12px 'DM Mono',monospace;cursor:pointer;border:1px solid var(--line);border-radius:4px;padding:4px 9px;background:var(--paper2);color:var(--ink2)}
.stage{flex:1;min-height:0}
iframe{width:100%;height:100%;border:none;border-top:1px solid var(--line);background:#fff}
</style></head><body>
<div class="side" id="side">
 <h1>PSU / POWER SOLUTIONS <span class="flow">產業模板 最強版 · 產業×個股全數整合去重 · 零複本 · VIA-M-PTONE</span></h1>
 <input id="q" placeholder="🔍 搜尋模組/編碼…" style="width:100%;margin:8px 0 0;font:600 10px 'DM Mono','Noto Sans TC',monospace;border:1px solid var(--line);border-radius:5px;padding:6px 8px;background:var(--paper);color:var(--ink)">
 <div class="tabs" id="tabs"></div>
</div>
<div class="main">
<div class="meta"><button class="tgl" id="tgl" title="收合面板">☰</button><span id="mCode" class="code"></span><span id="mFile"></span><span class="sp"></span><a id="mOpen" href="#" target="_blank">↗ 開新視窗</a><a href="VIA Master Console.html">🎛 主控台</a></div>
<div class="stage"><iframe id="fr" title="psu thermal module"></iframe><div id="stk" style="display:none;overflow:auto;height:100%;background:#fff;border-top:1px solid var(--line)"></div></div>
</div>
<script>
// 產業×個股 全部合一(依主控台 ind 註冊表 · 零複本)
const ALL=[
 {g:"總覽", no:"▤", t:"一頁式 全數下排", code:"PT-STACK", stack:true},
 {g:"總覽", no:"12", t:"PSU/Thermal Solutions(主)", code:"VIA-M-CHIP", file:"uploads/VIA_ChipAnalysis_Platform_v2-5f1f08a0.html"},
 {g:"總覽", no:"14", t:"PSU/Thermal 一體", code:"VIA-M-AIO", file:"modules/PSU_Thermal_AllInOne.html"},
 {g:"總覽", no:"10", t:"產業智慧中樞", code:"VIA-M-HUB", file:"VIA Industry Intelligence Hub.html"},
 {g:"總覽", no:"1B", t:"行業360 情報套件", code:"VIA-M-I360", file:"uploads/VIA_Industry360_Intelligence_Suite_Professional-eb59a451.html"},
 {g:"BOM", no:"1I", t:"BOM 一體 SAP BOM ONE", code:"VIA-M-BOMONE", file:"VIA BOM One.html"},
 {g:"BOM", no:"13", t:"SAP Super BOM", code:"VIA-M-SUPERBOM", file:"modules/PowerThermal_SAP_SuperBOM_v2.html"},
 {g:"BOM", no:"19", t:"BOM/ASP/單位成本", code:"VIA-M-BOMCOST", file:"VIA BOM ASP Unit-Cost Analyst.html"},
 {g:"BOM", no:"1A", t:"產業 BOM 專業版", code:"VIA-M-IBOM", file:"uploads/VIA_Industry_BOM_Professional_HTML-c3b1730a.html"},
 {g:"BOM", no:"1D", t:"SuperBOM 財務模型", code:"VIA-M-SBFIN", file:"uploads/SuperBOM_Financial_Model-a312c2f3.html"},
 {g:"BOM", no:"1E", t:"BOM 成本主控台", code:"VIA-M-BOMCC", file:"uploads/VIA_BOM_Cost_Console-0e9c2783.html"},
 {g:"製程資本", no:"11", t:"製程設備資本", code:"VIA-M-CAPEX", file:"VIA Capex Process Equipment Analysis.html"},
 {g:"製程資本", no:"1H", t:"商品因子基準", code:"VIA-M-CFB", file:"uploads/VIA_Commodity_Factor_Benchmark_v0100.html"},
 {g:"個股同業", no:"1J", t:"VENDOR×CUSTOMER LIST", code:"VIA-M-VENCUS", file:"VIA Vendor Customer List.html"},
 {g:"個股同業", no:"1F", t:"能力矩陣 PEERS", code:"VIA-M-CAPMX", file:"uploads/VIA_Capability_Matrix (3)-0c8d3e99.html"},
 {g:"個股同業", no:"1G", t:"成本結構同業驗證", code:"VIA-M-PEERV", file:"uploads/VIA_CostStructure_Peer_Verify.html"},
 {g:"登錄", no:"15", t:"PSU/Thermal SSOT", code:"VIA-M-PTSSOT", file:"modules/PSU_Thermal_SSOT.html"},
 {g:"登錄", no:"1C", t:"電源散熱登錄", code:"VIA-M-PTREG", file:"modules/PowerThermal_Registry.html"},
 {g:"登錄", no:"18", t:"因子字典矩陣", code:"VIA-M-FDM", file:"uploads/factor_dict_matrix-aee4ee50.html"}
];
const GC={"總覽":"g1","BOM":"g2","製程資本":"g3","個股同業":"g4","登錄":"g5"};
const $=s=>document.querySelector(s);
let CUR=0;
const P=new URLSearchParams(location.search);
if(P.get("m")){const i=ALL.findIndex(e=>e.code===P.get("m")||e.no===P.get("m"));if(i>=0)CUR=i;}
function render(){
 let h="",lastG="";const Q=($("#q")&&$("#q").value.trim().toLowerCase())||"";
 ALL.forEach((e,i)=>{
  if(Q&&!((e.no+" "+e.t+" "+e.code).toLowerCase().includes(Q)))return;
  if(e.g!==lastG){lastG=e.g;h+='<div class="gl '+GC[e.g]+'">▙ '+e.g+'</div>';}
  h+='<div class="tab'+(i===CUR?" on":"")+'" data-i="'+i+'"><span class="no">'+e.no+'</span>'+e.t+'</div>';});
 $("#tabs").innerHTML=h;
 document.querySelectorAll(".tab").forEach(el=>el.onclick=()=>{CUR=+el.dataset.i;render();});
 const e=ALL[CUR];
 $("#mCode").textContent=e.code;$("#mFile").textContent=e.file||(ALL.length-1)+" 模組下排";$("#mOpen").href=e.file||"#";
 const fr=$("#fr"),stk=$("#stk");
 if(e.stack){
  fr.style.display="none";stk.style.display="";
  if(!stk.dataset.done){stk.innerHTML=ALL.filter(x=>x.file).map(x=>'<div style="font:700 10px \'DM Mono\',monospace;color:#6b6860;padding:8px 12px 4px">▾ '+x.no+' · '+x.t+' · '+x.code+'</div><iframe src="'+x.file+'" style="width:100%;height:92vh;border:none;border-top:1px solid #dbd9d3;background:#fff" title="stacked"></iframe>').join("");stk.dataset.done="1";}
 }else{
  stk.style.display="none";fr.style.display="";
  const want=new URL(e.file,location.href).href;
  if(fr.src!==want)fr.src=want;
 }
 try{history.replaceState(null,"","?m="+e.code);}catch(_){}
}
$("#q")&&($("#q").oninput=()=>render());
$("#tgl").onclick=()=>$("#side").classList.toggle("hide");
render();
</script>
</body></html>
