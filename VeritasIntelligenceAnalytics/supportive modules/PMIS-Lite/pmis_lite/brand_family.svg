  <!-- 註腳 -->
  <text x="46" y="630" font-size="10.5" fill="#9c9890">母體 → 產品 → 引擎 → 精靈 → 模組　·　全本機主權 · 只增不減 · 滑鼠優先 · 27/27 測試</text>
  <rect x="828" y="606" width="46" height="34" rx="3" fill="#b03a2e"/>
  <text x="851" y="630" text-anchor="middle" font-size="20" font-weight="700" fill="#f5f4f0" font-family="'Noto Serif TC',serif">理</text>
