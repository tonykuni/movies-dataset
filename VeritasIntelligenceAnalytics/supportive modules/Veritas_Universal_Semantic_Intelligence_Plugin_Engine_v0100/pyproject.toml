[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veritas-universal-semantic-plugin"
version = "1.0.0"
description = "Standalone CPU-first host-neutral NLP, ML, tiny-DL and knowledge plugin"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
vusipe = "VUSIPE:main"

[tool.setuptools]
py-modules = ["VUSIPE", "adapter"]
