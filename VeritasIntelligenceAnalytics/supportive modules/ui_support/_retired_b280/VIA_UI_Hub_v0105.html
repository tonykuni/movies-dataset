<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>VIA UI Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Serif+TC:wght@500;600&display=swap" rel="stylesheet">
<style>:root{--bg:#f0efeb;--paper:#fbfaf7;--paper2:#fdfbf6;--ink:#1b1a17;--mut:#6b6860;--mut2:#9aa5a1;--hair:#dcdad3;
--seal:#9e2b25;--teal:#3d8f8f;--navy:#24457f;--tealgr:#3c6660;--gold:#8a7340;--slate:#3f4f78;--olive:#5e5540;--moss:#4a6b45;
--serif:'Cormorant Garamond',Georgia,serif;--cjk:'Noto Serif TC','Noto Serif CJK TC','Songti TC','PMingLiU',serif;
--mono:'SFMono-Regular',Consolas,'Liberation Mono',monospace;--sans:'Microsoft JhengHei','Segoe UI',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);height:100vh;display:flex;flex-direction:column;overflow:hidden}
.top{padding:18px 26px 0}
.eyebrow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.chip{padding:2px 7px;background:var(--ink);color:#fbfaf7;font:700 9px var(--mono);letter-spacing:.14em}
.ey{font:700 8.5px var(--mono);letter-spacing:.13em;color:var(--mut);text-transform:uppercase}
header{display:flex;align-items:center;padding-bottom:14px;border-bottom:3px solid var(--seal)}
.hseal{width:38px;height:38px;background:var(--seal);color:#fbfaf7;display:flex;align-items:center;justify-content:center;font-family:var(--cjk);font-size:20px;border-radius:4px;margin-right:12px}
h1{font:500 19px/1.2 var(--serif);letter-spacing:.055em}
.wmcjk{font:600 9.5px var(--cjk);letter-spacing:.22em;color:var(--teal);margin-top:2px}
.layout{flex:1;display:flex;min-height:0}
.panel{width:264px;flex:none;background:var(--paper);border-right:1px solid var(--hair);padding:16px 14px;overflow-y:auto}
.gh{font:700 10px var(--mono);letter-spacing:2px;color:var(--mut);text-transform:uppercase;margin:14px 0 8px;display:flex;align-items:center;gap:8px}
.gh:first-child{margin-top:0}
.gh .zh{font:600 11px var(--cjk);letter-spacing:.3em;color:var(--tealgr)}
.gh .ln{flex:1;height:1px;background:var(--hair)}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{display:flex;flex-direction:column;align-items:center;gap:5px;background:var(--paper2);border:1px solid var(--hair);border-top:3px solid var(--acc,var(--navy));border-radius:6px;padding:10px 6px 8px;cursor:pointer;transition:.12s}
.btn:hover{border-color:var(--acc,var(--navy))}
.btn.on{background:var(--ink);border-color:var(--ink);border-top-color:var(--acc,var(--navy))}
.btn.on .bn{color:#fbfaf7}.btn.on .bm{color:var(--mut2)}
.bseal{width:30px;height:30px;background:var(--seal);color:#fbfaf7;display:flex;align-items:center;justify-content:center;font-family:var(--cjk);font-size:16px;border-radius:4px}
.bn{font:600 11px var(--sans);letter-spacing:.02em}
.bm{font:500 8px var(--mono);color:var(--mut2)}
.main{flex:1;padding:26px 30px;overflow-y:auto}
.strip{height:4px;background:linear-gradient(90deg,#24457f 0 16.6%,#3c6660 0 33.3%,#4a6b45 0 50%,#8a7340 0 66.6%,#5e5540 0 83.3%,#3f4f78 0 100%);margin-bottom:22px;border-radius:2px}
.detail{background:var(--paper2);border:1px solid var(--hair);border-left:4px solid var(--acc,var(--navy));border-radius:8px;padding:24px 26px;max-width:720px}
.drow{display:flex;gap:16px;align-items:flex-start}
.dseal{flex:none;width:64px;height:64px;background:var(--seal);color:#fbfaf7;display:flex;align-items:center;justify-content:center;font-family:var(--cjk);font-size:34px;border-radius:6px}
.dwm{font:600 20px var(--serif);letter-spacing:.05em}
.dsub{font-size:13px;color:var(--mut);margin-top:2px}
.dzone{display:inline-block;margin-top:8px;font:700 9px var(--mono);letter-spacing:.12em;color:var(--tealgr);border:1px solid var(--hair);border-radius:3px;padding:2px 8px;background:var(--paper)}
.dmeta{font:500 11px var(--mono);color:var(--mut);margin-top:16px;line-height:1.9;border-top:1px solid var(--hair);padding-top:12px}
.dcmd{display:inline-block;margin-top:14px;font:700 13px var(--mono);background:var(--ink);color:#fbfaf7;border-radius:5px;padding:7px 16px}
.dopen{display:inline-block;margin-top:14px;margin-left:8px;font:700 12px var(--mono);color:var(--tealgr);border:1px solid var(--tealgr);border-radius:5px;padding:7px 14px;text-decoration:none}
.dopen:hover{background:var(--tealgr);color:#fbfaf7}
footer{padding:10px 26px;border-top:1px solid var(--hair);font:10px var(--mono);color:var(--mut2);background:var(--paper)}
@media(max-width:760px){.layout{flex-direction:column}.panel{width:100%;border-right:none;border-bottom:1px solid var(--hair)}body{overflow:auto;height:auto}}
</style></head><body>

<div class="eyebrow"><span class="chip">v0105</span><span class="ey">Veritas Intelligence Analytics UI Hub · Porcelain</span></div>
