<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>VAP 分析台 v0100</title><style>
:root{--fs:clamp(11.5px,2.8vw,13px);--ok:#15803d;--fail:#b91c1c;--skip:#a16207;--run:#1d4ed8}
*{box-sizing:border-box}
body{margin:0;background:#f6f7f9;color:#1f2937;font:var(--fs)/1.55 'Segoe UI','Noto Sans TC',sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:clamp(8px,1.5vw,16px)}
h1{font-size:clamp(1rem,2.2vw,1.25rem);margin:.3em 0 .1em}
.mut{color:#94a3b8}.lane{display:inline-block;background:#fef9c3;border:1px solid #fde047;
border-radius:6px;padding:1px 8px;font-size:.85em;margin:.3em 0}
.lane.db{background:#dcfce7;border-color:#86efac}
.tabs{display:flex;gap:6px;margin:.6em 0;position:sticky;top:0;background:#f6f7f9;padding:4px 0;z-index:5}
.tab{flex:1;font:inherit;border:1px solid #e5e7eb;background:#fff;border-radius:9px;
padding:9px 4px;cursor:pointer;min-height:42px;font-weight:600;color:#475569}
.tab.on{background:#111827;color:#e5e7eb;border-color:#111827}
section{display:none}section.on{display:block}
table{border-collapse:collapse;width:100%;background:#fff}
th,td{border:1px solid #e5e7eb;padding:5px 7px;text-align:right;overflow-wrap:anywhere}
th{background:#eef2f7;position:sticky;top:52px}
td:first-child,th:first-child,td:nth-child(2),th:nth-child(2){text-align:left}
.tblbox{overflow-x:auto;border-radius:9px;border:1px solid #e5e7eb;margin:.4em 0}
.up{color:var(--ok)}.dn{color:var(--fail)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:.5em 0}
.chip{font:inherit;border:1px solid #cbd5e1;background:#fff;border-radius:999px;
padding:7px 13px;cursor:pointer;min-height:38px}
.chip.sel{background:#1d4ed8;color:#fff;border-color:#1d4ed8}
.chip:disabled{opacity:.4}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:.4em 0}
.act{font:inherit;border:1px solid #e5e7eb;background:#111827;color:#e5e7eb;
border-radius:9px;padding:8px 16px;cursor:pointer;min-height:40px}
.act:disabled{opacity:.45}
.note{background:#fff;border:1px solid #e5e7eb;border-radius:9px;padding:6px 10px;margin:.4em 0}
.off{background:#fee2e2;border:1px solid #fecaca;border-radius:8px;padding:6px 10px;margin:.4em 0;display:none}
.foot{color:#94a3b8;font-size:.85em;margin-top:.8em;border-top:1px solid #f1f5f9;padding-top:5px}
@media (max-width:640px){th{top:50px}}
</style></head>
<body><div class="wrap">
<h1>VAP 分析台(月營收 · 族群 · ETF 持股加總)</h1>
<div class="mut">本機橋 127.0.0.1:8765 · 唯讀誠實雙道(庫直讀↔fixture 示範) · 點分頁即載</div>
<div class="off" id="offline">⚠ 本機橋未連線——於倉庫根跑:<b>python "VeritasIntelligenceAnalytics\supportive modules\registry\CGC_MDL095_DeckServer_v0105.py" serve</b></div>

<div class="tabs">
<button class="tab on" id="tb-rev" onclick="show('rev')">月營收分析</button>
<button class="tab" id="tb-grp" onclick="show('grp')">族群分析</button>
<button class="tab" id="tb-etf" onclick="show('etf')">ETF 持股</button>
</div>

<section id="s-rev" class="on"><div id="rev">載入中…</div></section>
<section id="s-grp"><div id="grp"></div></section>
<section id="s-etf">
  <div class="bar">
    <button class="act" id="combo-toggle" onclick="toggleCombo()">組合模式:關</button>
    <button class="act" id="combo-go" onclick="runCombo()" disabled>持股加總(0)</button>
    <span class="mut" id="etf-hint">點一檔=個別持股;開組合模式=多選再加總</span>
  </div>
  <div class="chips" id="chips">載入中…</div>
  <div id="etfout"></div>
</section>

<div class="foot">VAP_ENG013 × DeckServer v0105 · 唯讀零改動 · lane 必標(示範道≠實庫) · 誠實三態</div>
<script>
var comboOn=false, picked=[];
function el(i){return document.getElementById(i)}
function show(k){['rev','grp','etf'].forEach(function(x){
  el('s-'+x).classList.toggle('on',x===k);el('tb-'+x).classList.toggle('on',x===k);});
  if(k==='rev'&&!el('rev').dataset.done)loadRev();
  if(k==='grp'&&!el('grp').dataset.done)loadGrp();
  if(k==='etf'&&!el('chips').dataset.done)loadChips();
}
function J(u){return fetch(u).then(function(r){return r.json()})
 .catch(function(){el('offline').style.display='block';throw 0;});}
function laneTag(t){var db=(t||'').indexOf('庫直讀')===0;
 return '<span class="lane'+(db?' db':'')+'">'+(t||'—')+'</span>';}
function num(v,d){return (v===null||v===undefined||v==='')?'—':Number(v).toFixed(d===undefined?1:d);}
function loadRev(){J('/vap_revenue').then(function(d){
 var h=laneTag(d.lane)+' <b>'+(d.ym||'')+'</b>';
 if(d.top_yoy&&d.top_yoy.length){
  h+='<div class="tblbox"><table><tr><th>代號</th><th>族群</th><th>營收(億)</th><th>MoM%</th><th>YoY%</th><th>動能分</th></tr>';
  d.top_yoy.forEach(function(r){h+='<tr><td>'+r[0]+'</td><td>'+(r[4]||'—')+'</td><td>'+num(r[1]/1e8)+
   '</td><td>'+num(r[2])+'</td><td class="'+((r[3]||0)>=0?'up':'dn')+'">'+num(r[3])+'</td><td>'+num(r[5])+'</td></tr>';});
  h+='</table></div>';}
 if(d.sectors&&d.sectors.length){h+='<div class="mut">族群彙總(檔數/合計億)</div><div class="tblbox"><table><tr><th>族群</th><th>檔數</th><th>合計(億)</th></tr>';
  d.sectors.forEach(function(s){h+='<tr><td>'+s[0]+'</td><td>'+s[1]+'</td><td>'+s[2]+'</td></tr>';});h+='</table></div>';}
 if(d.note)h+='<div class="note">'+d.note+'</div>';
 el('rev').innerHTML=h;el('rev').dataset.done=1;});}
function loadGrp(){J('/vap_groups').then(function(d){
 var h=laneTag(d.lane)+' <b>'+(d.date||'')+'</b> <span class="mut">vs '+(d.prev||'—')+' · 族群 '+(d.total_groups||0)+'</span>';
 h+='<div class="tblbox"><table><tr><th>族群</th><th>家數</th><th>漲</th><th>跌</th><th>量能(億)</th><th>均PE</th><th>殖利率%</th></tr>';
 (d.groups||[]).forEach(function(g){h+='<tr><td>'+g[0]+'</td><td>'+g[1]+'</td><td class="up">'+g[2]+
  '</td><td class="dn">'+g[3]+'</td><td>'+num(g[4])+'</td><td>'+num(g[5])+'</td><td>'+num(g[6],2)+'</td></tr>';});
 h+='</table></div>';
 el('grp').innerHTML=h;el('grp').dataset.done=1;});}
function loadChips(){J('/vap_etflist').then(function(d){
 var h='';(d.etfs||[]).forEach(function(e){
  h+='<button class="chip" id="c-'+e[0]+'" '+(e[2]?'':'disabled title="持股源無此檔(誠實)"')+
   ' onclick="tapEtf(\''+e[0]+'\')">'+e[0]+' '+e[1]+(e[2]?'':' ∅')+'</button>';});
 el('chips').innerHTML=h+'<div class="mut" style="flex-basis:100%">冊 '+(d.n_book||0)+' 檔 · 可點 '+
  (d.n_holdable||0)+' · 持股源:'+(d.lane_hold||'—')+'</div>';
 el('chips').dataset.done=1;});}
function toggleCombo(){comboOn=!comboOn;picked=[];refreshSel();
 el('combo-toggle').textContent='組合模式:'+(comboOn?'開':'關');}
function refreshSel(){document.querySelectorAll('.chip').forEach(function(c){
  c.classList.toggle('sel',picked.indexOf(c.id.slice(2))>=0);});
 el('combo-go').disabled=picked.length<2;
 el('combo-go').textContent='持股加總('+picked.length+')';}
function tapEtf(id){
 if(comboOn){var i=picked.indexOf(id);if(i>=0)picked.splice(i,1);else picked.push(id);
  refreshSel();return;}
 J('/vap_etf?ids='+id).then(function(d){renderH(d);});}
function runCombo(){J('/vap_etf?ids='+picked.join(',')).then(function(d){renderH(d);});}
function renderH(d){
 var h=laneTag(d.lane);
 if(d.err||d.note&&!d.per&&!d.combo){h+='<div class="note">'+(d.err||d.note)+'</div>';el('etfout').innerHTML=h;return;}
 if(d.mode==='individual'){var k=Object.keys(d.per)[0];
  h+='<div class="mut">個別持股:'+k+'(權重榜)</div><div class="tblbox"><table><tr><th>股</th><th>名稱</th><th>權重%</th></tr>';
  d.per[k].forEach(function(r){h+='<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+num(r[2],2)+'</td></tr>';});
  h+='</table></div>';}
 if(d.mode==='combo'){
  h+='<div class="mut">組合加總('+d.ids.join('+')+' · '+d.n_etf+' 檔等權)</div>'+
   '<div class="tblbox"><table><tr><th>股</th><th>名稱</th><th>組合權重%</th><th>出現檔數</th></tr>';
  d.combo.forEach(function(r){h+='<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+num(r[2],2)+
   '</td><td>'+r[3]+'/'+d.n_etf+'</td></tr>';});
  h+='</table></div><div class="note">'+(d.note||'')+'</div>';}
 el('etfout').innerHTML=h;}
loadRev();
fetch('/ping').then(function(r){return r.json()}).then(function(){el('offline').style.display='none';})
 .catch(function(){el('offline').style.display='block';});
</script></body></html>
