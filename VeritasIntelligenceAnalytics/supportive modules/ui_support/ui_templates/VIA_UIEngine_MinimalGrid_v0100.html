<!doctype html>
<!-- VIA_UIEngine_MinimalGrid_v0100 · CGC_MDL257 範例範本(Start-VIA-UIEngine-v0100.ps1 -Template VIA_UIEngine_MinimalGrid_v0100)
     示範兩種接法:① 雙大括號變數(config.app_title · config.theme.* · duckdb.n_dbs …,任何環境都代換)
     ② 產生器注入的 window.VIA(資料)/ window.VIA_CONFIG(參數)/ :root 色票(--via-primary · --via-bg · --via-sidebar …),JS 從它畫。
     未來的設計稿照這兩種接法改版面即可,不必改引擎。 -->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ config.app_title }} · 精簡格</title>
<style>
body{margin:0;font:var(--via-fs,12.5px)/1.4 var(--via-font,system-ui,sans-serif);background:var(--via-bg);color:var(--via-fg);display:grid;grid-template-columns:var(--via-sidebar,240px) 1fr;min-height:100vh}
.sidebar{background:var(--via-card);border-right:1px solid rgba(127,127,127,.2);padding:16px}
.sidebar h2{margin:0 0 8px;color:var(--via-primary);font-size:17px}
.main{padding:20px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--via-cards-min,200px),1fr));gap:10px}
.card{background:var(--via-card);border:1px solid rgba(127,127,127,.2);border-radius:8px;padding:12px}
.card b{display:block;font-size:22px;color:var(--via-primary)}
.btn{background:var(--via-primary);color:#fff;border:0;border-radius:5px;padding:6px 14px;cursor:pointer}
table{border-collapse:collapse;width:100%;margin-top:12px}th,td{padding:4px 6px;border-bottom:1px solid rgba(127,127,127,.2);text-align:left}
</style>
</head>
<body>
<div class="sidebar"><h2>{{ config.app_title }}</h2><div>精簡格範本 · 主色 {{ config.theme.primary_color }}</div><div>產生 {{ built }}</div></div>
<div class="main">
 <div class="cards">
  <div class="card">DuckDB 庫<b>{{ duckdb.n_dbs }}</b></div>
  <div class="card">表 / 視圖<b>{{ duckdb.n_tables }}</b></div>
  <div class="card">環境 LKGC<b>{{ env.lkgc }}</b></div>
 </div>
 <table id="t"><tr><th>庫</th><th>燈</th><th>表</th><th>MB</th></tr></table>
 <p><button class="btn" onclick="alert('範本按鈕:引擎只讀,操作走 PS 啟動器 / VCGC')">測試按鈕</button></p>
</div>
<script>
(function () {
  var D = (window.VIA && window.VIA.duckdb) || { dbs: [] }, t = document.getElementById('t');
  var esc = function (v) { return String(v === null || v === undefined ? '' : v).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  D.dbs.forEach(function (d) { t.insertAdjacentHTML('beforeend', '<tr><td>' + esc(d.name) + '</td><td>' + esc(d.state) + '</td><td>' + d.tables.length + '</td><td>' + esc(d.mb) + '</td></tr>'); });
})();
</script>
</body>
</html>
