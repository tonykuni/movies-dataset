// tabs + pages
const tabs=document.getElementById('tabs'), pages=document.getElementById('pages');
REG.regions.forEach((r,i)=>{
  const b=document.createElement('button'); if(i===0)b.className='on';
  b.innerHTML=`<span class="key">${i+1}</span>${r.code} ${r.name.split(' ')[0]}`;
  b.onclick=()=>sw(b,'pg'+i); tabs.appendChild(b);
  const pg=document.createElement('div'); pg.className='pg'+(i===0?' on':''); pg.id='pg'+i;
  pg.innerHTML=renderRegion(r); pages.appendChild(pg);
});
function sw(btn,id){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.remove('on'));
  document.querySelectorAll('.pg').forEach(p=>p.classList.remove('on'));
  btn.classList.add('on'); document.getElementById(id).classList.add('on');
  window.scrollTo({top:0,behavior:'smooth'});
}
function renderRegion(r){
  let h=`<div class="lei"><div class="lei-t">領先複合指標 · COMPOSITE LEADING（先看這個）</div>`+
        `<div class="lei-b">${r.lei}</div>`+
        (r.note?`<div class="lei-note">⚠ ${r.note}</div>`:'')+
        `<div class="lei-note" style="color:var(--i3)">來源:${r.src}</div></div>`;
  // group blocks by dominant timing, preserve leading-first order
  const order=['L','C','G','P'], labels={L:'領先 LEADING — 主訊號',C:'同步 COINCIDENT — 現況',G:'落後 LAGGING — 驗證',P:'政策 POLICY — 央行/財政'};
  order.forEach(t=>{
    const blks=r.blocks.filter(b=>b.t===t); if(!blks.length)return;
    h+=`<div class="timing-sec"><div class="ts-h"><span class="bd ${t}">${t}</span>${labels[t]}</div>`;
    blks.forEach(b=>{ h+=renderBlock(b); });
    h+=`</div>`;
  });
  return h;
}
function renderBlock(b){
  let rows=b.items.map(it=>`<tr>
    <td>${it.n}</td>
    <td><span class="mono">${it.code}</span></td>
    <td><span class="bd ${it.t}">${it.t}</span></td>
    <td class="mono">${it.f}</td>
    <td class="note">${it.note||''}</td></tr>`).join('');
  return `<div class="cd"><div class="cd-h"><div class="cd-t">${b.cat}</div><span class="bd ${b.t}">${b.t}</span></div>
    <table class="mx"><thead><tr><th>指標 Indicator</th><th>代碼/來源</th><th>時序</th><th>頻率</th><th>備註</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}
document.addEventListener('keydown',e=>{
  const btns=[...document.querySelectorAll('#tabs button')];
  if(e.key>='1'&&e.key<=String(btns.length)) btns[+e.key-1]?.click();
});
