function realgap(e){return ('gap' in e)&&!e.gap_resolved;}
function st(e){return realgap(e)?'gap':(e.chk?'chk':'ok');}

 const rows=Object.entries(S).filter(([,e])=>e.macro_theme===key);if(!rows.length)return;
 const b=document.createElement('button');if(i===0)b.className='on';
 b.innerHTML=label+`<span class="ct">${rows.length}</span>`;b.onclick=()=>sw(b,'pg'+key);tabs.appendChild(b);

function sw(btn,id){document.querySelectorAll('#tabs button').forEach(b=>b.classList.remove('on'));document.querySelectorAll('.pg').forEach(p=>p.classList.remove('on'));btn.classList.add('on');document.getElementById(id).classList.add('on');applyF();window.scrollTo({top:0,behavior:'smooth'});}
function srcChips(e){return (e.sources||[]).map(s=>{
  const cls=(s.provider==='FRED'||s.provider==='akshare'||s.provider==='yfinance')?s.provider:'off';
  const pr=s.role==='primary'?' primary':'';
  return `<span class="src ${cls}${pr}" title="${s.role}${s.via?(' · '+s.via):''}">${s.provider}${s.id!=='—'?(':'+s.id):''}</span>`;}).join('');}
function renderTheme(rows){
 const subs={};rows.forEach(([vc,e])=>{(subs[e.sub_theme]=subs[e.sub_theme]||[]).push([vc,e]);});
 let h='';Object.entries(subs).forEach(([sub,items])=>{
  h+=`<div class="cd"><div class="cd-h"><div class="cd-t">${sub}<span class="sub">${items.length} 項</span></div></div>
  <table class="mx"><thead><tr><th>指標</th><th>VDF</th><th>頻</th><th>來源鏈 (主源加框)</th><th>狀態</th></tr></thead><tbody>`;
  items.forEach(([vc,e])=>{
   const s=st(e),multi=e.multi;
   const stb=s==='ok'?(e.gap_resolved?'<span class="bd res">✓ 已解</span>':'<span class="bd ok">● OK</span>'):s==='chk'?'<span class="bd chk">▲ 複核</span>':'<span class="bd gap">■ 缺口</span>';
   const mb=multi?'<span class="bd m">◎ 對照</span>':'';
   const recon=e.reconcile?`<div class="recon">⇄ ${e.reconcile}</div>`:'';
   const gp=(('gap' in e)&&!e.gap_resolved)?`<div class="note">⚠ ${e.gap}</div>`:'';
   const hay=(vc+' '+e.indicator+' '+e.fred_id+' '+(e.sources||[]).map(x=>x.provider+x.id).join(' ')).toLowerCase();
   h+=`<tr data-s="${s}" data-m="${multi?1:0}" data-r="${e.gap_resolved?1:0}" data-h="${hay}">
   <td>${e.indicator}${gp}${recon}</td><td class="mono">${vc}</td><td class="mono">${e.freq}</td>
   <td>${srcChips(e)}</td><td>${stb} ${mb}</td></tr>`;});
  h+=`</tbody></table></div>`;});
 return h;}
let F='ALL';
function setF(b){document.querySelectorAll('.fbar .bn').forEach(x=>x.classList.remove('on'));b.classList.add('on');F=b.dataset.f;applyF();}
function applyF(){const q=document.getElementById('q').value.trim().toLowerCase();
 document.querySelectorAll('.pg.on tr[data-s]').forEach(tr=>{let ok=true;
  if(F==='multi')ok=tr.dataset.m==='1';else if(F==='res')ok=tr.dataset.r==='1';else if(F!=='ALL')ok=tr.dataset.s===F;
  if(ok&&q)ok=tr.dataset.h.includes(q);tr.classList.toggle('hide',!ok);});}
